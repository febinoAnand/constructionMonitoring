<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customers</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div class="app-shell">
  <div class="sidebar-backdrop"></div>
  <aside class="sidebar" id="sidebar"></aside>

  <div class="main">
    <header class="topbar" id="topbar"></header>

    <main class="content">
      <div class="page-header-row">
        <div>
          <h2>Customers</h2>
          <p>Clients you're building for, and what each one owes.</p>
        </div>
        <button class="btn btn-primary" id="addBtn">+ Add Customer</button>
      </div>

      <div class="stat-grid stat-grid-tight" id="statGrid"></div>

      <div class="table-card">
        <div class="table-toolbar">
          <div class="search-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" id="searchInput" placeholder="Search customers...">
          </div>
          <span class="toolbar-meta" id="toolbarMeta"></span>
        </div>
        <div class="table-scroll">
          <table class="data-table">
            <thead><tr><th>Customer</th><th>Contact</th><th>Projects</th><th>Total Billed</th><th>Paid</th><th>Balance Due</th><th></th></tr></thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>

<div class="modal-overlay" id="custModal">
  <div class="modal-box">
    <div class="modal-header">
      <div><h3 id="modalTitle">Add Customer</h3><p>Client / customer master details.</p></div>
      <button class="modal-close" id="closeModal">&times;</button>
    </div>
    <div class="modal-body">
      <form id="custForm">
        <input type="hidden" id="editId">
        <div class="field-grid">
          <div class="field full"><label>Customer / Company Name <span class="req">*</span></label><input type="text" id="fName" required></div>
          <div class="field"><label>Contact Person</label><input type="text" id="fContact"></div>
          <div class="field"><label>Phone</label><input type="text" id="fPhone"></div>
          <div class="field"><label>Email</label><input type="email" id="fEmail"></div>
          <div class="field"><label>GSTIN</label><input type="text" id="fGstin"></div>
          <div class="field full"><label>Address</label><input type="text" id="fAddress"></div>
          <div class="field full"><label>Notes</label><textarea id="fNotes"></textarea></div>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" id="cancelModal">Cancel</button>
      <button class="btn btn-primary" id="saveBtn">Save Customer</button>
    </div>
  </div>
</div>

<script src="assets/data.js"></script>
<script src="assets/business.js"></script>
<script src="assets/app.js"></script>
<script src="assets/charts.js"></script>
<script>
  App.requireAuth();
  App.renderShell({ active: "customers", title: "Customers", subtitle: "Clients & billing" });

  if (!App.guardPermission("customers", "read")) {
    document.querySelector(".content").style.display = "none";
  } else {
    var canCreate = App.can("customers", "create");
    var canEdit = App.can("customers", "update");
    var canDelete = App.can("customers", "delete");
    if (!canCreate) document.getElementById("addBtn").style.display = "none";

    var searchTerm = "";

    function renderStats() {
      var customers = Data.getCustomers();
      var totalDue = 0, totalInvoiced = 0;
      customers.forEach(function (c) {
        var l = Business.getCustomerLedger(c.id);
        totalDue += l.balanceDue;
        totalInvoiced += l.invoiced;
      });
      document.getElementById("statGrid").innerHTML =
        '<div class="stat-card"><div class="stat-icon icon-amber">' + App.svg("briefcase") + '</div><div class="stat-value">' + customers.length + '</div><div class="stat-label">Customers</div></div>' +
        '<div class="stat-card"><div class="stat-icon icon-blue">' + App.svg("fileText") + '</div><div class="stat-value">₹' + Charts.fmtCompact(totalInvoiced) + '</div><div class="stat-label">Total billed</div></div>' +
        '<div class="stat-card"><div class="stat-icon icon-orange">' + App.svg("wallet") + '</div><div class="stat-value">₹' + Charts.fmtCompact(totalDue) + '</div><div class="stat-label">Total balance due</div></div>';
    }

    function render() {
      renderStats();
      var customers = Data.getCustomers().filter(function (c) {
        var t = searchTerm.toLowerCase();
        return !t || c.name.toLowerCase().indexOf(t) !== -1 || (c.contactPerson || "").toLowerCase().indexOf(t) !== -1;
      });
      document.getElementById("toolbarMeta").textContent = customers.length + " customer(s)";

      var projects = Data.getProjects();
      var tbody = document.getElementById("tableBody");
      if (!customers.length) {
        tbody.innerHTML = '<tr><td colspan="7"><div class="empty-state compact">' + App.svg("briefcase") + '<p>No customers yet.</p></div></td></tr>';
        return;
      }

      tbody.innerHTML = customers.map(function (c) {
        var linkedProjects = projects.filter(function (p) { return p.customerId === c.id; });
        var l = Business.getCustomerLedger(c.id);
        return '<tr>' +
          '<td><a href="customer-detail.html?id=' + c.id + '"><strong>' + c.name + '</strong></a>' + (c.gstin ? '<br><span class="cell-mono">' + c.gstin + '</span>' : '') + '</td>' +
          '<td>' + (c.contactPerson || "—") + '<br><span class="desc-cell">' + (c.phone || "") + '</span></td>' +
          '<td>' + (linkedProjects.map(function (p) { return '<span class="chip chip-blue">' + p.code + '</span>'; }).join(" ") || '<span class="desc-cell">None linked</span>') + '</td>' +
          '<td class="total-amount">₹' + Charts.fmtCompact(l.invoiced) + '</td>' +
          '<td class="total-amount">₹' + Charts.fmtCompact(l.received) + '</td>' +
          '<td class="total-amount">₹' + Charts.fmtCompact(l.balanceDue) + '</td>' +
          '<td>' +
            '<div class="row-actions">' +
              '<button class="action-trigger" data-menu-toggle="' + c.id + '">' + App.svg("dots") + '</button>' +
              '<div class="action-menu" data-menu="' + c.id + '">' +
                '<button data-view="' + c.id + '">' + App.svg("arrowRight") + ' View ledger (accounts)</button>' +
                (canEdit ? '<button data-edit="' + c.id + '">' + App.svg("edit") + ' Edit</button>' : "") +
                (canDelete ? '<button class="danger" data-delete="' + c.id + '">' + App.svg("trash") + ' Delete</button>' : "") +
              '</div>' +
            '</div>' +
          '</td>' +
        '</tr>';
      }).join("");
    }

    document.getElementById("searchInput").addEventListener("input", function (e) { searchTerm = e.target.value; render(); });

    var openMenuId = null;
    document.addEventListener("click", function (e) {
      var toggle = e.target.closest("[data-menu-toggle]");
      document.querySelectorAll(".action-menu.show").forEach(function (m) { m.classList.remove("show"); });
      if (toggle) {
        var id = toggle.getAttribute("data-menu-toggle");
        openMenuId = id;
        App.positionActionMenu(id);
        document.querySelector('[data-menu="' + id + '"]').classList.add("show");
        return;
      }
      var view = e.target.closest("[data-view]");
      if (view) { window.location.href = "customer-detail.html?id=" + view.getAttribute("data-view"); return; }
      var edit = e.target.closest("[data-edit]");
      if (edit) { openModal(edit.getAttribute("data-edit")); return; }
      var del = e.target.closest("[data-delete]");
      if (del) { deleteCust(del.getAttribute("data-delete")); return; }
    });
    window.addEventListener("scroll", function () { if (openMenuId) App.positionActionMenu(openMenuId); }, true);

    function deleteCust(id) {
      if (!confirm("Delete this customer? Their ledger history will remain but show as unlinked.")) return;
      Data.saveCustomers(Data.getCustomers().filter(function (c) { return c.id !== id; }));
      App.showToast("Customer deleted");
      render();
    }

    var modal = document.getElementById("custModal");
    function openModal(id) {
      document.getElementById("custForm").reset();
      document.getElementById("editId").value = id || "";
      if (id) {
        var c = Data.getCustomers().find(function (x) { return x.id === id; });
        document.getElementById("modalTitle").textContent = "Edit Customer";
        document.getElementById("fName").value = c.name;
        document.getElementById("fContact").value = c.contactPerson || "";
        document.getElementById("fPhone").value = c.phone || "";
        document.getElementById("fEmail").value = c.email || "";
        document.getElementById("fGstin").value = c.gstin || "";
        document.getElementById("fAddress").value = c.address || "";
        document.getElementById("fNotes").value = c.notes || "";
      } else {
        document.getElementById("modalTitle").textContent = "Add Customer";
      }
      modal.classList.add("show");
    }
    function closeModal() { modal.classList.remove("show"); }

    document.getElementById("addBtn").addEventListener("click", function () { openModal(null); });
    document.getElementById("closeModal").addEventListener("click", closeModal);
    document.getElementById("cancelModal").addEventListener("click", closeModal);
    modal.addEventListener("click", function (e) { if (e.target === modal) closeModal(); });

    document.getElementById("saveBtn").addEventListener("click", function () {
      var name = document.getElementById("fName").value.trim();
      if (!name) { App.showToast("Customer name is required", true); return; }

      var id = document.getElementById("editId").value;
      var record = {
        id: id || Data.uid("c"),
        name: name,
        contactPerson: document.getElementById("fContact").value.trim(),
        phone: document.getElementById("fPhone").value.trim(),
        email: document.getElementById("fEmail").value.trim(),
        gstin: document.getElementById("fGstin").value.trim(),
        address: document.getElementById("fAddress").value.trim(),
        notes: document.getElementById("fNotes").value.trim()
      };

      var customers = Data.getCustomers();
      customers = id ? customers.map(function (c) { return c.id === id ? record : c; }) : customers.concat([record]);
      Data.saveCustomers(customers);
      App.showToast(id ? "Customer updated" : "Customer added");
      closeModal();
      render();
    });

    render();
  }
</script>
</body>
</html>
