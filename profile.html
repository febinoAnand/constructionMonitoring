<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div class="app-shell">
  <div class="sidebar-backdrop"></div>
  <aside class="sidebar" id="sidebar"></aside>

  <div class="main">
    <header class="topbar" id="topbar"></header>

    <main class="content">
      <div class="page-header-row">
        <div><h2>Profile</h2><p>Your account details in this demo session.</p></div>
      </div>

      <div class="detail-grid">
        <div class="detail-card">
          <div class="detail-card-header">Account</div>
          <div class="detail-rows" id="infoRows"></div>
        </div>
        <div class="detail-card">
          <div class="detail-card-header">Assigned Projects</div>
          <div id="assignedList" style="padding:18px 20px"></div>
        </div>
      </div>

      <div class="panel full-panel" style="margin-top:20px">
        <div class="panel-header">
          <h3>Security</h3>
          <button type="button" class="btn btn-outline" id="openChangePasswordBtn" style="padding:8px 16px;font-size:12.5px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg> Change Password</button>
        </div>
        <p class="section-subheading" style="margin:0 20px 18px">Keep your account secure by updating your password periodically.</p>
      </div>
    </main>
  </div>
</div>

<div class="modal-overlay" id="changePasswordModal">
  <div class="modal-box">
    <div class="modal-header">
      <div><h3>Change Password</h3><p>Update the password for your account.</p></div>
      <button class="modal-close" id="closeChangePasswordModal">&times;</button>
    </div>
    <div class="modal-body">
      <form id="changePasswordForm">
        <div class="field-grid">
          <div class="field full"><label>Current Password <span class="req">*</span></label><input type="password" id="cpCurrent" required></div>
          <div class="field full"><label>New Password <span class="req">*</span></label><input type="password" id="cpNew" required minlength="6"></div>
          <div class="field full"><label>Confirm New Password <span class="req">*</span></label><input type="password" id="cpConfirm" required minlength="6"></div>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" id="cancelChangePasswordModal">Cancel</button>
      <button class="btn btn-primary" id="saveChangePasswordBtn">Update Password</button>
    </div>
  </div>
</div>

<script src="assets/data.js"></script>
<script src="assets/business.js"></script>
<script src="assets/app.js"></script>
<script src="assets/charts.js"></script>
<script>
  App.requireAuth();
  App.renderShell({ active: "profile", title: "Profile", subtitle: "Your account" });

  var user = App.getCurrentUser();
  var role = App.getCurrentRole();

  function row(label, value) {
    return '<div class="detail-row"><span class="detail-label">' + label + '</span><span class="detail-value">' + value + '</span></div>';
  }

  document.getElementById("infoRows").innerHTML =
    row("Name", user.name) +
    row("Role", role ? role.name : "—") +
    row("Phone", user.phone || "—") +
    row("Access", role && role.allProjects ? "All projects" : "Only assigned project(s) below");

  var assignedEl = document.getElementById("assignedList");
  var projects = App.visibleProjects();
  if (!projects.length) {
    assignedEl.innerHTML = '<div class="empty-state compact">' + App.svg("building") + '<p>No projects assigned yet.</p></div>';
  } else {
    assignedEl.innerHTML = '<div class="activity-list">' + projects.map(function (p) {
      return '<div class="activity-item"><div class="activity-dot"></div><div><p><a href="project-overview.html?id=' + p.id + '"><strong>' + p.name + '</strong></a></p><span>' + p.code + ' · ' + (p.clientName || "") + '</span></div></div>';
    }).join("") + '</div>';
  }

  var changePasswordModal = document.getElementById("changePasswordModal");
  document.getElementById("openChangePasswordBtn").addEventListener("click", function () {
    document.getElementById("changePasswordForm").reset();
    changePasswordModal.classList.add("show");
  });
  function closeChangePasswordModal() { changePasswordModal.classList.remove("show"); }
  document.getElementById("closeChangePasswordModal").addEventListener("click", closeChangePasswordModal);
  document.getElementById("cancelChangePasswordModal").addEventListener("click", closeChangePasswordModal);
  changePasswordModal.addEventListener("click", function (e) { if (e.target === changePasswordModal) closeChangePasswordModal(); });
  document.getElementById("saveChangePasswordBtn").addEventListener("click", function () {
    var newPass = document.getElementById("cpNew").value;
    var confirm = document.getElementById("cpConfirm").value;
    if (!document.getElementById("cpCurrent").value) { App.showToast("Enter your current password", true); return; }
    if (newPass !== confirm) { App.showToast("New password and confirmation don't match", true); return; }
    if (newPass.length < 6) { App.showToast("Password must be at least 6 characters", true); return; }
    closeChangePasswordModal();
    App.showToast("Password updated");
  });
</script>
</body>
</html>
