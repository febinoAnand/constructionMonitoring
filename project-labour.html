<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Labour</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div class="app-shell">
  <div class="sidebar-backdrop"></div>
  <aside class="sidebar" id="sidebar"></aside>

  <div class="main">
    <header class="topbar" id="topbar"></header>

    <main class="content">
      <div class="page-header-row">
        <div><h2 id="projName">Loading…</h2><p id="projMeta"></p></div>
      </div>

      <div id="tabsMount"></div>
      <div id="pageBody"></div>
    </main>
  </div>
</div>

<div class="modal-overlay" id="attEditModal">
  <div class="modal-box">
    <div class="modal-header">
      <div><h3>Edit Attendance Entry</h3><p>Adjust this attendance record.</p></div>
      <button class="modal-close" id="closeAttEditModal">&times;</button>
    </div>
    <div class="modal-body">
      <form id="attEditForm">
        <input type="hidden" id="aeId">
        <div class="field-grid">
          <div class="field"><label>Date</label><input type="date" id="aeDate"></div>
          <div class="field"><label>Days Worked</label><select id="aeDays"><option value="1">Full day (1.0)</option><option value="0.5">Half day (0.5)</option><option value="1.5">Overtime (1.5)</option></select></div>
          <div class="field"><label>Wage Rate (₹/day)</label><input type="number" id="aeRate" min="0"></div>
          <div class="field"><label>Status</label><select id="aeStatus"><option value="present">Present</option><option value="absent">Absent</option></select></div>
          <div class="field full"><label>Notes</label><input type="text" id="aeNotes"></div>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" id="cancelAttEditModal">Cancel</button>
      <button class="btn btn-primary" id="saveAttEditBtn">Save Changes</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="attDownloadModal">
  <div class="modal-box">
    <div class="modal-header">
      <div><h3>Download Attendance History</h3><p>Choose a file format and date range to export.</p></div>
      <button class="modal-close" id="closeAttDownloadModal">&times;</button>
    </div>
    <div class="modal-body">
      <form id="attDownloadForm">
        <div class="field-grid">
          <div class="field full">
            <label>File Format</label>
            <div class="format-toggle" id="adlFormatToggle">
              <button type="button" class="format-toggle-btn active" data-format="pdf">PDF</button>
              <button type="button" class="format-toggle-btn" data-format="csv">CSV</button>
            </div>
            <input type="hidden" id="adlFormat" value="pdf">
          </div>
          <div class="field"><label>From Date</label><input type="date" id="adlFrom"></div>
          <div class="field"><label>To Date</label><input type="date" id="adlTo"></div>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" id="cancelAttDownloadModal">Cancel</button>
      <button class="btn btn-primary" id="confirmAttDownloadBtn">Download</button>
    </div>
  </div>
</div>

<script src="assets/data.js"></script>
<script src="assets/business.js"></script>
<script src="assets/app.js"></script>
<script src="assets/charts.js"></script>
<script>
  App.requireAuth();
  var projectId = new URLSearchParams(window.location.search).get("id");
  var project = Data.getProjects().find(function (p) { return p.id === projectId; });
  App.renderShell({ active: "projects", title: project ? project.name : "Project", subtitle: "Labour & attendance" });

  if (!project || !App.guardProjectAccess(projectId)) {
    document.getElementById("projName").textContent = project ? "Access restricted" : "Project not found";
  } else {
    document.getElementById("projName").textContent = project.name;
    document.getElementById("projMeta").textContent = project.code;
    document.getElementById("tabsMount").innerHTML = App.projectTabsHtml(projectId, "labour");

    var canCreate = App.can("labour", "create");
    var canDelete = App.can("labour", "delete");
    var canEditAtt = App.can("labour", "update");
    var PAGE_SIZE = 10;
    var attPage = 1;
    var attFrom = "", attTo = "";

    document.getElementById("pageBody").innerHTML =
      (canCreate ?
      '<div class="panel full-panel">' +
        '<div class="panel-header"><h3>Mark Attendance</h3></div>' +
        '<form class="inline-add-form" id="attForm">' +
          '<div class="field" style="flex:2;min-width:220px">' +
            '<label>Labourer</label>' +
            '<div class="combo-wrap" id="attComboWrap">' +
              '<input type="text" id="attLabInput" placeholder="Search labourer...">' +
              '<div class="combo-panel" id="attComboPanel"></div>' +
              '<input type="hidden" id="attLabId">' +
            '</div>' +
          '</div>' +
          '<div class="field"><label>Date</label><input type="date" id="attDate"></div>' +
          '<div class="field"><label>Days Worked</label><select id="attDays"><option value="1">Full day (1.0)</option><option value="0.5">Half day (0.5)</option><option value="1.5">Overtime (1.5)</option></select></div>' +
          '<button type="submit" class="btn btn-primary">+ Mark Present</button>' +
        '</form>' +
      '</div>' : '') +
      '<div class="stat-grid stat-grid-tight" id="statGrid"></div>' +
      '<div class="panel full-panel">' +
        '<div class="panel-header"><h3>Labour Works — Days Worked by Labourer</h3></div>' +
        '<div id="labourWorkChart"></div>' +
      '</div>' +
      '<div class="panel full-panel">' +
        '<div class="panel-header"><h3>Attendance History</h3><span class="panel-tag" id="attCount"></span></div>' +
        '<form class="inline-add-form" id="attFilterForm" style="padding:0 20px 14px">' +
          '<div class="field"><label>From</label><input type="date" id="attFromInput"></div>' +
          '<div class="field"><label>To</label><input type="date" id="attToInput"></div>' +
          '<button type="submit" class="btn btn-outline" style="padding:9px 16px">Apply</button>' +
          '<button type="button" class="btn btn-outline" id="attFilterClear" style="padding:9px 16px">Clear</button>' +
        '</form>' +
        '<div class="table-scroll"><table class="data-table"><thead><tr id="attHeadRow"></tr></thead><tbody id="attBody"></tbody></table></div>' +
        '<div class="panel-footer-row" style="justify-content:flex-end" id="attPager"></div>' +
        '<div class="panel-footer-row"><button class="btn btn-outline" id="attDownloadBtn">' + App.svg("download") + ' Download</button></div>' +
      '</div>' +
      '<p class="section-subheading" style="margin-top:14px">Wage payments and the per-labourer wage summary have moved to the <a href="project-wages.html?id=' + projectId + '">Wages</a> tab.</p>';

    if (document.getElementById("attDate")) document.getElementById("attDate").value = Data.isoDate(Data.today());

    var activeLabourers = Data.getLabourers().filter(function (l) { return l.isActive; });

    function setupCombo(inputId, panelId, wrapId, hiddenId) {
      var input = document.getElementById(inputId);
      var panel = document.getElementById(panelId);
      var wrap = document.getElementById(wrapId);
      var hidden = document.getElementById(hiddenId);
      if (!input || !panel || !wrap || !hidden) return;
      App.initCombobox({
        wrap: wrap, input: input, panel: panel, items: activeLabourers,
        getInitial: function (l) { return l.name.charAt(0); },
        getLabel: function (l) { return l.name; },
        getSub: function (l) { return l.skill + " · ₹" + l.defaultDailyWage + "/day"; },
        matches: function (l, term) { return !term || l.name.toLowerCase().indexOf(term) !== -1 || l.skill.toLowerCase().indexOf(term) !== -1; },
        onSelect: function (l) { input.value = l.name; hidden.value = l.id; }
      });
      input.addEventListener("input", function () { hidden.value = ""; });
    }
    setupCombo("attLabInput", "attComboPanel", "attComboWrap", "attLabId");

    var attSortState = { field: null, dir: "asc" };
    document.getElementById("attHeadRow").innerHTML =
      App.sortableTh("Date", "date", attSortState) +
      App.sortableTh("Labourer", "labourerName", attSortState) +
      App.sortableTh("Days", "daysWorked", attSortState) +
      App.sortableTh("Amount", "amount", attSortState) +
      (canEditAtt || canDelete ? '<th></th>' : '');
    App.wireSort(document.getElementById("attHeadRow"), attSortState, function () { attPage = 1; renderAttendance(); });

    function renderStats() {
      var attendance = Data.getAttendance().filter(function (a) { return a.projectId === projectId; });
      var uniqueLabourers = new Set(attendance.map(function (a) { return a.labourerId; })).size;
      var halfDays = attendance.filter(function (a) { return a.daysWorked < 1; }).length;
      document.getElementById("statGrid").innerHTML =
        '<div class="stat-card"><div class="stat-icon icon-amber">' + App.svg("people") + '</div><div class="stat-value">' + uniqueLabourers + '</div><div class="stat-label">Labourers worked here</div></div>' +
        '<div class="stat-card"><div class="stat-icon icon-blue">' + App.svg("calendar") + '</div><div class="stat-value">' + attendance.length + '</div><div class="stat-label">Attendance entries</div></div>' +
        '<div class="stat-card"><div class="stat-icon icon-orange">' + App.svg("clock") + '</div><div class="stat-value">' + halfDays + '</div><div class="stat-label">Half-day entries</div></div>';

      var daysByLabourer = {};
      attendance.forEach(function (a) {
        daysByLabourer[a.labourerId] = (daysByLabourer[a.labourerId] || 0) + a.daysWorked;
      });
      var chartItems = Object.keys(daysByLabourer).map(function (labId) {
        var lab = Data.getLabourers().find(function (l) { return l.id === labId; });
        return { label: lab ? lab.name.split(" ")[0] : labId, value: daysByLabourer[labId] };
      }).sort(function (a, b) { return b.value - a.value; }).slice(0, 10);
      Charts.renderBarChart(document.getElementById("labourWorkChart"), chartItems, { formatValue: function (v) { return v + " days"; } });
    }

    function getFilteredAttendance(from, to) {
      return Data.getAttendance().filter(function (a) {
        if (a.projectId !== projectId) return false;
        if (from && a.date < from) return false;
        if (to && a.date > to) return false;
        return true;
      });
    }

    function attSortAccessor(a, field) {
      if (field === "labourerName") { var lb = Data.getLabourers().find(function (l) { return l.id === a.labourerId; }); return lb ? lb.name : ""; }
      if (field === "amount") return a.daysWorked * a.wageRate;
      return a[field];
    }

    function renderAttendance() {
      var all = getFilteredAttendance(attFrom, attTo);
      document.getElementById("attCount").textContent = all.length + " entries";

      all = App.sortRows(
        all,
        attSortState.field ? attSortState : { field: "date", dir: "desc" },
        attSortAccessor
      );

      var pg = App.paginate(all, attPage, PAGE_SIZE);
      attPage = pg.page;

      var body = document.getElementById("attBody");
      var showActions = canEditAtt || canDelete;
      if (!pg.pageItems.length) {
        body.innerHTML = '<tr><td colspan="' + (showActions ? 5 : 4) + '"><div class="empty-state compact">' + App.svg("calendar") + '<p>No attendance recorded in this range.</p></div></td></tr>';
      } else {
        body.innerHTML = pg.pageItems.map(function (a) {
          var lab = Data.getLabourers().find(function (l) { return l.id === a.labourerId; });
          return '<tr>' +
            '<td>' + Data.displayDate(a.date) + '</td>' +
            '<td>' + (lab ? lab.name : "—") + '</td>' +
            '<td>' + a.daysWorked + '</td>' +
            '<td>₹' + Math.round(a.daysWorked * a.wageRate) + '</td>' +
            (showActions ? '<td><div class="action-buttons-row">' +
              (canEditAtt ? '<button class="action-trigger" data-edit-att="' + a.id + '">' + App.svg("edit") + '</button>' : "") +
              (canDelete ? '<button class="action-trigger" data-del-att="' + a.id + '">' + App.svg("trash") + '</button>' : "") +
            '</div></td>' : '') +
          '</tr>';
        }).join("");
      }

      App.renderPager(document.getElementById("attPager"), attPage, pg.totalPages, function (newPage) { attPage = newPage; renderAttendance(); });
    }

    function renderAll() { renderStats(); renderAttendance(); }

    var attFormEl = document.getElementById("attForm");
    if (attFormEl) attFormEl.addEventListener("submit", function (e) {
      e.preventDefault();
      var labId = document.getElementById("attLabId").value;
      if (!labId) { App.showToast("Pick a labourer from the list", true); return; }
      var date = document.getElementById("attDate").value;
      var days = Number(document.getElementById("attDays").value);
      var result = Data.addAttendance({ labourerId: labId, projectId: projectId, date: date, daysWorked: days, status: "present", notes: "", markedByUserId: App.getCurrentUser().id });
      if (!result.ok) { App.showToast(result.error, true); return; }
      App.showToast("Attendance marked");
      document.getElementById("attLabInput").value = "";
      document.getElementById("attLabId").value = "";
      renderAll();
    });

    document.getElementById("attBody").addEventListener("click", function (e) {
      var del = e.target.closest("[data-del-att]");
      if (del) {
        Data.saveAttendance(Data.getAttendance().filter(function (a) { return a.id !== del.getAttribute("data-del-att"); }));
        App.showToast("Attendance entry removed");
        renderAll();
        return;
      }
      var edit = e.target.closest("[data-edit-att]");
      if (edit) { openAttEditModal(edit.getAttribute("data-edit-att")); return; }
    });

    document.getElementById("attFilterForm").addEventListener("submit", function (e) {
      e.preventDefault();
      attFrom = document.getElementById("attFromInput").value;
      attTo = document.getElementById("attToInput").value;
      attPage = 1;
      renderAttendance();
    });
    document.getElementById("attFilterClear").addEventListener("click", function () {
      document.getElementById("attFromInput").value = "";
      document.getElementById("attToInput").value = "";
      attFrom = ""; attTo = ""; attPage = 1;
      renderAttendance();
    });

    var attEditModal = document.getElementById("attEditModal");
    function openAttEditModal(id) {
      var a = Data.getAttendance().find(function (x) { return x.id === id; });
      if (!a) return;
      document.getElementById("aeId").value = a.id;
      document.getElementById("aeDate").value = a.date;
      document.getElementById("aeDays").value = a.daysWorked;
      document.getElementById("aeRate").value = a.wageRate;
      document.getElementById("aeStatus").value = a.status || "present";
      document.getElementById("aeNotes").value = a.notes || "";
      attEditModal.classList.add("show");
    }
    function closeAttEditModal() { attEditModal.classList.remove("show"); }
    document.getElementById("closeAttEditModal").addEventListener("click", closeAttEditModal);
    document.getElementById("cancelAttEditModal").addEventListener("click", closeAttEditModal);
    attEditModal.addEventListener("click", function (e) { if (e.target === attEditModal) closeAttEditModal(); });
    document.getElementById("saveAttEditBtn").addEventListener("click", function () {
      var id = document.getElementById("aeId").value;
      var all = Data.getAttendance().map(function (x) {
        if (x.id !== id) return x;
        return Object.assign({}, x, {
          date: document.getElementById("aeDate").value,
          daysWorked: Number(document.getElementById("aeDays").value),
          wageRate: Number(document.getElementById("aeRate").value) || x.wageRate,
          status: document.getElementById("aeStatus").value,
          notes: document.getElementById("aeNotes").value.trim()
        });
      });
      Data.saveAttendance(all);
      App.showToast("Attendance entry updated");
      closeAttEditModal();
      renderAll();
    });

    var attDownloadModal = document.getElementById("attDownloadModal");
    document.getElementById("attDownloadBtn").addEventListener("click", function () {
      document.getElementById("adlFrom").value = attFrom || "";
      document.getElementById("adlTo").value = attTo || Data.isoDate(Data.today());
      document.getElementById("adlFormat").value = "pdf";
      document.querySelectorAll("#adlFormatToggle .format-toggle-btn").forEach(function (b) { b.classList.toggle("active", b.getAttribute("data-format") === "pdf"); });
      attDownloadModal.classList.add("show");
    });
    document.getElementById("adlFormatToggle").addEventListener("click", function (e) {
      var btn = e.target.closest("[data-format]");
      if (!btn) return;
      document.querySelectorAll("#adlFormatToggle .format-toggle-btn").forEach(function (b) { b.classList.remove("active"); });
      btn.classList.add("active");
      document.getElementById("adlFormat").value = btn.getAttribute("data-format");
    });
    function closeAttDownloadModal() { attDownloadModal.classList.remove("show"); }
    document.getElementById("closeAttDownloadModal").addEventListener("click", closeAttDownloadModal);
    document.getElementById("cancelAttDownloadModal").addEventListener("click", closeAttDownloadModal);
    attDownloadModal.addEventListener("click", function (e) { if (e.target === attDownloadModal) closeAttDownloadModal(); });
    document.getElementById("confirmAttDownloadBtn").addEventListener("click", function () {
      var format = document.getElementById("adlFormat").value;
      var adlFrom = document.getElementById("adlFrom").value;
      var adlTo = document.getElementById("adlTo").value;
      var rows = App.sortRows(getFilteredAttendance(adlFrom, adlTo), attSortState.field ? attSortState : { field: "date", dir: "desc" }, attSortAccessor);
      var rangeText = (adlFrom || adlTo) ? " (" + (adlFrom ? Data.displayDate(adlFrom) : "start") + " to " + (adlTo ? Data.displayDate(adlTo) : "today") + ")" : "";
      App.exportTable(format, project.code + "-attendance", "Attendance History — " + project.name + rangeText, project.code + rangeText,
        [
          { label: "Date", value: function (a) { return Data.displayDate(a.date); } },
          { label: "Labourer", value: function (a) { var lab = Data.getLabourers().find(function (l) { return l.id === a.labourerId; }); return lab ? lab.name : "—"; } },
          { label: "Days", key: "daysWorked" },
          { label: "Amount", value: function (a) { return "₹" + Math.round(a.daysWorked * a.wageRate); } }
        ], rows);
      closeAttDownloadModal();
      App.showToast("Your " + format.toUpperCase() + " file is downloading...");
    });

    renderAll();
  }
</script>
</body>
</html>
