<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quotations</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div class="app-shell">
  <div class="sidebar-backdrop"></div>
  <aside class="sidebar" id="sidebar"></aside>

  <div class="main">
    <header class="topbar" id="topbar"></header>

    <main class="content">
      <div class="page-header-row">
        <div>
          <h2>Quotations</h2>
          <p>Compare store price quotes for materials, and see which store quoted the least for each one.</p>
        </div>
        <button class="btn btn-primary" id="addBtn" data-require="stock:create">+ Add Quotation</button>
      </div>

      <div class="stat-grid stat-grid-tight" id="statGrid" style="margin-bottom:20px"></div>

      <div class="panel full-panel" style="margin-bottom:20px">
        <div class="panel-header"><h3>Best Price by Material</h3><span class="panel-tag" id="bestCount"></span></div>
        <div class="table-scroll">
          <table class="data-table">
            <thead><tr><th>Material</th><th>Lowest Quote</th><th>Store</th><th>Quoted On</th><th class="text-right">Stores Compared</th></tr></thead>
            <tbody id="bestBody"></tbody>
          </table>
        </div>
      </div>

      <div class="table-card">
        <div class="table-toolbar">
          <div class="search-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" id="searchInput" placeholder="Search by material or store...">
          </div>
          <span class="toolbar-meta" id="toolbarMeta"></span>
        </div>
        <div class="table-scroll">
          <table class="data-table">
            <thead><tr id="tableHeadRow"></tr></thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
        <div class="panel-footer-row" style="justify-content:flex-end" id="tablePager"></div>
      </div>
    </main>
  </div>
</div>

<div class="modal-overlay" id="quoteModal">
  <div class="modal-box">
    <div class="modal-header">
      <div><h3 id="modalTitle">Add Quotation</h3><p>Record a store's quoted price for a material so it can be compared against others.</p></div>
      <button class="modal-close" id="closeModal">&times;</button>
    </div>
    <div class="modal-body">
      <form id="quoteForm">
        <input type="hidden" id="editId">
        <div class="field-grid">
          <div class="field full"><label>Material <span class="req">*</span></label><select id="fMaterial"></select></div>
          <div class="field full"><label>Store Name <span class="req">*</span></label><input type="text" id="fStore" placeholder="e.g. Sri Balaji Steels" required></div>
          <div class="field"><label>Quoted Price (₹ per unit) <span class="req">*</span></label><input type="number" id="fPrice" min="0" step="0.01" required></div>
          <div class="field"><label>Date</label><input type="date" id="fDate"></div>
          <div class="field full"><label>Notes</label><input type="text" id="fNotes" placeholder="e.g. Valid till month end, bulk discount above 5 ton"></div>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" id="cancelModal">Cancel</button>
      <button class="btn btn-primary" id="saveBtn">Save Quotation</button>
    </div>
  </div>
</div>

<script src="assets/data.js"></script>
<script src="assets/business.js"></script>
<script src="assets/app.js"></script>
<script src="assets/charts.js"></script>
<script>
  App.requireAuth();
  App.renderShell({ active: "quotation", title: "Quotations", subtitle: "Store price comparison" });
  App.guardPermission("stock", "read");
  var canCreate = App.can("stock", "create");
  var canEdit = App.can("stock", "update");
  var canDelete = App.can("stock", "delete");
  if (!canCreate) document.getElementById("addBtn").style.display = "none";

  var searchTerm = "";
  var sortState = { field: null, dir: "asc" };
  var page = 1;
  var PAGE_SIZE = 10;

  document.getElementById("tableHeadRow").innerHTML =
    App.sortableTh("Material", "materialName", sortState) +
    App.sortableTh("Store", "storeName", sortState) +
    App.sortableTh("Price", "price", sortState, "text-right") +
    App.sortableTh("Quoted On", "date", sortState) +
    '<th>Notes</th>' +
    ((canEdit || canDelete) ? '<th></th>' : '');
  App.wireSort(document.getElementById("tableHeadRow"), sortState, function () { page = 1; render(); });

  /* Every quotation, joined with its material — the shared shape both the "best price"
     summary and the full comparison table are built from. */
  function getQuotationRows() {
    var materials = Data.getMaterials();
    return Data.getQuotations().map(function (q) {
      var m = materials.find(function (x) { return x.id === q.materialId; });
      return Object.assign({}, q, { materialName: m ? m.name : "Unknown material", unit: m ? m.unit : "" });
    });
  }

  /* Lowest-priced quote per material — the direct answer to "which store gives the least
     amount for this material". */
  function getBestByMaterial(rows) {
    var byMaterial = {};
    rows.forEach(function (r) {
      var g = byMaterial[r.materialId] || (byMaterial[r.materialId] = { materialName: r.materialName, unit: r.unit, count: 0, best: null });
      g.count += 1;
      if (!g.best || r.price < g.best.price) g.best = r;
    });
    return Object.keys(byMaterial).map(function (id) { return byMaterial[id]; })
      .sort(function (a, b) { return a.materialName < b.materialName ? -1 : 1; });
  }

  function render() {
    var rows = getQuotationRows();
    var bestGroups = getBestByMaterial(rows);
    var stores = {};
    rows.forEach(function (r) { stores[r.storeName] = true; });

    document.getElementById("statGrid").innerHTML =
      '<div class="stat-card"><div class="stat-icon icon-blue">' + App.svg("box") + '</div><div class="stat-value">' + bestGroups.length + '</div><div class="stat-label">Materials with quotes</div></div>' +
      '<div class="stat-card"><div class="stat-icon icon-amber">' + App.svg("briefcase") + '</div><div class="stat-value">' + Object.keys(stores).length + '</div><div class="stat-label">Stores quoted</div></div>' +
      '<div class="stat-card"><div class="stat-icon icon-green">' + App.svg("fileText") + '</div><div class="stat-value">' + rows.length + '</div><div class="stat-label">Quotations logged</div></div>';

    document.getElementById("bestCount").textContent = bestGroups.length + " material(s)";
    document.getElementById("bestBody").innerHTML = bestGroups.length
      ? bestGroups.map(function (g) {
          return '<tr>' +
            '<td><strong>' + g.materialName + '</strong></td>' +
            '<td class="total-amount">₹' + g.best.price.toLocaleString("en-IN") + ' / ' + g.unit + '</td>' +
            '<td><span class="chip chip-green">' + g.best.storeName + '</span></td>' +
            '<td>' + (g.best.date ? Data.displayDate(g.best.date) : "—") + '</td>' +
            '<td class="text-right">' + g.count + '</td>' +
          '</tr>';
        }).join("")
      : '<tr><td colspan="5"><div class="empty-state compact">' + App.svg("fileText") + '<p>No quotations recorded yet.</p></div></td></tr>';

    var term = searchTerm.toLowerCase();
    var filtered = rows.filter(function (r) {
      return !term || r.materialName.toLowerCase().indexOf(term) !== -1 || r.storeName.toLowerCase().indexOf(term) !== -1;
    });
    document.getElementById("toolbarMeta").textContent = filtered.length + " quotation(s)";

    var tbody = document.getElementById("tableBody");
    if (!filtered.length) {
      tbody.innerHTML = '<tr><td colspan="6"><div class="empty-state compact">' + App.svg("fileText") + '<p>' + (searchTerm ? "No quotations match your search." : "No quotations recorded yet.") + '</p></div></td></tr>';
      document.getElementById("tablePager").innerHTML = "";
      return;
    }

    var sorted = App.sortRows(filtered, sortState.field ? sortState : { field: "materialName", dir: "asc" });
    var pg = App.paginate(sorted, page, PAGE_SIZE);
    page = pg.page;

    tbody.innerHTML = pg.pageItems.map(function (r) {
      var bestForMaterial = bestGroups.find(function (g) { return g.materialName === r.materialName; });
      var isBest = bestForMaterial && bestForMaterial.best.id === r.id;
      return '<tr>' +
        '<td><strong>' + r.materialName + '</strong></td>' +
        '<td>' + r.storeName + (isBest ? ' <span class="chip chip-green">Lowest</span>' : '') + '</td>' +
        '<td class="total-amount text-right">₹' + r.price.toLocaleString("en-IN") + ' / ' + r.unit + '</td>' +
        '<td>' + (r.date ? Data.displayDate(r.date) : "—") + '</td>' +
        '<td><span class="desc-cell">' + (r.notes || "—") + '</span></td>' +
        ((canEdit || canDelete) ? '<td><div class="row-actions">' +
          '<button class="action-trigger" data-menu-toggle="' + r.id + '">' + App.svg("dots") + '</button>' +
          '<div class="action-menu" data-menu="' + r.id + '">' +
            (canEdit ? '<button data-edit="' + r.id + '">' + App.svg("edit") + ' Edit</button>' : '') +
            (canDelete ? '<button class="danger" data-delete="' + r.id + '">' + App.svg("trash") + ' Delete</button>' : '') +
          '</div>' +
        '</div></td>' : '') +
      '</tr>';
    }).join("");

    App.renderPager(document.getElementById("tablePager"), page, pg.totalPages, function (newPage) { page = newPage; render(); });
  }

  document.getElementById("searchInput").addEventListener("input", function (e) { searchTerm = e.target.value; page = 1; render(); });

  var openMenuId = null;
  document.addEventListener("click", function (e) {
    var toggle = e.target.closest("[data-menu-toggle]");
    document.querySelectorAll(".action-menu.show").forEach(function (m) { m.classList.remove("show"); });
    if (toggle) {
      var id = toggle.getAttribute("data-menu-toggle");
      openMenuId = id;
      App.positionActionMenu(id);
      document.querySelector('[data-menu="' + id + '"]').classList.add("show");
      return;
    }
    var edit = e.target.closest("[data-edit]");
    if (edit) { openModal(edit.getAttribute("data-edit")); return; }
    var del = e.target.closest("[data-delete]");
    if (del) { deleteQuote(del.getAttribute("data-delete")); return; }
  });
  window.addEventListener("scroll", function () { if (openMenuId) App.positionActionMenu(openMenuId); }, true);

  function deleteQuote(id) {
    if (!confirm("Delete this quotation?")) return;
    Data.saveQuotations(Data.getQuotations().filter(function (q) { return q.id !== id; }));
    App.showToast("Quotation deleted");
    render();
  }

  var modal = document.getElementById("quoteModal");
  var materialSelect = document.getElementById("fMaterial");

  function refreshMaterialOptions() {
    materialSelect.innerHTML = Data.getMaterials().map(function (m) {
      return '<option value="' + m.id + '">' + m.name + ' (' + m.unit + ')</option>';
    }).join("");
  }

  function openModal(id) {
    refreshMaterialOptions();
    document.getElementById("quoteForm").reset();
    document.getElementById("editId").value = id || "";
    if (id) {
      var q = Data.getQuotations().find(function (x) { return x.id === id; });
      document.getElementById("modalTitle").textContent = "Edit Quotation";
      materialSelect.value = q.materialId;
      document.getElementById("fStore").value = q.storeName;
      document.getElementById("fPrice").value = q.price;
      document.getElementById("fDate").value = q.date || "";
      document.getElementById("fNotes").value = q.notes || "";
    } else {
      document.getElementById("modalTitle").textContent = "Add Quotation";
      document.getElementById("fDate").value = Data.isoDate(Data.today());
    }
    modal.classList.add("show");
  }
  function closeModal() { modal.classList.remove("show"); }

  document.getElementById("addBtn").addEventListener("click", function () { openModal(null); });
  document.getElementById("closeModal").addEventListener("click", closeModal);
  document.getElementById("cancelModal").addEventListener("click", closeModal);
  modal.addEventListener("click", function (e) { if (e.target === modal) closeModal(); });

  document.getElementById("saveBtn").addEventListener("click", function () {
    var materialId = materialSelect.value;
    var storeName = document.getElementById("fStore").value.trim();
    var price = Number(document.getElementById("fPrice").value);
    if (!materialId || !storeName || !price) { App.showToast("Material, store name and price are required", true); return; }

    var id = document.getElementById("editId").value;
    var record = {
      id: id || Data.uid("q"),
      materialId: materialId,
      storeName: storeName,
      price: price,
      date: document.getElementById("fDate").value || Data.isoDate(Data.today()),
      notes: document.getElementById("fNotes").value.trim()
    };

    var all = Data.getQuotations();
    all = id ? all.map(function (q) { return q.id === id ? record : q; }) : all.concat([record]);
    Data.saveQuotations(all);
    App.showToast(id ? "Quotation updated" : "Quotation added");
    closeModal();
    render();
  });

  render();
</script>
</body>
</html>
