<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Reports</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div class="app-shell">
  <div class="sidebar-backdrop"></div>
  <aside class="sidebar" id="sidebar"></aside>

  <div class="main">
    <header class="topbar" id="topbar"></header>

    <main class="content">
      <div class="page-header-row">
        <div><h2 id="projName">Loading…</h2><p id="projMeta"></p></div>
      </div>

      <div id="tabsMount"></div>
      <div id="pageBody"></div>
    </main>
  </div>
</div>

<script src="assets/data.js"></script>
<script src="assets/business.js"></script>
<script src="assets/app.js"></script>
<script src="assets/charts.js"></script>
<script>
  App.requireAuth();
  var projectId = new URLSearchParams(window.location.search).get("id");
  var project = Data.getProjects().find(function (p) { return p.id === projectId; });
  App.renderShell({ active: "projects", title: project ? project.name : "Project", subtitle: "Daily work reports" });

  if (!project || !App.guardProjectAccess(projectId)) {
    document.getElementById("projName").textContent = project ? "Access restricted" : "Project not found";
  } else {
    document.getElementById("projName").textContent = project.name;
    document.getElementById("projMeta").textContent = project.code;
    document.getElementById("tabsMount").innerHTML = App.projectTabsHtml(projectId, "reports");
    var canCreate = App.can("reports", "create");
    var canDelete = App.can("reports", "delete");

    document.getElementById("pageBody").innerHTML =
      (canCreate ?
      '<div class="panel full-panel">' +
        '<div class="panel-header"><h3>Log Today\'s Work</h3></div>' +
        '<form id="reportForm">' +
          '<div class="field-grid">' +
            '<div class="field"><label>Date</label><input type="date" id="fDate"></div>' +
            '<div class="field full"><label>Title</label><input type="text" id="fTitle" placeholder="e.g. Daily site update"></div>' +
            '<div class="field full"><label>What was done today? <span class="req">*</span></label><textarea id="fDesc" placeholder="Describe the work completed, materials used, issues faced..." required></textarea></div>' +
          '</div>' +
          '<div class="modal-footer" style="padding:18px 0 0;border-top:none">' +
            '<button type="submit" class="btn btn-primary">+ Add Report</button>' +
          '</div>' +
        '</form>' +
      '</div>' : '') +
      '<div class="activity-list" id="reportList" style="max-width:820px"></div>';

    if (document.getElementById("fDate")) document.getElementById("fDate").value = Data.isoDate(Data.today());

    function renderReports() {
      var reports = Data.getWorkReports().filter(function (r) { return r.projectId === projectId; })
        .sort(function (a, b) { return a.date < b.date ? 1 : -1; });

      var listEl = document.getElementById("reportList");
      if (!reports.length) {
        listEl.innerHTML = '<div class="panel"><div class="empty-state compact">' + App.svg("fileText") + '<p>No work reports logged yet.</p></div></div>';
        return;
      }

      listEl.innerHTML = reports.map(function (r) {
        return '<div class="panel" style="padding:18px 20px">' +
          '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px">' +
            '<div>' +
              '<div style="font-weight:800;font-size:14px;margin-bottom:2px">' + (r.title || "Work Report") + '</div>' +
              '<div style="font-size:11.5px;color:var(--muted);margin-bottom:8px">' + Data.displayDate(r.date) + '</div>' +
              '<p style="margin:0;font-size:13.5px;line-height:1.6">' + r.description + '</p>' +
            '</div>' +
            (canDelete ? '<button class="action-trigger" data-del="' + r.id + '">' + App.svg("trash") + '</button>' : '') +
          '</div>' +
        '</div>';
      }).join("");
    }

    document.getElementById("reportList").addEventListener("click", function (e) {
      var btn = e.target.closest("[data-del]");
      if (!btn) return;
      Data.saveWorkReports(Data.getWorkReports().filter(function (r) { return r.id !== btn.getAttribute("data-del"); }));
      App.showToast("Report removed");
      renderReports();
    });

    var reportFormEl = document.getElementById("reportForm");
    if (reportFormEl) reportFormEl.addEventListener("submit", function (e) {
      e.preventDefault();
      var desc = document.getElementById("fDesc").value.trim();
      if (!desc) { App.showToast("Describe the work done", true); return; }
      var reports = Data.getWorkReports();
      reports.push({
        id: Data.uid("wr"), projectId: projectId, date: document.getElementById("fDate").value,
        title: document.getElementById("fTitle").value.trim(), description: desc
      });
      Data.saveWorkReports(reports);
      App.showToast("Report added");
      document.getElementById("reportForm").reset();
      document.getElementById("fDate").value = Data.isoDate(Data.today());
      renderReports();
    });

    renderReports();
  }
</script>
</body>
</html>
