<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Materials</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div class="app-shell">
  <div class="sidebar-backdrop"></div>
  <aside class="sidebar" id="sidebar"></aside>

  <div class="main">
    <header class="topbar" id="topbar"></header>

    <main class="content">
      <div class="page-header-row">
        <div>
          <h2>Materials</h2>
          <p>Global material master and stock levels across all your projects.</p>
        </div>
        <button class="btn btn-primary" id="addBtn" data-require="stock:create">+ Add Material</button>
      </div>

      <div class="table-card">
        <div class="table-toolbar">
          <div class="search-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" id="searchInput" placeholder="Search materials...">
          </div>
          <span class="toolbar-meta" id="toolbarMeta"></span>
        </div>
        <div class="table-scroll">
          <table class="data-table">
            <thead>
              <tr><th>Material</th><th>Category</th><th>Unit</th><th>Reorder Threshold</th><th>Stock by Project</th><th></th></tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>

<div class="modal-overlay" id="matModal">
  <div class="modal-box">
    <div class="modal-header">
      <div><h3 id="modalTitle">Add Material</h3><p>Materials can be restocked any time via each project's Stock tab.</p></div>
      <button class="modal-close" id="closeModal">&times;</button>
    </div>
    <div class="modal-body">
      <form id="matForm">
        <input type="hidden" id="editId">
        <div class="field-grid">
          <div class="field full"><label>Material Name <span class="req">*</span></label><input type="text" id="fName" required></div>
          <div class="field"><label>Category</label><input type="text" id="fCategory" placeholder="e.g. Steel, Cement"></div>
          <div class="field"><label>Unit <span class="req">*</span></label><input type="text" id="fUnit" placeholder="e.g. bag, ton, cft" required></div>
          <div class="field full"><label>Reorder Threshold</label><input type="number" id="fThreshold" min="0"></div>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" id="cancelModal">Cancel</button>
      <button class="btn btn-primary" id="saveBtn">Save Material</button>
    </div>
  </div>
</div>

<script src="assets/data.js"></script>
<script src="assets/business.js"></script>
<script src="assets/app.js"></script>
<script src="assets/charts.js"></script>
<script>
  App.requireAuth();
  App.renderShell({ active: "materials", title: "Materials", subtitle: "Stock master" });
  App.guardPermission("stock", "read");
  var canEdit = App.can("stock", "update");
  var canDelete = App.can("stock", "delete");
  var searchTerm = "";
  var visibleProjects = App.visibleProjects();

  function render() {
    var all = Data.getMaterials().filter(function (m) {
      var t = searchTerm.toLowerCase();
      return !t || m.name.toLowerCase().indexOf(t) !== -1 || (m.category || "").toLowerCase().indexOf(t) !== -1;
    });
    document.getElementById("toolbarMeta").textContent = all.length + " material(s)";

    var tbody = document.getElementById("tableBody");
    if (!all.length) {
      tbody.innerHTML = '<tr><td colspan="6"><div class="empty-state compact">' + App.svg("box") + '<p>No materials found.</p></div></td></tr>';
      return;
    }

    tbody.innerHTML = all.map(function (m) {
      var stockCells = visibleProjects.map(function (p) {
        var b = Business.getStockBalance(p.id, m.id);
        if (!b.txns.length) return '';
        return '<span class="chip ' + (b.isLowStock ? "chip-pink" : "chip-green") + '">' + p.code + ': ' + b.balance + '</span>';
      }).filter(Boolean).join(" ");

      return '<tr>' +
        '<td><strong>' + m.name + '</strong></td>' +
        '<td><span class="chip chip-slate">' + (m.category || "—") + '</span></td>' +
        '<td>' + m.unit + '</td>' +
        '<td>' + m.reorderThreshold + ' ' + m.unit + '</td>' +
        '<td>' + (stockCells || '<span class="desc-cell">No activity yet</span>') + '</td>' +
        '<td>' +
          '<div class="row-actions">' +
            '<button class="action-trigger" data-menu-toggle="' + m.id + '">' + App.svg("dots") + '</button>' +
            '<div class="action-menu" data-menu="' + m.id + '">' +
              (canEdit ? '<button data-edit="' + m.id + '">' + App.svg("edit") + ' Edit</button>' : '') +
              (canDelete ? '<button class="danger" data-delete="' + m.id + '">' + App.svg("trash") + ' Delete</button>' : '') +
              (!canEdit && !canDelete ? '<button disabled>No actions</button>' : '') +
            '</div>' +
          '</div>' +
        '</td>' +
      '</tr>';
    }).join("");
  }

  document.getElementById("searchInput").addEventListener("input", function (e) { searchTerm = e.target.value; render(); });

  var openMenuId = null;
  document.addEventListener("click", function (e) {
    var toggle = e.target.closest("[data-menu-toggle]");
    document.querySelectorAll(".action-menu.show").forEach(function (m) { m.classList.remove("show"); });
    if (toggle) {
      var id = toggle.getAttribute("data-menu-toggle");
      openMenuId = id;
      App.positionActionMenu(id);
      document.querySelector('[data-menu="' + id + '"]').classList.add("show");
      return;
    }
    var edit = e.target.closest("[data-edit]");
    if (edit) { openModal(edit.getAttribute("data-edit")); return; }
    var del = e.target.closest("[data-delete]");
    if (del) { deleteMat(del.getAttribute("data-delete")); return; }
  });
  window.addEventListener("scroll", function () { if (openMenuId) App.positionActionMenu(openMenuId); }, true);

  function deleteMat(id) {
    if (!confirm("Delete this material? Historical stock transactions referencing it will remain but show as unlinked.")) return;
    Data.saveMaterials(Data.getMaterials().filter(function (m) { return m.id !== id; }));
    App.showToast("Material deleted");
    render();
  }

  var modal = document.getElementById("matModal");
  function openModal(id) {
    document.getElementById("matForm").reset();
    document.getElementById("editId").value = id || "";
    if (id) {
      var m = Data.getMaterials().find(function (x) { return x.id === id; });
      document.getElementById("modalTitle").textContent = "Edit Material";
      document.getElementById("fName").value = m.name;
      document.getElementById("fCategory").value = m.category || "";
      document.getElementById("fUnit").value = m.unit;
      document.getElementById("fThreshold").value = m.reorderThreshold;
    } else {
      document.getElementById("modalTitle").textContent = "Add Material";
    }
    modal.classList.add("show");
  }
  function closeModal() { modal.classList.remove("show"); }

  document.getElementById("addBtn").addEventListener("click", function () { openModal(null); });
  document.getElementById("closeModal").addEventListener("click", closeModal);
  document.getElementById("cancelModal").addEventListener("click", closeModal);
  modal.addEventListener("click", function (e) { if (e.target === modal) closeModal(); });

  document.getElementById("saveBtn").addEventListener("click", function () {
    var name = document.getElementById("fName").value.trim();
    var unit = document.getElementById("fUnit").value.trim();
    if (!name || !unit) { App.showToast("Name and unit are required", true); return; }

    var id = document.getElementById("editId").value;
    var record = {
      id: id || Data.uid("m"),
      name: name,
      category: document.getElementById("fCategory").value.trim(),
      unit: unit,
      reorderThreshold: Number(document.getElementById("fThreshold").value) || 0
    };

    var all = Data.getMaterials();
    all = id ? all.map(function (m) { return m.id === id ? record : m; }) : all.concat([record]);
    Data.saveMaterials(all);
    App.showToast(id ? "Material updated" : "Material added");
    closeModal();
    render();
  });

  render();
</script>
</body>
</html>
