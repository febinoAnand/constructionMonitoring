<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Labourer Profile</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div class="app-shell">
  <div class="sidebar-backdrop"></div>
  <aside class="sidebar" id="sidebar"></aside>

  <div class="main">
    <header class="topbar" id="topbar"></header>

    <main class="content">
      <div class="page-header-row">
        <div><h2 id="labName">Loading…</h2><p id="labMeta"></p></div>
        <a class="btn btn-outline" href="labour-list.html">&larr; Back to Labourers</a>
      </div>
      <div id="pageBody"></div>
    </main>
  </div>
</div>

<div class="modal-overlay" id="attEditModal">
  <div class="modal-box">
    <div class="modal-header">
      <div><h3>Edit Attendance Entry</h3><p>Adjust this attendance record.</p></div>
      <button class="modal-close" id="closeAttEditModal">&times;</button>
    </div>
    <div class="modal-body">
      <form id="attEditForm">
        <input type="hidden" id="aeId">
        <div class="field-grid">
          <div class="field"><label>Date</label><input type="date" id="aeDate"></div>
          <div class="field"><label>Days Worked</label><select id="aeDays"><option value="1">Full day (1.0)</option><option value="0.5">Half day (0.5)</option><option value="1.5">Overtime (1.5)</option></select></div>
          <div class="field"><label>Wage Rate (₹/day)</label><input type="number" id="aeRate" min="0"></div>
          <div class="field"><label>Status</label><select id="aeStatus"><option value="present">Present</option><option value="absent">Absent</option></select></div>
          <div class="field full"><label>Notes</label><input type="text" id="aeNotes"></div>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" id="cancelAttEditModal">Cancel</button>
      <button class="btn btn-primary" id="saveAttEditBtn">Save Changes</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="payEditModal">
  <div class="modal-box">
    <div class="modal-header">
      <div><h3>Edit Wage Payment</h3><p id="payEditSubtitle">Correct this payment record.</p></div>
      <button class="modal-close" id="closePayEditModal">&times;</button>
    </div>
    <div class="modal-body">
      <form id="payEditForm">
        <div class="field-grid">
          <div class="field"><label>Type</label>
            <select id="peType"><option value="advance">Advance</option><option value="payment">Payment (settlement)</option></select>
          </div>
          <div class="field"><label>Amount (₹)</label><input type="number" id="peAmount" min="0"></div>
          <div class="field"><label>Date</label><input type="date" id="peDate"></div>
          <div class="field full"><label>Notes</label><input type="text" id="peNotes"></div>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" id="cancelPayEditModal">Cancel</button>
      <button class="btn btn-primary" id="savePayEditBtn">Save Changes</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="attDownloadModal">
  <div class="modal-box">
    <div class="modal-header">
      <div><h3>Download Attendance History</h3><p>Choose a file format and date range to export.</p></div>
      <button class="modal-close" id="closeAttDownloadModal">&times;</button>
    </div>
    <div class="modal-body">
      <form id="attDownloadForm">
        <div class="field-grid">
          <div class="field full">
            <label>File Format</label>
            <div class="format-toggle" id="adlFormatToggle">
              <button type="button" class="format-toggle-btn active" data-format="pdf">PDF</button>
              <button type="button" class="format-toggle-btn" data-format="csv">CSV</button>
            </div>
            <input type="hidden" id="adlFormat" value="pdf">
          </div>
          <div class="field"><label>From Date</label><input type="date" id="adlFrom"></div>
          <div class="field"><label>To Date</label><input type="date" id="adlTo"></div>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" id="cancelAttDownloadModal">Cancel</button>
      <button class="btn btn-primary" id="confirmAttDownloadBtn">Download</button>
    </div>
  </div>
</div>

<script src="assets/data.js"></script>
<script src="assets/business.js"></script>
<script src="assets/app.js"></script>
<script src="assets/charts.js"></script>
<script>
  App.requireAuth();
  App.renderShell({ active: "labour", title: "Labourer Profile", subtitle: "Cross-project history" });

  var labId = new URLSearchParams(window.location.search).get("id");
  var lab = Data.getLabourers().find(function (l) { return l.id === labId; });

  if (!lab) {
    document.getElementById("labName").textContent = "Labourer not found";
  } else {
    document.getElementById("labName").textContent = lab.name;
    document.getElementById("labMeta").textContent = lab.skill + " · " + (lab.phone || "No phone on file") + " · ₹" + lab.defaultDailyWage + "/day";

    var visibleIds = App.visibleProjects().map(function (p) { return p.id; });
    var canEditAtt = App.can("labour", "update");
    var PAGE_SIZE = 10;
    var attPage = 1;
    var attFrom = "", attTo = "";

    document.getElementById("pageBody").innerHTML =
      '<div class="stat-grid stat-grid-tight" id="statGrid"></div>' +
      '<div class="panel-grid">' +
        '<div class="panel">' +
          '<div class="panel-header"><h3>Attendance History</h3><span class="panel-tag" id="attCount"></span></div>' +
          '<form class="inline-add-form" id="attFilterForm" style="padding:0 20px 14px">' +
            '<div class="field"><label>From</label><input type="date" id="attFromInput"></div>' +
            '<div class="field"><label>To</label><input type="date" id="attToInput"></div>' +
            '<button type="submit" class="btn btn-outline" style="padding:9px 16px">Apply</button>' +
            '<button type="button" class="btn btn-outline" id="attFilterClear" style="padding:9px 16px">Clear</button>' +
          '</form>' +
          '<div class="table-scroll"><table class="data-table"><thead><tr id="attHeadRow"></tr></thead><tbody id="attBody"></tbody></table></div>' +
          '<div class="panel-footer-row" style="justify-content:flex-end" id="attPager"></div>' +
          '<div class="panel-footer-row"><button class="btn btn-outline" id="attDownloadBtn">' + App.svg("download") + ' Download</button></div>' +
        '</div>' +
        '<div class="panel">' +
          '<div class="panel-header"><h3>Payment History</h3><span class="panel-tag" id="payCount"></span></div>' +
          '<div class="table-scroll" style="max-height:420px;overflow-y:auto"><table class="data-table"><thead><tr id="payHeadRow"></tr></thead><tbody id="payBody"></tbody></table></div>' +
        '</div>' +
      '</div>';

    var attSortState = { field: null, dir: "asc" };
    var paySortState = { field: null, dir: "asc" };

    document.getElementById("attHeadRow").innerHTML =
      App.sortableTh("Date", "date", attSortState) +
      App.sortableTh("Project", "projectName", attSortState) +
      App.sortableTh("Days", "daysWorked", attSortState) +
      App.sortableTh("Amount", "amount", attSortState) +
      (canEditAtt ? '<th></th>' : '');
    App.wireSort(document.getElementById("attHeadRow"), attSortState, function () { attPage = 1; renderAttendance(); });

    document.getElementById("payHeadRow").innerHTML =
      App.sortableTh("Date", "date", paySortState) +
      App.sortableTh("Project", "projectName", paySortState) +
      App.sortableTh("Type", "type", paySortState) +
      App.sortableTh("Amount", "amount", paySortState) +
      (canEditAtt ? '<th></th>' : '');
    App.wireSort(document.getElementById("payHeadRow"), paySortState, function () { renderStats(); });

    function renderStats() {
      var sum = Business.getWageSummary(labId);
      document.getElementById("statGrid").innerHTML =
        '<div class="stat-card"><div class="stat-icon icon-amber">' + App.svg("calendar") + '</div><div class="stat-value">' + sum.daysWorked + '</div><div class="stat-label">Total days worked</div></div>' +
        '<div class="stat-card"><div class="stat-icon icon-blue">' + App.svg("trendingUp") + '</div><div class="stat-value">₹' + Charts.fmtCompact(sum.earned) + '</div><div class="stat-label">Total earned</div></div>' +
        '<div class="stat-card"><div class="stat-icon icon-green">' + App.svg("coins") + '</div><div class="stat-value">₹' + Charts.fmtCompact(sum.paid) + '</div><div class="stat-label">Total paid</div></div>' +
        '<div class="stat-card"><div class="stat-icon icon-orange">' + App.svg("wallet") + '</div><div class="stat-value">₹' + Charts.fmtCompact(sum.owed) + '</div><div class="stat-label">Balance owed</div></div>';

      var payments = App.sortRows(
        sum.payments,
        paySortState.field ? paySortState : { field: "date", dir: "desc" },
        function (p, field) {
          if (field === "projectName") { var pr = Data.getProjects().find(function (x) { return x.id === p.projectId; }); return pr ? pr.name : ""; }
          return p[field];
        }
      );
      document.getElementById("payCount").textContent = payments.length + " entries";
      document.getElementById("payBody").innerHTML = payments.length ? payments.map(function (p) {
        var proj = Data.getProjects().find(function (x) { return x.id === p.projectId; });
        return '<tr><td>' + Data.displayDate(p.date) + '</td><td>' + (proj ? proj.name : "—") + '</td>' +
          '<td><span class="chip ' + (p.type === "advance" ? "chip-amber" : "chip-green") + '">' + (p.type === "advance" ? "Advance" : "Payment") + '</span></td>' +
          '<td class="total-amount">₹' + p.amount + '</td>' +
          (canEditAtt ? '<td><div class="row-actions">' +
            '<button class="action-trigger" data-menu-toggle="' + p.id + '">' + App.svg("dots") + '</button>' +
            '<div class="action-menu" data-menu="' + p.id + '">' +
              '<button data-edit-pay="' + p.id + '">' + App.svg("edit") + ' Edit</button>' +
            '</div>' +
          '</div></td>' : '') +
        '</tr>';
      }).join("") : '<tr><td colspan="' + (canEditAtt ? 5 : 4) + '"><div class="empty-state compact">' + App.svg("coins") + '<p>No payments recorded.</p></div></td></tr>';
    }

    function getFilteredAttendance() {
      return Business.getWageSummary(labId, { from: attFrom || undefined, to: attTo || undefined }).attendance;
    }

    function attSortAccessor(a, field) {
      if (field === "projectName") { var pr = Data.getProjects().find(function (p) { return p.id === a.projectId; }); return pr ? pr.name : ""; }
      if (field === "amount") return a.daysWorked * a.wageRate;
      return a[field];
    }

    function renderAttendance() {
      var all = getFilteredAttendance();
      document.getElementById("attCount").textContent = all.length + " entries";

      all = App.sortRows(
        all,
        attSortState.field ? attSortState : { field: "date", dir: "desc" },
        attSortAccessor
      );

      var pg = App.paginate(all, attPage, PAGE_SIZE);
      attPage = pg.page;

      document.getElementById("attBody").innerHTML = pg.pageItems.length ? pg.pageItems.map(function (a) {
        var proj = Data.getProjects().find(function (p) { return p.id === a.projectId; });
        var projLabel = proj ? (visibleIds.indexOf(proj.id) !== -1 ? '<a href="project-labour.html?id=' + proj.id + '">' + proj.name + '</a>' : proj.name) : "—";
        return '<tr><td>' + Data.displayDate(a.date) + '</td><td>' + projLabel + '</td><td>' + a.daysWorked + '</td><td>₹' + Math.round(a.daysWorked * a.wageRate) + '</td>' +
          (canEditAtt ? '<td><div class="row-actions">' +
            '<button class="action-trigger" data-menu-toggle="' + a.id + '">' + App.svg("dots") + '</button>' +
            '<div class="action-menu" data-menu="' + a.id + '">' +
              '<button data-edit-att="' + a.id + '">' + App.svg("edit") + ' Edit</button>' +
            '</div>' +
          '</div></td>' : '') +
        '</tr>';
      }).join("") : '<tr><td colspan="' + (canEditAtt ? 5 : 4) + '"><div class="empty-state compact">' + App.svg("calendar") + '<p>No attendance recorded in this range.</p></div></td></tr>';

      App.renderPager(document.getElementById("attPager"), attPage, pg.totalPages, function (newPage) { attPage = newPage; renderAttendance(); });
    }

    document.getElementById("attFilterForm").addEventListener("submit", function (e) {
      e.preventDefault();
      attFrom = document.getElementById("attFromInput").value;
      attTo = document.getElementById("attToInput").value;
      attPage = 1;
      renderAttendance();
    });
    document.getElementById("attFilterClear").addEventListener("click", function () {
      document.getElementById("attFromInput").value = "";
      document.getElementById("attToInput").value = "";
      attFrom = ""; attTo = ""; attPage = 1;
      renderAttendance();
    });

    var attEditModal = document.getElementById("attEditModal");
    var openMenuId = null;
    document.addEventListener("click", function (e) {
      var toggle = e.target.closest("[data-menu-toggle]");
      document.querySelectorAll(".action-menu.show").forEach(function (m) { m.classList.remove("show"); });
      if (toggle) {
        var menuId = toggle.getAttribute("data-menu-toggle");
        openMenuId = menuId;
        App.positionActionMenu(menuId);
        document.querySelector('[data-menu="' + menuId + '"]').classList.add("show");
        return;
      }
      var payBtn = e.target.closest("[data-edit-pay]");
      if (payBtn) { openPayEditModal(payBtn.getAttribute("data-edit-pay")); return; }
      var btn = e.target.closest("[data-edit-att]");
      if (!btn) return;
      var a = Data.getAttendance().find(function (x) { return x.id === btn.getAttribute("data-edit-att"); });
      if (!a) return;
      document.getElementById("aeId").value = a.id;
      document.getElementById("aeDate").value = a.date;
      document.getElementById("aeDays").value = a.daysWorked;
      document.getElementById("aeRate").value = a.wageRate;
      document.getElementById("aeStatus").value = a.status || "present";
      document.getElementById("aeNotes").value = a.notes || "";
      attEditModal.classList.add("show");
    });
    window.addEventListener("scroll", function () { if (openMenuId) App.positionActionMenu(openMenuId); }, true);
    function closeAttEditModal() { attEditModal.classList.remove("show"); }
    document.getElementById("closeAttEditModal").addEventListener("click", closeAttEditModal);
    document.getElementById("cancelAttEditModal").addEventListener("click", closeAttEditModal);
    attEditModal.addEventListener("click", function (e) { if (e.target === attEditModal) closeAttEditModal(); });
    document.getElementById("saveAttEditBtn").addEventListener("click", function () {
      var id = document.getElementById("aeId").value;
      var all = Data.getAttendance().map(function (x) {
        if (x.id !== id) return x;
        return Object.assign({}, x, {
          date: document.getElementById("aeDate").value,
          daysWorked: Number(document.getElementById("aeDays").value),
          wageRate: Number(document.getElementById("aeRate").value) || x.wageRate,
          status: document.getElementById("aeStatus").value,
          notes: document.getElementById("aeNotes").value.trim()
        });
      });
      Data.saveAttendance(all);
      App.showToast("Attendance entry updated");
      closeAttEditModal();
      renderStats();
      renderAttendance();
    });

    var payEditModal = document.getElementById("payEditModal");
    var editPayId = null;
    function openPayEditModal(id) {
      var p = Data.getWagePayments().find(function (x) { return x.id === id; });
      if (!p) return;
      editPayId = id;
      var proj = Data.getProjects().find(function (x) { return x.id === p.projectId; });
      document.getElementById("payEditSubtitle").textContent = "Payment recorded on " + (proj ? proj.name : "a project") + ".";
      document.getElementById("peType").value = p.type;
      document.getElementById("peAmount").value = p.amount;
      document.getElementById("peDate").value = p.date;
      document.getElementById("peNotes").value = p.notes || "";
      payEditModal.classList.add("show");
    }
    function closePayEditModal() { payEditModal.classList.remove("show"); editPayId = null; }
    document.getElementById("closePayEditModal").addEventListener("click", closePayEditModal);
    document.getElementById("cancelPayEditModal").addEventListener("click", closePayEditModal);
    payEditModal.addEventListener("click", function (e) { if (e.target === payEditModal) closePayEditModal(); });
    document.getElementById("savePayEditBtn").addEventListener("click", function () {
      if (!editPayId) return;
      var amount = Number(document.getElementById("peAmount").value);
      if (!amount) { App.showToast("Enter an amount", true); return; }
      var payments = Data.getWagePayments().map(function (p) {
        return p.id === editPayId ? Object.assign({}, p, {
          type: document.getElementById("peType").value, amount: amount,
          date: document.getElementById("peDate").value, notes: document.getElementById("peNotes").value.trim()
        }) : p;
      });
      Data.saveWagePayments(payments);
      App.showToast("Payment updated");
      closePayEditModal();
      renderStats();
    });

    var attDownloadModal = document.getElementById("attDownloadModal");
    document.getElementById("attDownloadBtn").addEventListener("click", function () {
      document.getElementById("adlFrom").value = attFrom || "";
      document.getElementById("adlTo").value = attTo || Data.isoDate(Data.today());
      document.getElementById("adlFormat").value = "pdf";
      document.querySelectorAll("#adlFormatToggle .format-toggle-btn").forEach(function (b) { b.classList.toggle("active", b.getAttribute("data-format") === "pdf"); });
      attDownloadModal.classList.add("show");
    });
    document.getElementById("adlFormatToggle").addEventListener("click", function (e) {
      var btn = e.target.closest("[data-format]");
      if (!btn) return;
      document.querySelectorAll("#adlFormatToggle .format-toggle-btn").forEach(function (b) { b.classList.remove("active"); });
      btn.classList.add("active");
      document.getElementById("adlFormat").value = btn.getAttribute("data-format");
    });
    function closeAttDownloadModal() { attDownloadModal.classList.remove("show"); }
    document.getElementById("closeAttDownloadModal").addEventListener("click", closeAttDownloadModal);
    document.getElementById("cancelAttDownloadModal").addEventListener("click", closeAttDownloadModal);
    attDownloadModal.addEventListener("click", function (e) { if (e.target === attDownloadModal) closeAttDownloadModal(); });
    document.getElementById("confirmAttDownloadBtn").addEventListener("click", function () {
      var format = document.getElementById("adlFormat").value;
      var rows = App.sortRows(getFilteredAttendance(), attSortState.field ? attSortState : { field: "date", dir: "desc" }, attSortAccessor);
      var rangeText = (attFrom || attTo) ? " (" + (attFrom ? Data.displayDate(attFrom) : "start") + " to " + (attTo ? Data.displayDate(attTo) : "today") + ")" : "";
      App.exportTable(format, lab.name + "-attendance", "Attendance — " + lab.name + rangeText, lab.skill + rangeText,
        [
          { label: "Date", value: function (a) { return Data.displayDate(a.date); } },
          { label: "Project", value: function (a) { var pr = Data.getProjects().find(function (p) { return p.id === a.projectId; }); return pr ? pr.name : "—"; } },
          { label: "Days", key: "daysWorked" },
          { label: "Amount", value: function (a) { return "₹" + Math.round(a.daysWorked * a.wageRate); } }
        ], rows);
      closeAttDownloadModal();
      App.showToast("Your " + format.toUpperCase() + " file is downloading...");
    });

    renderStats();
    renderAttendance();
  }
</script>
</body>
</html>
