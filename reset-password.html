<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body class="auth-body">

<div class="bg-blob b1"></div>
<div class="bg-blob b2"></div>
<div class="bg-blob b3"></div>
<div class="bg-blob b4"></div>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">BT</div>
    <h1>Reset Password</h1>
    <p class="subtitle">Set a new password for your account</p>

    <div class="form-alert" id="resetAlert">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="13"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <span id="resetAlertText"></span>
    </div>

    <form id="resetForm">
      <div class="form-group">
        <label for="newPassword">New Password</label>
        <div class="input-wrapper">
          <svg class="leading-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input type="password" id="newPassword" placeholder="At least 6 characters" required minlength="6">
        </div>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <div class="input-wrapper">
          <svg class="leading-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input type="password" id="confirmPassword" placeholder="Re-enter new password" required minlength="6">
        </div>
      </div>

      <button type="submit" class="btn btn-primary submit-btn">Reset Password</button>
    </form>

    <div class="demo-hint" id="successHint" style="display:none">Your password has been reset. You can now <a href="index.html">sign in</a> with your new password.</div>
    <a href="index.html" class="forgot-password-link" style="display:block;text-align:center;margin-top:16px">&larr; Back to Sign In</a>
  </div>
</div>

<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script>
  (function () {
    var alertEl = document.getElementById("resetAlert");
    var alertText = document.getElementById("resetAlertText");
    function showAlert(msg) {
      alertText.textContent = msg;
      alertEl.classList.add("show");
    }

    document.getElementById("resetForm").addEventListener("submit", function (e) {
      e.preventDefault();
      var newPass = document.getElementById("newPassword").value;
      var confirmPass = document.getElementById("confirmPassword").value;

      if (newPass.length < 6) { showAlert("Password must be at least 6 characters"); return; }
      if (newPass !== confirmPass) { showAlert("Passwords don't match — please re-enter"); return; }

      alertEl.classList.remove("show");
      document.getElementById("resetForm").style.display = "none";
      document.getElementById("successHint").style.display = "block";
      App.showToast("Password reset successfully");
    });
  })();
</script>
</body>
</html>
