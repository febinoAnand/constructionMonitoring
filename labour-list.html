<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Labourers</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div class="app-shell">
  <div class="sidebar-backdrop"></div>
  <aside class="sidebar" id="sidebar"></aside>

  <div class="main">
    <header class="topbar" id="topbar"></header>

    <main class="content">
      <div class="page-header-row">
        <div>
          <h2>Labourers</h2>
          <p>Global workforce master — click a labourer to see their cross-project history.</p>
        </div>
        <button class="btn btn-primary" id="addBtn" data-require="labour:create">+ Add Labourer</button>
      </div>

      <div class="stat-grid stat-grid-tight" id="statGrid"></div>

      <div class="table-card">
        <div class="table-toolbar">
          <div class="search-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" id="searchInput" placeholder="Search by name or skill...">
          </div>
          <span class="toolbar-meta" id="toolbarMeta"></span>
        </div>
        <div class="table-scroll">
          <table class="data-table">
            <thead>
              <tr><th>Labourer</th><th>Skill</th><th>Daily Wage</th><th>Phone</th><th>Status</th><th></th></tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>

<div class="modal-overlay" id="labModal">
  <div class="modal-box">
    <div class="modal-header">
      <div><h3 id="modalTitle">Add Labourer</h3><p>Basic details for the workforce master.</p></div>
      <button class="modal-close" id="closeModal">&times;</button>
    </div>
    <div class="modal-body">
      <form id="labForm">
        <input type="hidden" id="editId">
        <div class="field-grid">
          <div class="field full"><label>Full Name <span class="req">*</span></label><input type="text" id="fName" required></div>
          <div class="field"><label>Skill</label>
            <select id="fSkill"></select>
          </div>
          <div class="field"><label>Default Daily Wage (₹) <span class="req">*</span></label><input type="number" id="fWage" min="0" required></div>
          <div class="field"><label>Phone</label><input type="text" id="fPhone"></div>
          <div class="field">
            <label>Status</label>
            <div class="status-toggle-group">
              <label data-state="active"><input type="radio" name="fStatus" value="active" checked><span>Active</span></label>
              <label data-state="inactive"><input type="radio" name="fStatus" value="inactive"><span>Inactive</span></label>
            </div>
          </div>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" id="cancelModal">Cancel</button>
      <button class="btn btn-primary" id="saveBtn">Save Labourer</button>
    </div>
  </div>
</div>

<script src="assets/data.js"></script>
<script src="assets/business.js"></script>
<script src="assets/app.js"></script>
<script src="assets/charts.js"></script>
<script>
  App.requireAuth();
  App.renderShell({ active: "labour", title: "Labourers", subtitle: "Workforce master" });
  App.guardPermission("labour", "read");
  var canEdit = App.can("labour", "update");
  var canDelete = App.can("labour", "delete");
  var searchTerm = "";

  var skillSelect = document.getElementById("fSkill");
  skillSelect.innerHTML = Data.SKILLS.map(function (s) { return '<option value="' + s + '">' + s + '</option>'; }).join("");

  function renderStats() {
    var all = Data.getLabourers();
    var active = all.filter(function (l) { return l.isActive; });
    var totalOwed = 0;
    active.forEach(function (l) { totalOwed += Business.getWageSummary(l.id).owed; });
    document.getElementById("statGrid").innerHTML =
      '<div class="stat-card"><div class="stat-icon icon-amber">' + App.svg("people") + '</div><div class="stat-value">' + all.length + '</div><div class="stat-label">Total labourers</div></div>' +
      '<div class="stat-card"><div class="stat-icon icon-green">' + App.svg("check") + '</div><div class="stat-value">' + active.length + '</div><div class="stat-label">Active</div></div>' +
      '<div class="stat-card"><div class="stat-icon icon-blue">' + App.svg("coins") + '</div><div class="stat-value">₹' + Charts.fmtCompact(totalOwed) + '</div><div class="stat-label">Total wages owed</div></div>';
  }

  function render() {
    renderStats();
    var all = Data.getLabourers().filter(function (l) {
      var t = searchTerm.toLowerCase();
      return !t || l.name.toLowerCase().indexOf(t) !== -1 || l.skill.toLowerCase().indexOf(t) !== -1;
    });
    document.getElementById("toolbarMeta").textContent = all.length + " labourer(s)";

    var tbody = document.getElementById("tableBody");
    if (!all.length) {
      tbody.innerHTML = '<tr><td colspan="6"><div class="empty-state compact">' + App.svg("people") + '<p>No labourers found.</p></div></td></tr>';
      return;
    }

    tbody.innerHTML = all.map(function (l) {
      var owed = Business.getWageSummary(l.id).owed;
      return '<tr class="' + (l.isActive ? "" : "row-inactive") + '">' +
        '<td><a href="labourer-detail.html?id=' + l.id + '"><div class="cell-user"><div class="cell-avatar">' + l.name.charAt(0) + '</div><span class="cell-user-name">' + l.name + '</span></div></a></td>' +
        '<td><span class="chip chip-amber">' + l.skill + '</span></td>' +
        '<td>₹' + l.defaultDailyWage + '<br><span class="desc-cell">Owed: ₹' + Charts.fmtCompact(owed) + '</span></td>' +
        '<td>' + (l.phone || "—") + '</td>' +
        '<td><span class="status-pill ' + (l.isActive ? "active" : "inactive") + '">' + (l.isActive ? "Active" : "Inactive") + '</span></td>' +
        '<td>' +
          '<div class="row-actions">' +
            '<button class="action-trigger" data-menu-toggle="' + l.id + '">' + App.svg("dots") + '</button>' +
            '<div class="action-menu" data-menu="' + l.id + '">' +
              '<button data-view="' + l.id + '">' + App.svg("arrowRight") + ' View profile</button>' +
              (canEdit ? '<button data-edit="' + l.id + '">' + App.svg("edit") + ' Edit</button>' : '') +
              (canDelete ? '<button class="danger" data-delete="' + l.id + '">' + App.svg("trash") + ' Delete</button>' : '') +
            '</div>' +
          '</div>' +
        '</td>' +
      '</tr>';
    }).join("");
  }

  document.getElementById("searchInput").addEventListener("input", function (e) { searchTerm = e.target.value; render(); });

  var openMenuId = null;
  document.addEventListener("click", function (e) {
    var toggle = e.target.closest("[data-menu-toggle]");
    document.querySelectorAll(".action-menu.show").forEach(function (m) { m.classList.remove("show"); });
    if (toggle) {
      var id = toggle.getAttribute("data-menu-toggle");
      openMenuId = id;
      App.positionActionMenu(id);
      document.querySelector('[data-menu="' + id + '"]').classList.add("show");
      return;
    }
    var view = e.target.closest("[data-view]");
    if (view) { window.location.href = "labourer-detail.html?id=" + view.getAttribute("data-view"); return; }
    var edit = e.target.closest("[data-edit]");
    if (edit) { openModal(edit.getAttribute("data-edit")); return; }
    var del = e.target.closest("[data-delete]");
    if (del) { deleteLab(del.getAttribute("data-delete")); return; }
  });
  window.addEventListener("scroll", function () { if (openMenuId) App.positionActionMenu(openMenuId); }, true);

  function deleteLab(id) {
    if (!confirm("Delete this labourer? Their attendance/payment history will remain but no longer link to a name.")) return;
    Data.saveLabourers(Data.getLabourers().filter(function (l) { return l.id !== id; }));
    App.showToast("Labourer deleted");
    render();
  }

  var modal = document.getElementById("labModal");
  function openModal(id) {
    document.getElementById("labForm").reset();
    document.getElementById("editId").value = id || "";
    if (id) {
      var l = Data.getLabourers().find(function (x) { return x.id === id; });
      document.getElementById("modalTitle").textContent = "Edit Labourer";
      document.getElementById("fName").value = l.name;
      document.getElementById("fSkill").value = l.skill;
      document.getElementById("fWage").value = l.defaultDailyWage;
      document.getElementById("fPhone").value = l.phone || "";
      document.querySelector('input[name="fStatus"][value="' + (l.isActive ? "active" : "inactive") + '"]').checked = true;
    } else {
      document.getElementById("modalTitle").textContent = "Add Labourer";
    }
    modal.classList.add("show");
  }
  function closeModal() { modal.classList.remove("show"); }

  document.getElementById("addBtn").addEventListener("click", function () { openModal(null); });
  document.getElementById("closeModal").addEventListener("click", closeModal);
  document.getElementById("cancelModal").addEventListener("click", closeModal);
  modal.addEventListener("click", function (e) { if (e.target === modal) closeModal(); });

  document.getElementById("saveBtn").addEventListener("click", function () {
    var name = document.getElementById("fName").value.trim();
    var wage = Number(document.getElementById("fWage").value);
    if (!name || !wage) { App.showToast("Name and daily wage are required", true); return; }

    var id = document.getElementById("editId").value;
    var record = {
      id: id || Data.uid("lb"),
      name: name,
      skill: document.getElementById("fSkill").value,
      defaultDailyWage: wage,
      phone: document.getElementById("fPhone").value.trim(),
      isActive: document.querySelector('input[name="fStatus"]:checked').value === "active"
    };

    var all = Data.getLabourers();
    all = id ? all.map(function (l) { return l.id === id ? record : l; }) : all.concat([record]);
    Data.saveLabourers(all);
    App.showToast(id ? "Labourer updated" : "Labourer added");
    closeModal();
    render();
  });

  render();
</script>
</body>
</html>
