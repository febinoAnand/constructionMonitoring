<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Wages</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div class="app-shell">
  <div class="sidebar-backdrop"></div>
  <aside class="sidebar" id="sidebar"></aside>

  <div class="main">
    <header class="topbar" id="topbar"></header>

    <main class="content">
      <div class="page-header-row">
        <div><h2 id="projName">Loading…</h2><p id="projMeta"></p></div>
      </div>

      <div id="tabsMount"></div>
      <div id="pageBody"></div>
    </main>
  </div>
</div>

<div class="modal-overlay" id="payModal">
  <div class="modal-box">
    <div class="modal-header">
      <div><h3>Record Wage Payment</h3><p>Advance or settlement payment to a labourer.</p></div>
      <button class="modal-close" id="closePayModal">&times;</button>
    </div>
    <div class="modal-body">
      <form id="payForm">
        <div class="field-grid">
          <div class="field full">
            <label>Labourer <span class="req">*</span></label>
            <div class="combo-wrap" id="payComboWrap">
              <input type="text" id="payLabInput" placeholder="Search labourer...">
              <div class="combo-panel" id="payComboPanel"></div>
              <input type="hidden" id="payLabId">
            </div>
          </div>
          <div class="field"><label>Type</label>
            <select id="payType"><option value="advance">Advance</option><option value="payment">Payment (settlement)</option></select>
          </div>
          <div class="field"><label>Amount (₹) <span class="req">*</span></label><input type="number" id="payAmount" min="0" required></div>
          <div class="field"><label>Date</label><input type="date" id="payDate"></div>
          <div class="field full"><label>Notes</label><input type="text" id="payNotes"></div>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" id="cancelPayModal">Cancel</button>
      <button class="btn btn-primary" id="savePayBtn">Save Payment</button>
    </div>
  </div>
</div>

<script src="assets/data.js"></script>
<script src="assets/business.js"></script>
<script src="assets/app.js"></script>
<script src="assets/charts.js"></script>
<script>
  App.requireAuth();
  var projectId = new URLSearchParams(window.location.search).get("id");
  var project = Data.getProjects().find(function (p) { return p.id === projectId; });
  App.renderShell({ active: "projects", title: project ? project.name : "Project", subtitle: "Wages" });

  if (!project || !App.guardProjectAccess(projectId)) {
    document.getElementById("projName").textContent = project ? "Access restricted" : "Project not found";
  } else {
    document.getElementById("projName").textContent = project.name;
    document.getElementById("projMeta").textContent = project.code;
    document.getElementById("tabsMount").innerHTML = App.projectTabsHtml(projectId, "wages");

    var canCreate = App.can("labour", "create");

    document.getElementById("pageBody").innerHTML =
      '<div class="stat-grid stat-grid-tight" id="statGrid"></div>' +
      '<div class="panel full-panel">' +
        '<div class="panel-header"><h3>Wage Payments</h3>' + (canCreate ? '<button class="btn btn-outline" id="addPayBtn" style="padding:7px 14px;font-size:12.5px">+ Record Payment</button>' : '') + '</div>' +
        '<div class="table-scroll"><table class="data-table"><thead><tr id="payHeadRow"></tr></thead><tbody id="payBody"></tbody></table></div>' +
        '<div class="panel-footer-row" style="justify-content:flex-end" id="payPager"></div>' +
      '</div>' +
      '<div class="panel full-panel" style="margin-top:20px">' +
        '<div class="panel-header"><h3>Wage Summary by Labourer</h3></div>' +
        '<div class="table-scroll"><table class="data-table"><thead><tr id="summaryHeadRow"></tr></thead><tbody id="summaryBody"></tbody></table></div>' +
        '<div class="panel-footer-row" style="justify-content:flex-end" id="summaryPager"></div>' +
      '</div>';

    var paySortState = { field: null, dir: "asc" };
    var payPage = 1;
    var summarySortState = { field: null, dir: "asc" };
    var summaryPage = 1;
    var WAGE_PAGE_SIZE = 10;

    document.getElementById("payHeadRow").innerHTML =
      App.sortableTh("Date", "date", paySortState) +
      App.sortableTh("Labourer", "labourerName", paySortState) +
      App.sortableTh("Type", "type", paySortState) +
      App.sortableTh("Amount", "amount", paySortState);
    App.wireSort(document.getElementById("payHeadRow"), paySortState, function () { payPage = 1; renderPayments(); });

    document.getElementById("summaryHeadRow").innerHTML =
      App.sortableTh("Labourer", "name", summarySortState) +
      App.sortableTh("Skill", "skill", summarySortState) +
      App.sortableTh("Days Worked", "daysWorked", summarySortState) +
      App.sortableTh("Earned", "earned", summarySortState) +
      App.sortableTh("Paid", "paid", summarySortState) +
      App.sortableTh("Owed", "owed", summarySortState);
    App.wireSort(document.getElementById("summaryHeadRow"), summarySortState, function () { summaryPage = 1; renderSummary(); });

    document.getElementById("payDate").value = Data.isoDate(Data.today());

    var activeLabourers = Data.getLabourers().filter(function (l) { return l.isActive; });

    function setupCombo(inputId, panelId, wrapId, hiddenId) {
      var input = document.getElementById(inputId);
      var panel = document.getElementById(panelId);
      var wrap = document.getElementById(wrapId);
      var hidden = document.getElementById(hiddenId);
      if (!input || !panel || !wrap || !hidden) return;
      App.initCombobox({
        wrap: wrap, input: input, panel: panel, items: activeLabourers,
        getInitial: function (l) { return l.name.charAt(0); },
        getLabel: function (l) { return l.name; },
        getSub: function (l) { return l.skill + " · ₹" + l.defaultDailyWage + "/day"; },
        matches: function (l, term) { return !term || l.name.toLowerCase().indexOf(term) !== -1 || l.skill.toLowerCase().indexOf(term) !== -1; },
        onSelect: function (l) { input.value = l.name; hidden.value = l.id; }
      });
      input.addEventListener("input", function () { hidden.value = ""; });
    }
    setupCombo("payLabInput", "payComboPanel", "payComboWrap", "payLabId");

    function renderStats() {
      var wagesOwed = Business.getWagesDueTotal(projectId);
      var wagesPaid = Data.getWagePayments().filter(function (p) { return p.projectId === projectId; }).reduce(function (s, p) { return s + p.amount; }, 0);
      var advances = Data.getWagePayments().filter(function (p) { return p.projectId === projectId && p.type === "advance"; }).reduce(function (s, p) { return s + p.amount; }, 0);
      document.getElementById("statGrid").innerHTML =
        '<div class="stat-card"><div class="stat-icon icon-green">' + App.svg("coins") + '</div><div class="stat-value">₹' + Charts.fmtCompact(wagesPaid) + '</div><div class="stat-label">Wages paid</div></div>' +
        '<div class="stat-card"><div class="stat-icon icon-amber">' + App.svg("wallet") + '</div><div class="stat-value">₹' + Charts.fmtCompact(advances) + '</div><div class="stat-label">Advances given</div></div>' +
        '<div class="stat-card"><div class="stat-icon icon-orange">' + App.svg("alert") + '</div><div class="stat-value">₹' + Charts.fmtCompact(wagesOwed) + '</div><div class="stat-label">Wages owed</div></div>';
    }

    function renderPayments() {
      var payments = App.sortRows(
        Data.getWagePayments().filter(function (p) { return p.projectId === projectId; }),
        paySortState.field ? paySortState : { field: "date", dir: "desc" },
        function (p, field) {
          if (field === "labourerName") { var lb = Data.getLabourers().find(function (l) { return l.id === p.labourerId; }); return lb ? lb.name : ""; }
          return p[field];
        }
      );
      var body = document.getElementById("payBody");
      if (!payments.length) {
        body.innerHTML = '<tr><td colspan="4"><div class="empty-state compact">' + App.svg("coins") + '<p>No payments recorded yet.</p></div></td></tr>';
        document.getElementById("payPager").innerHTML = "";
        return;
      }
      var pg = App.paginate(payments, payPage, WAGE_PAGE_SIZE);
      payPage = pg.page;
      body.innerHTML = pg.pageItems.map(function (p) {
        var lab = Data.getLabourers().find(function (l) { return l.id === p.labourerId; });
        return '<tr>' +
          '<td>' + Data.displayDate(p.date) + '</td>' +
          '<td>' + (lab ? lab.name : "—") + '</td>' +
          '<td><span class="chip ' + (p.type === "advance" ? "chip-amber" : "chip-green") + '">' + (p.type === "advance" ? "Advance" : "Payment") + '</span></td>' +
          '<td class="total-amount">₹' + p.amount + '</td>' +
        '</tr>';
      }).join("");
      App.renderPager(document.getElementById("payPager"), payPage, pg.totalPages, function (newPage) { payPage = newPage; renderPayments(); });
    }

    function renderSummary() {
      var attendance = Data.getAttendance().filter(function (a) { return a.projectId === projectId; });
      var labIds = Array.from(new Set(attendance.map(function (a) { return a.labourerId; })));
      var body = document.getElementById("summaryBody");
      if (!labIds.length) {
        body.innerHTML = '<tr><td colspan="6"><div class="empty-state compact">' + App.svg("people") + '<p>No labourers have worked on this project yet.</p></div></td></tr>';
        document.getElementById("summaryPager").innerHTML = "";
        return;
      }
      var rows = labIds.map(function (id) {
        var lab = Data.getLabourers().find(function (l) { return l.id === id; });
        var sum = Business.getWageSummary(id, { projectId: projectId });
        return { lab: lab, daysWorked: sum.daysWorked, earned: sum.earned, paid: sum.paid, owed: sum.owed };
      });
      rows = App.sortRows(rows, summarySortState, function (r, field) {
        if (field === "name") return r.lab ? r.lab.name : "";
        if (field === "skill") return r.lab ? r.lab.skill : "";
        return r[field];
      });
      var pg = App.paginate(rows, summaryPage, WAGE_PAGE_SIZE);
      summaryPage = pg.page;
      body.innerHTML = pg.pageItems.map(function (row) {
        var lab = row.lab;
        return '<tr>' +
          '<td>' + (lab ? lab.name : "—") + '</td>' +
          '<td><span class="chip chip-amber">' + (lab ? lab.skill : "") + '</span></td>' +
          '<td>' + row.daysWorked + '</td>' +
          '<td>₹' + Math.round(row.earned) + '</td>' +
          '<td>₹' + Math.round(row.paid) + '</td>' +
          '<td class="total-amount">₹' + Math.round(row.owed) + '</td>' +
        '</tr>';
      }).join("");
      App.renderPager(document.getElementById("summaryPager"), summaryPage, pg.totalPages, function (newPage) { summaryPage = newPage; renderSummary(); });
    }

    function renderAll() { renderStats(); renderPayments(); renderSummary(); }

    var payModal = document.getElementById("payModal");
    var addPayBtnEl = document.getElementById("addPayBtn");
    if (addPayBtnEl) addPayBtnEl.addEventListener("click", function () { payModal.classList.add("show"); });
    document.getElementById("closePayModal").addEventListener("click", function () { payModal.classList.remove("show"); });
    document.getElementById("cancelPayModal").addEventListener("click", function () { payModal.classList.remove("show"); });
    payModal.addEventListener("click", function (e) { if (e.target === payModal) payModal.classList.remove("show"); });

    document.getElementById("savePayBtn").addEventListener("click", function () {
      var labId = document.getElementById("payLabId").value;
      var amount = Number(document.getElementById("payAmount").value);
      if (!labId || !amount) { App.showToast("Pick a labourer and enter an amount", true); return; }
      var payments = Data.getWagePayments();
      payments.push({
        id: Data.uid("wp"), labourerId: labId, projectId: projectId,
        amount: amount, type: document.getElementById("payType").value,
        date: document.getElementById("payDate").value, notes: document.getElementById("payNotes").value.trim()
      });
      Data.saveWagePayments(payments);
      App.showToast("Payment recorded");
      document.getElementById("payForm").reset();
      document.getElementById("payLabId").value = "";
      document.getElementById("payDate").value = Data.isoDate(Data.today());
      payModal.classList.remove("show");
      renderAll();
    });

    renderAll();
  }
</script>
</body>
</html>
