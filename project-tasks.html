<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Tasks</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div class="app-shell">
  <div class="sidebar-backdrop"></div>
  <aside class="sidebar" id="sidebar"></aside>

  <div class="main">
    <header class="topbar" id="topbar"></header>

    <main class="content">
      <div class="page-header-row">
        <div><h2 id="projName">Loading…</h2><p id="projMeta"></p></div>
      </div>

      <div id="tabsMount"></div>
      <div id="pageBody"></div>
    </main>
  </div>
</div>

<div class="modal-overlay" id="completeTaskModal">
  <div class="modal-box">
    <div class="modal-header">
      <div><h3>Complete Task</h3><p>Capture a few closing details before marking this task done.</p></div>
      <button class="modal-close" id="closeCompleteTaskModal">&times;</button>
    </div>
    <div class="modal-body">
      <form id="completeTaskForm">
        <div class="field-grid">
          <div class="field"><label>Area (sqft)</label><input type="number" id="ctSqft" min="0"></div>
          <div class="field"><label>Cost (₹)</label><input type="number" id="ctCost" min="0"></div>
          <div class="field"><label>No. of Persons</label><input type="number" id="ctPersons" min="0"></div>
          <div class="field"><label>Person in Charge</label><input type="text" id="ctInCharge"></div>
          <div class="field"><label>Duration (days)</label><input type="number" id="ctDuration" min="0"></div>
          <div class="field full"><label>Material Used</label><input type="text" id="ctMaterial" placeholder="e.g. Cement, Sand, Bricks"></div>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" id="cancelCompleteTaskModal">Cancel</button>
      <button class="btn btn-primary" id="saveCompleteTaskBtn">Mark Complete</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="editTaskTableModal">
  <div class="modal-box">
    <div class="modal-header">
      <div><h3>Edit Task</h3><p>Update the core task details.</p></div>
      <button class="modal-close" id="closeEditTaskTableModal">&times;</button>
    </div>
    <div class="modal-body">
      <form id="editTaskTableForm">
        <input type="hidden" id="ettId">
        <div class="field-grid">
          <div class="field full"><label>Title</label><input type="text" id="ettTitle"></div>
          <div class="field full"><label>Assignee</label><input type="text" id="ettAssignee"></div>
          <div class="field"><label>Estimated Completion</label><input type="date" id="ettDate"></div>
          <div class="field"><label>Completed Date</label><input type="date" id="ettCompletedAt"></div>
          <div class="field full"><label>Notes</label><textarea id="ettNotes" rows="4"></textarea></div>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" id="cancelEditTaskTableModal">Cancel</button>
      <button class="btn btn-primary" id="saveEditTaskTableBtn">Save Changes</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="subtasksModal">
  <div class="modal-box" style="max-width:560px">
    <div class="modal-header">
      <div><h3 id="subtasksModalTitle">Subtasks</h3><p>Break this task into smaller steps and track completion.</p></div>
      <button class="modal-close" id="closeSubtasksModal">&times;</button>
    </div>
    <div class="modal-body">
      <div id="subtasksModalProgress" style="margin-bottom:16px"></div>
      <div class="checklist-box subtask-list" id="subtasksModalList"></div>
      <div class="subtask-add-row" id="subtasksModalAddRow">
        <input type="text" id="subtasksModalInput" placeholder="Add a subtask, then press Enter">
        <button type="button" class="btn btn-outline" id="subtasksModalAddBtn">+ Add</button>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" id="doneSubtasksModal">Close</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="taskDetailModal">
  <div class="modal-box wide">
    <div class="modal-header">
      <div><h3 id="tdmHeading">Task</h3><p id="tdmSubheading"></p></div>
      <button class="modal-close" id="closeTaskDetailModal">&times;</button>
    </div>
    <div class="modal-body">
      <div id="tdmTimelineStrip" class="timeline-strip"></div>
      <div class="field-grid">
        <div class="field full"><label>Title</label><input type="text" id="tdmTitle"></div>
        <div class="field"><label>Status</label><select id="tdmStatus"></select></div>
        <div class="field"><label>Estimated Completion</label><input type="date" id="tdmDate"></div>
        <div class="field"><label>Completed On</label><input type="date" id="tdmCompletedAt"></div>
        <div class="field full">
          <label>Assignee</label>
          <div style="display:flex;gap:8px">
            <input type="text" id="tdmAssignee" placeholder="Labourer / team" style="flex:1">
            <button type="button" class="btn btn-outline" id="tdmAssignToMeBtn">Assign to me</button>
          </div>
        </div>
        <div class="field full"><label>Description / Notes</label><textarea id="tdmNotes" rows="4" placeholder="Add details, blockers, or context about this task..."></textarea></div>
      </div>
      <div id="tdmCompletionDetails"></div>

      <div class="field-group-divider">Subtasks &amp; Progress</div>
      <div id="tdmProgressBar" style="margin-bottom:12px"></div>
      <div class="checklist-box subtask-list" id="tdmSubtaskList"></div>
      <div class="subtask-add-row" id="tdmSubtaskAddRow">
        <input type="text" id="tdmNewSubtaskInput" placeholder="Add a subtask, then press Enter">
        <button type="button" class="btn btn-outline" id="tdmAddSubtaskBtn">+ Add</button>
      </div>

      <div class="field-group-divider">Activity</div>
      <div id="tdmActivityFeed"></div>
    </div>
    <div class="modal-footer" style="justify-content:space-between">
      <button type="button" class="btn btn-outline" id="tdmDeleteTaskBtn" style="color:var(--danger);border-color:var(--danger)">Delete Task</button>
      <button type="button" class="btn btn-primary" id="doneTaskDetailModal">Close</button>
    </div>
  </div>
</div>

<script src="assets/data.js"></script>
<script src="assets/business.js"></script>
<script src="assets/app.js"></script>
<script src="assets/charts.js"></script>
<script>
  App.requireAuth();
  var projectId = new URLSearchParams(window.location.search).get("id");
  var project = Data.getProjects().find(function (p) { return p.id === projectId; });
  App.renderShell({ active: "projects", title: project ? project.name : "Project", subtitle: "Tasks & today's progress" });

  if (!project || !App.guardProjectAccess(projectId)) {
    document.getElementById("projName").textContent = project ? "Access restricted" : "Project not found";
  } else {
    document.getElementById("projName").textContent = project.name;
    document.getElementById("projMeta").textContent = project.code;
    document.getElementById("tabsMount").innerHTML = App.projectTabsHtml(projectId, "tasks");

    var canCreate = App.can("progress", "create");
    var canUpdate = App.can("progress", "update");
    var canDelete = App.can("progress", "delete");
    var activeView = "table";

    function fieldDefs() {
      return Data.getTaskFieldDefs().filter(function (f) { return f.projectId === projectId; });
    }

    function statusColumns() { return Business.getProjectStatusColumns(projectId); }
    function statusMeta(key) { return statusColumns().find(function (s) { return s.key === key; }) || { key: key, label: key, builtin: true }; }
    function statusColClass(col) { return col.key === "todo" ? "col-todo" : col.key === "in_progress" ? "col-in_progress" : col.key === "done" ? "col-done" : "col-custom"; }

    document.getElementById("pageBody").innerHTML =
      '<div class="view-toggle" id="viewToggle">' +
        '<button class="view-toggle-btn" data-view="table">' + App.svg("fileText") + ' Table</button>' +
        '<button class="view-toggle-btn" data-view="board">' + App.svg("columns") + ' Board</button>' +
        '<button class="view-toggle-btn" data-view="timeline">' + App.svg("clock") + ' Timeline</button>' +
      '</div>' +
      '<div id="boardView" style="display:none"><div class="kanban-board" id="kanbanBoard"></div></div>' +
      '<div id="timelineView" style="display:none">' +
        '<div class="panel full-panel">' +
          '<div class="panel-header"><h3>Task Timeline</h3><span class="panel-tag" id="timelineCount"></span></div>' +
          '<div id="timelineList"></div>' +
          '<div class="panel-footer-row" style="justify-content:flex-end" id="timelinePager"></div>' +
        '</div>' +
      '</div>' +
      '<div id="tableView">' +
        '<div class="panel full-panel">' +
          '<div class="panel-header"><h3>All Tasks — Status Overview</h3>' +
            '<div style="display:flex;align-items:center;gap:14px">' +
              '<span class="panel-tag" id="taskCount"></span>' +
              (canCreate ?
              '<div class="kanban-quick-add" id="tableQuickAdd" style="max-width:260px;margin-bottom:0">' +
                '<button class="kanban-quick-add-btn" id="tableQuickAddOpen">' + App.svg("plus") + ' Add task</button>' +
                '<div class="kanban-quick-add-form" id="tableQuickAddForm" style="display:none">' +
                  '<input type="text" placeholder="Task title, then Enter" id="tableQuickAddInput">' +
                '</div>' +
              '</div>' : '') +
            '</div>' +
          '</div>' +
          '<div class="table-scroll"><table class="data-table"><thead><tr id="taskTableHead"></tr></thead><tbody id="taskTableBody"></tbody></table></div>' +
          '<div class="panel-footer-row" style="justify-content:flex-end" id="taskTablePager"></div>' +
        '</div>' +
      '</div>';

    var taskSortState = { field: null, dir: "asc" };
    var taskPage = 1;
    var TASK_PAGE_SIZE = 10;
    App.wireSort(document.getElementById("taskTableHead"), taskSortState, function () { taskPage = 1; renderTable(); });

    function statusPillClass(s) { return s === "done" ? "delivered" : s === "todo" ? "pending" : "confirmed"; }

    function fieldChipsHtml(t) {
      var defs = fieldDefs();
      if (!defs.length || !t.customFields) return "";
      var chips = defs.map(function (f) {
        var v = t.customFields[f.key];
        if (v === undefined || v === null || v === "") return "";
        return '<span class="kanban-card-field-chip">' + f.label + ": " + v + '</span>';
      }).join("");
      return chips ? '<div class="kanban-card-fields">' + chips + '</div>' : "";
    }

    function progressColor(percent) {
      return percent >= 80 ? "#16a34a" : percent >= 40 ? "#f59e0b" : "#ea580c";
    }
    function miniProgressHtml(percent) {
      return '<div class="progress-bar-mini"><div class="progress-bar-track"><div class="progress-bar-fill" style="width:' + percent + '%;background:' + progressColor(percent) + '"></div></div><span>' + Math.round(percent) + '%</span></div>';
    }

    function renderKanban() {
      var tasks = Data.getTasks().filter(function (t) { return t.projectId === projectId; });
      var board = document.getElementById("kanbanBoard");
      var columns = statusColumns();
      var columnsHtml = columns.map(function (col) {
        var colTasks = tasks.filter(function (t) { return t.status === col.key; });
        var cardsHtml = colTasks.map(function (t) { return taskCardHtml(t, col.key); }).join("");
        var quickAdd = canCreate
          ? '<div class="kanban-quick-add" data-quick-add-col="' + col.key + '">' +
              '<button class="kanban-quick-add-btn" data-quick-add-open="' + col.key + '">' + App.svg("plus") + ' Add task</button>' +
              '<div class="kanban-quick-add-form" data-quick-add-form="' + col.key + '" style="display:none">' +
                '<input type="text" placeholder="Task title, then Enter" data-quick-add-input="' + col.key + '">' +
              '</div>' +
            '</div>'
          : "";
        var delBtn = (!col.builtin && canUpdate) ? '<button type="button" class="col-del-btn" data-del-status="' + col.id + '" title="Remove this column">' + App.svg("trash") + '</button>' : "";
        return '<div class="kanban-column ' + statusColClass(col) + '" data-status-col="' + col.key + '">' +
          '<div class="kanban-column-header"><span>' + col.label + '</span><span class="kanban-count">' + colTasks.length + '</span>' + delBtn + '</div>' +
          quickAdd +
          (cardsHtml || '<div class="kanban-empty">No tasks here</div>') +
        '</div>';
      }).join("");

      var addColumn = canUpdate
        ? '<div class="kanban-add-column">' +
            '<button class="kanban-add-column-btn" id="addColumnOpenBtn">' + App.svg("plus") + ' Add column</button>' +
            '<form class="kanban-add-column-form" id="addColumnForm" style="display:none">' +
              '<input type="text" id="newColumnLabel" placeholder="Column name, e.g. Review">' +
              '<button type="submit" class="btn btn-primary" style="width:100%">Add</button>' +
            '</form>' +
          '</div>'
        : "";

      board.innerHTML = columnsHtml + addColumn;
      wireDragAndDrop();
      wireAddColumn();
    }

    function taskCardHtml(t, statusKey) {
      var keys = statusColumns().map(function (s) { return s.key; });
      var idx = keys.indexOf(statusKey);
      var prevKey = keys[idx - 1];
      var nextKey = keys[idx + 1];
      var actions = "";
      if (canUpdate) {
        actions += '<div class="kanban-card-actions">';
        actions += prevKey ? '<button class="kanban-move-btn" data-move="' + t.id + '" data-to="' + prevKey + '">' + App.svg("arrowRight") + ' Back</button>' : '<span style="flex:1"></span>';
        actions += nextKey ? '<button class="kanban-move-btn" data-move="' + t.id + '" data-to="' + nextKey + '">Next ' + App.svg("arrowRight") + '</button>' : '<span style="flex:1"></span>';
        if (canDelete) actions += '<button class="kanban-move-btn del" data-del="' + t.id + '">' + App.svg("trash") + '</button>';
        actions += '</div>';
      }
      var progress = Business.getTaskProgress(t);
      var timelineHtml = '<div class="kanban-card-timeline">' +
        '<span>Created ' + (t.createdAt ? Data.displayDate(t.createdAt) : "—") + '</span>' +
        (t.date ? '<span class="dot-sep">·</span><span>Est. ' + Data.displayDate(t.date) + '</span>' : '') +
        (t.completedAt ? '<span class="dot-sep">·</span><span>Completed ' + Data.displayDate(t.completedAt) + '</span>' : '') +
      '</div>';
      return '<div class="kanban-card" draggable="' + (canUpdate ? "true" : "false") + '" data-task-id="' + t.id + '" data-open-task="' + t.id + '">' +
        '<div class="kanban-card-title-row">' +
          '<div class="kanban-card-title">' + t.title + '</div>' +
          '<span class="status-pill ' + statusPillClass(t.status) + '">' + statusMeta(t.status).label + '</span>' +
        '</div>' +
        '<div class="kanban-card-meta"><span class="kanban-card-assignee">' + App.svg("people") + ' ' + (t.assignee || "Unassigned") + '</span></div>' +
        timelineHtml +
        (progress.totalCount > 0 ? '<div style="margin-top:8px">' + miniProgressHtml(progress.percent) + '</div>' : "") +
        fieldChipsHtml(t) +
        actions +
      '</div>';
    }

    function wireDragAndDrop() {
      if (!canUpdate) return;
      document.querySelectorAll(".kanban-card[draggable='true']").forEach(function (card) {
        card.addEventListener("dragstart", function (e) {
          e.dataTransfer.setData("text/plain", card.getAttribute("data-task-id"));
          e.dataTransfer.effectAllowed = "move";
          card.classList.add("dragging");
        });
        card.addEventListener("dragend", function () { card.classList.remove("dragging"); });
      });
      document.querySelectorAll(".kanban-column").forEach(function (col) {
        col.addEventListener("dragover", function (e) {
          e.preventDefault();
          e.dataTransfer.dropEffect = "move";
          col.classList.add("drag-over");
        });
        col.addEventListener("dragleave", function () { col.classList.remove("drag-over"); });
        col.addEventListener("drop", function (e) {
          e.preventDefault();
          col.classList.remove("drag-over");
          var taskId = e.dataTransfer.getData("text/plain");
          var newStatus = col.getAttribute("data-status-col");
          if (taskId && newStatus) moveTaskTo(taskId, newStatus);
        });
      });
    }

    function renderTable() {
      var defs = fieldDefs();
      var head = document.getElementById("taskTableHead");
      head.innerHTML =
        App.sortableTh("Task", "title", taskSortState) +
        App.sortableTh("Assignee", "assignee", taskSortState) +
        App.sortableTh("Status", "status", taskSortState) +
        '<th>Progress</th>' +
        App.sortableTh("Created", "createdAt", taskSortState) +
        App.sortableTh("Completed", "completedAt", taskSortState) +
        defs.map(function (f) { return '<th>' + f.label + '</th>'; }).join("") +
        '<th></th>';

      var tasks = App.sortRows(
        Data.getTasks().filter(function (t) { return t.projectId === projectId; }),
        taskSortState.field ? taskSortState : { field: "createdAt", dir: "desc" }
      );
      document.getElementById("taskCount").textContent = tasks.length + " task(s)";
      var body = document.getElementById("taskTableBody");
      if (!tasks.length) {
        body.innerHTML = '<tr><td colspan="' + (7 + defs.length) + '"><div class="empty-state compact">' + App.svg("columns") + '<p>No tasks yet.</p></div></td></tr>';
        document.getElementById("taskTablePager").innerHTML = "";
        return;
      }
      var pg = App.paginate(tasks, taskPage, TASK_PAGE_SIZE);
      taskPage = pg.page;
      body.innerHTML = pg.pageItems.map(function (t) {
        var progress = Business.getTaskProgress(t);
        return '<tr>' +
          '<td><a href="#" data-open-task-detail="' + t.id + '"><strong>' + t.title + '</strong></a></td>' +
          '<td>' + (t.assignee || "—") + '</td>' +
          '<td><span class="status-pill ' + statusPillClass(t.status) + '">' + statusMeta(t.status).label + '</span></td>' +
          '<td style="min-width:110px">' + miniProgressHtml(progress.percent) + '</td>' +
          '<td>' + (t.createdAt ? Data.displayDate(t.createdAt) : '<span class="desc-cell">—</span>') + '</td>' +
          '<td>' + (t.completedAt ? Data.displayDate(t.completedAt) : '<span class="desc-cell">—</span>') + '</td>' +
          defs.map(function (f) { var v = t.customFields && t.customFields[f.key]; return '<td>' + (v === undefined || v === null || v === "" ? "—" : v) + '</td>'; }).join("") +
          '<td><div class="action-buttons-row">' +
            '<button class="action-trigger" data-subtasks="' + t.id + '" title="Subtasks">' + App.svg("check") + '</button>' +
            (canUpdate ? '<button class="action-trigger" data-edit-task="' + t.id + '">' + App.svg("edit") + '</button>' : "") +
            (canDelete ? '<button class="action-trigger" data-del="' + t.id + '">' + App.svg("trash") + '</button>' : "") +
          '</div></td>' +
        '</tr>';
      }).join("");

      App.renderPager(document.getElementById("taskTablePager"), taskPage, pg.totalPages, function (newPage) { taskPage = newPage; renderTable(); });
    }

    var timelinePage = 1;
    var TIMELINE_PAGE_SIZE = 10;

    function timelineRowHtml(t) {
      var createdText = t.createdAt ? Data.displayDate(t.createdAt) + " by " + creatorName(t.createdBy) : "—";
      var estimatedText = t.date ? Data.displayDate(t.date) : "Not set";
      var completedText = t.completedAt ? Data.displayDate(t.completedAt) : "Not yet completed";
      return '<div class="panel" style="padding:16px 20px;margin-bottom:12px;cursor:pointer" data-open-task-detail="' + t.id + '">' +
        '<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">' +
          '<strong style="font-size:14px">' + t.title + '</strong>' +
          '<span class="status-pill ' + statusPillClass(t.status) + '">' + statusMeta(t.status).label + '</span>' +
        '</div>' +
        '<div class="timeline-strip" style="margin:12px 0 0">' +
          '<div class="timeline-step"><span class="timeline-dot done"></span><div><strong>Created</strong><span>' + createdText + '</span></div></div>' +
          '<div class="timeline-connector"></div>' +
          '<div class="timeline-step"><span class="timeline-dot ' + (t.date ? "done" : "pending") + '"></span><div><strong>Estimated Completion</strong><span>' + estimatedText + '</span></div></div>' +
          '<div class="timeline-connector"></div>' +
          '<div class="timeline-step"><span class="timeline-dot ' + (t.completedAt ? "done" : "pending") + '"></span><div><strong>Completed</strong><span>' + completedText + '</span></div></div>' +
        '</div>' +
      '</div>';
    }

    function renderTimelineView() {
      var tasks = App.sortRows(
        Data.getTasks().filter(function (t) { return t.projectId === projectId; }),
        { field: "createdAt", dir: "desc" }
      );
      document.getElementById("timelineCount").textContent = tasks.length + " task(s)";
      var listEl = document.getElementById("timelineList");
      if (!tasks.length) {
        listEl.innerHTML = '<div class="empty-state compact">' + App.svg("clock") + '<p>No tasks yet.</p></div>';
        document.getElementById("timelinePager").innerHTML = "";
        return;
      }
      var pg = App.paginate(tasks, timelinePage, TIMELINE_PAGE_SIZE);
      timelinePage = pg.page;
      listEl.innerHTML = pg.pageItems.map(timelineRowHtml).join("");
      App.renderPager(document.getElementById("timelinePager"), timelinePage, pg.totalPages, function (newPage) { timelinePage = newPage; renderTimelineView(); });
    }

    function wireAddColumn() {
      var openBtn = document.getElementById("addColumnOpenBtn");
      var form = document.getElementById("addColumnForm");
      if (!openBtn || !form) return;
      openBtn.addEventListener("click", function () {
        openBtn.style.display = "none";
        form.style.display = "";
        form.querySelector("input").focus();
      });
      form.addEventListener("submit", function (e) {
        e.preventDefault();
        var label = document.getElementById("newColumnLabel").value.trim();
        if (!label) { App.showToast("Enter a column name", true); return; }
        var key = label.toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_+|_+$/g, "") || Data.uid("col");
        var reserved = ["todo", "in_progress", "done"];
        var defs = Data.getTaskStatusDefs();
        if (reserved.indexOf(key) !== -1 || defs.some(function (s) { return s.projectId === projectId && s.key === key; })) {
          App.showToast("A column with that name already exists", true);
          return;
        }
        var maxOrder = defs.filter(function (s) { return s.projectId === projectId; })
          .reduce(function (max, s) { return Math.max(max, s.order); }, 0);
        defs.push({ id: Data.uid("col"), projectId: projectId, key: key, label: label, order: maxOrder + 1 });
        Data.saveTaskStatusDefs(defs);
        App.showToast("Column added");
        renderAll();
      });
    }

    document.getElementById("pageBody").addEventListener("click", function (e) {
      var delCol = e.target.closest("[data-del-status]");
      if (!delCol) return;
      var colDefId = delCol.getAttribute("data-del-status");
      var col = Data.getTaskStatusDefs().find(function (s) { return s.id === colDefId; });
      if (!col) return;
      if (!confirm('Remove the "' + col.label + '" column? Any tasks in it will be moved back to To Do.')) return;
      var tasks = Data.getTasks();
      tasks.forEach(function (t) { if (t.projectId === projectId && t.status === col.key) t.status = "todo"; });
      Data.saveTasks(tasks);
      Data.saveTaskStatusDefs(Data.getTaskStatusDefs().filter(function (s) { return s.id !== colDefId; }));
      App.showToast("Column removed");
      renderAll();
    });

    function renderAll() { renderKanban(); renderTable(); renderTimelineView(); }

    function setView(view) {
      activeView = view;
      document.getElementById("boardView").style.display = view === "board" ? "" : "none";
      document.getElementById("tableView").style.display = view === "table" ? "" : "none";
      document.getElementById("timelineView").style.display = view === "timeline" ? "" : "none";
      document.querySelectorAll(".view-toggle-btn").forEach(function (b) {

    /* Auto-generate (or refresh) a work report the moment a task lands in Done —
       so daily reports reflect completed work without a separate manual entry. */
    function syncCompletionReport(task) {
      var reports = Data.getWorkReports();
      var existing = reports.find(function (r) { return r.taskId === task.id && r.source === "task_complete"; });
      var today = Data.isoDate(Data.today());
      if (existing) {
        existing.date = today;
        existing.title = task.title;
        existing.description = "Task completed: " + task.title + (task.assignee ? " (" + task.assignee + ")" : "") + ".";
      } else {
        reports.push({
          id: Data.uid("wr"), projectId: projectId, date: today, title: task.title,
          description: "Task completed: " + task.title + (task.assignee ? " (" + task.assignee + ")" : "") + ".",
          source: "task_complete", taskId: task.id
        });
      }
      Data.saveWorkReports(reports);
    }

    /* Auto-fills the Expenses tab with the material cost captured on task completion,
       so the cost of materials used doesn't need a separate manual expense entry. */
    function syncCompletionExpense(task) {
      var expenses = Data.getExpenses();
      var existing = expenses.find(function (e) { return e.taskId === task.id && e.category === "task_completion"; });
      var cost = task.completionCost || 0;
      if (cost <= 0) {
        if (existing) Data.saveExpenses(expenses.filter(function (e) { return e.id !== existing.id; }));
        return;
      }
      var desc = "Task completed: " + task.title + (task.materialUsed ? " — Materials: " + task.materialUsed : "");
      if (existing) {
        existing.amount = cost;
        existing.description = desc;
        existing.date = task.completedAt || Data.isoDate(Data.today());
      } else {
        expenses.push({
          id: Data.uid("ex"), projectId: projectId, category: "task_completion",
          amount: cost, date: task.completedAt || Data.isoDate(Data.today()),
          description: desc, taskId: task.id
        });
      }
      Data.saveExpenses(expenses);
    }

    function moveTaskTo(taskId, newStatus) {
      var tasks = Data.getTasks();
      var task = tasks.find(function (t) { return t.id === taskId; });
      if (!task || task.status === newStatus) return;
      if (newStatus === "done" && task.status !== "done") {
        openCompleteTaskModal(taskId);
        return;
      }
      var oldStatus = task.status;
      task.status = newStatus;
      Data.saveTasks(tasks);
      Data.addTaskActivity(taskId, "Status changed from " + statusMeta(oldStatus).label + " to " + statusMeta(newStatus).label);
      renderAll();
    }

    function editSubtasksModalInline(btn) {
      var id = btn.getAttribute("data-subtask-edit");
      var row = btn.closest(".subtask-row");
      var titleSpan = row.querySelector(".subtask-title");
      var currentTitle = titleSpan.textContent;
      var input = document.createElement("input");
      input.type = "text";
      input.className = "subtask-edit-input";
      input.value = currentTitle;
      titleSpan.replaceWith(input);
      input.focus();
      input.select();

      var committed = false;
      function commit() {
        if (committed) return;
        committed = true;
        var newTitle = input.value.trim();
        if (newTitle && newTitle !== currentTitle && currentSubtasksTaskId) {
          var tasks = Data.getTasks();
          var t = tasks.find(function (x) { return x.id === currentSubtasksTaskId; });
          if (t) {
            t.subtasks = (t.subtasks || []).map(function (s) { return s.id === id ? Object.assign({}, s, { title: newTitle }) : s; });
            Data.saveTasks(tasks);
            Data.addTaskActivity(t.id, 'Subtask renamed: "' + currentTitle + '" → "' + newTitle + '"');
            renderAll();
          }
        }
        renderSubtasksModalList();
      }
      input.addEventListener("keydown", function (e) {
        if (e.key === "Enter") { e.preventDefault(); commit(); }
        else if (e.key === "Escape") { e.preventDefault(); committed = true; renderSubtasksModalList(); }
      });
      input.addEventListener("blur", commit);
    }

    document.getElementById("subtasksModalList").addEventListener("change", function (e) {

      var t = tasks.find(function (x) { return x.id === currentSubtasksTaskId; });
      if (!t) return;
      var id = cb.getAttribute("data-subtask-toggle");
      t.subtasks = (t.subtasks || []).map(function (s) { return s.id === id ? Object.assign({}, s, { done: cb.checked }) : s; });
      Data.saveTasks(tasks);
      var st = t.subtasks.find(function (s) { return s.id === id; });
      Data.addTaskActivity(t.id, (st.done ? "Subtask completed: " : "Subtask reopened: ") + st.title);
      renderSubtasksModalProgress();
      renderSubtasksModalList();
      renderAll();
      var allDone = t.subtasks.length > 0 && t.subtasks.every(function (s) { return s.done; });
      if (allDone && t.status !== "done") {
        var taskIdForCompletion = t.id;
        closeSubtasksModal();
        openCompleteTaskModal(taskIdForCompletion);

      var id = btn.getAttribute("data-tdm-subtask-edit");
      var row = btn.closest(".subtask-row");
      var titleSpan = row.querySelector(".subtask-title");

      var committed = false;

        if (newTitle && newTitle !== currentTitle && t) {

      input.addEventListener("keydown", function (e) {
        if (e.key === "Enter") { e.preventDefault(); commit(); }
        else if (e.key === "Escape") { e.preventDefault(); committed = true; renderTdmSubtaskList(); }
      });
      input.addEventListener("blur", commit);
    }

    function addTdmSubtaskFromInput() {
      var input = document.getElementById("tdmNewSubtaskInput");
      var t = getCurrentTaskDetail();
      if (!input || !t) return;
      var title = input.value.trim();
      if (!title) return;
      saveTdmTaskPatch({ subtasks: (t.subtasks || []).concat([{ id: Data.uid("st"), title: title, done: false }]) });
      Data.addTaskActivity(t.id, "Subtask added: " + title);
      input.value = "";
      input.focus();
      renderTdmProgress();
      renderTdmSubtaskList();
      renderTdmActivity();
    }

    function renderTdmActivity() {
      var t = getCurrentTaskDetail();
      var feedEl = document.getElementById("tdmActivityFeed");
      if (!t || !feedEl) return;
      var entries = Data.getTaskActivity().filter(function (a) { return a.taskId === t.id; })
        .sort(function (a, b) { return a.date < b.date ? 1 : (a.date > b.date ? -1 : (a.id < b.id ? 1 : -1)); });
      feedEl.innerHTML = entries.length
        ? '<div class="activity-list">' + entries.map(function (a) {
            return '<div class="activity-item"><div class="activity-dot"></div><div><p>' + a.message + '</p><span>' + Data.displayDate(a.date) + '</span></div></div>';
          }).join("") + '</div>'
        : '<div class="empty-state compact">' + App.svg("clock") + '<p>No activity logged yet.</p></div>';
    }

    document.getElementById("tdmTitle").addEventListener("change", function () {
      saveTdmTaskPatch({ title: this.value.trim() || "Untitled task" });
      document.getElementById("tdmHeading").textContent = this.value.trim() || "Untitled task";
    });
    document.getElementById("tdmStatus").addEventListener("change", function () {
      var newStatus = this.value;
      var t = getCurrentTaskDetail();
      if (!t) return;
      if (newStatus === "done" && t.status !== "done") {
        var idForCompletion = t.id;
        closeTaskDetailModal();
        openCompleteTaskModal(idForCompletion);
        return;
      }
      var oldStatus = t.status;
      saveTdmTaskPatch({ status: newStatus });
      Data.addTaskActivity(t.id, "Status changed from " + statusMeta(oldStatus).label + " to " + statusMeta(newStatus).label);
      renderTaskDetailModal();
      App.showToast("Status updated to " + statusMeta(newStatus).label);
    });
    document.getElementById("tdmAssignee").addEventListener("change", function () { saveTdmTaskPatch({ assignee: this.value.trim() }); });
    document.getElementById("tdmDate").addEventListener("change", function () { saveTdmTaskPatch({ date: this.value || null }); renderTaskDetailModal(); });
    document.getElementById("tdmCompletedAt").addEventListener("change", function () {
      var newDate = this.value || null;
      var t = getCurrentTaskDetail();
      if (!t) return;
      if (newDate && t.status !== "done") {
        var idForCompletion2 = t.id;
        closeTaskDetailModal();
        openCompleteTaskModal(idForCompletion2, newDate);
        return;
      }
      saveTdmTaskPatch({ completedAt: newDate });
      renderTaskDetailModal();
    });
    document.getElementById("tdmNotes").addEventListener("change", function () { saveTdmTaskPatch({ notes: this.value }); });

    document.getElementById("tdmAssignToMeBtn").addEventListener("click", function () {
      var me = App.getCurrentUser();
      if (!me) return;
      document.getElementById("tdmAssignee").value = me.name;
      saveTdmTaskPatch({ assignee: me.name });
      App.showToast("Assigned to you");
    });

    document.getElementById("tdmDeleteTaskBtn").addEventListener("click", function () {
      var t = getCurrentTaskDetail();
      if (!t) return;
      if (!confirm("Delete this task?")) return;
      Data.saveTasks(Data.getTasks().filter(function (x) { return x.id !== t.id; }));
      App.showToast("Task removed");
      closeTaskDetailModal();
      renderAll();
    });

    document.getElementById("tdmSubtaskList").addEventListener("change", function (e) {
      var cb = e.target.closest("[data-tdm-subtask-toggle]");
      if (!cb) return;
      var t = getCurrentTaskDetail();
      if (!t) return;
      var id = cb.getAttribute("data-tdm-subtask-toggle");
      var subtasks = (t.subtasks || []).map(function (s) { return s.id === id ? Object.assign({}, s, { done: cb.checked }) : s; });
      saveTdmTaskPatch({ subtasks: subtasks });
      var st = subtasks.find(function (s) { return s.id === id; });
      Data.addTaskActivity(t.id, (st.done ? "Subtask completed: " : "Subtask reopened: ") + st.title);
      renderTdmProgress();
      renderTdmSubtaskList();
      renderTdmActivity();
      var allDone = subtasks.length > 0 && subtasks.every(function (s) { return s.done; });
      if (allDone && t.status !== "done") {
        var idForCompletion3 = t.id;
        closeTaskDetailModal();
        openCompleteTaskModal(idForCompletion3);
      }
    });
    document.getElementById("tdmSubtaskList").addEventListener("click", function (e) {
      var editBtn = e.target.closest("[data-tdm-subtask-edit]");
      if (editBtn) { editTdmSubtaskInline(editBtn); return; }
      var btn = e.target.closest("[data-tdm-subtask-del]");
      if (!btn) return;
      var t = getCurrentTaskDetail();
      if (!t) return;
      var id = btn.getAttribute("data-tdm-subtask-del");
      var removed = (t.subtasks || []).find(function (s) { return s.id === id; });
      saveTdmTaskPatch({ subtasks: (t.subtasks || []).filter(function (s) { return s.id !== id; }) });
      if (removed) Data.addTaskActivity(t.id, "Subtask removed: " + removed.title);
      renderTdmProgress();
      renderTdmSubtaskList();
      renderTdmActivity();
    });
    document.getElementById("tdmAddSubtaskBtn").addEventListener("click", addTdmSubtaskFromInput);
    document.getElementById("tdmNewSubtaskInput").addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); addTdmSubtaskFromInput(); } });

    renderAll();
  }
</script>
</body>
</html>
