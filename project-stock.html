<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Stock</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div class="app-shell">
  <div class="sidebar-backdrop"></div>
  <aside class="sidebar" id="sidebar"></aside>

  <div class="main">
    <header class="topbar" id="topbar"></header>

    <main class="content">
      <div class="page-header-row">
        <div><h2 id="projName">Loading…</h2><p id="projMeta"></p></div>
      </div>

      <div id="tabsMount"></div>
      <div id="pageBody"></div>
    </main>
  </div>
</div>

<div class="modal-overlay" id="downloadModal">
  <div class="modal-box">
    <div class="modal-header">
      <div><h3 id="downloadModalTitle">Download</h3><p>Choose a file format and date range to export.</p></div>
      <button class="modal-close" id="closeDownloadModal">&times;</button>
    </div>
    <div class="modal-body">
      <form id="downloadForm">
        <div class="field-grid">
          <div class="field full">
            <label>File Format</label>
            <div class="format-toggle" id="dlFormatToggle">
              <button type="button" class="format-toggle-btn active" data-format="pdf">PDF</button>
              <button type="button" class="format-toggle-btn" data-format="csv">CSV</button>
            </div>
            <input type="hidden" id="dlFormat" value="pdf">
          </div>
          <div class="field"><label>From Date</label><input type="date" id="dlFrom"></div>
          <div class="field"><label>To Date</label><input type="date" id="dlTo"></div>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" id="cancelDownloadModal">Cancel</button>
      <button class="btn btn-primary" id="confirmDownloadBtn">Download</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="editTxnModal">
  <div class="modal-box">
    <div class="modal-header">
      <div><h3>Edit Stock Transaction</h3><p id="editTxnSubtitle">Correct the quantity, rate, or date recorded for this movement.</p></div>
      <button class="modal-close" id="closeEditTxnModal">&times;</button>
    </div>
    <div class="modal-body">
      <form id="editTxnForm">
        <div class="field-grid">
          <div class="field"><label>Quantity</label><input type="number" id="etQty" min="0" step="0.01"></div>
          <div class="field"><label>Rate / unit (₹)</label><input type="number" id="etRate" min="0" step="0.01"></div>
          <div class="field"><label>Date</label><input type="date" id="etDate"></div>
          <div class="field" id="etSupplierWrap"><label>Supplier</label><input type="text" id="etSupplier"></div>
          <div class="field" id="etBillNoWrap"><label>Bill No.</label><input type="text" id="etBillNo"></div>
          <div class="field" id="etGstWrap"><label>GST (%)</label><input type="number" id="etGst" min="0" step="0.01"></div>
          <div class="field full"><span class="field-hint" id="etAmountPreview"></span></div>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" id="cancelEditTxnModal">Cancel</button>
      <button class="btn btn-primary" id="saveEditTxnBtn">Save Changes</button>
    </div>
  </div>
</div>

<script src="assets/data.js"></script>
<script src="assets/business.js"></script>
<script src="assets/app.js"></script>
<script src="assets/charts.js"></script>
<script>
  App.requireAuth();
  var projectId = new URLSearchParams(window.location.search).get("id");
  var project = Data.getProjects().find(function (p) { return p.id === projectId; });
  App.renderShell({ active: "projects", title: project ? project.name : "Project", subtitle: "Stock & materials" });

  if (!project || !App.guardProjectAccess(projectId)) {
    document.getElementById("projName").textContent = project ? "Access restricted" : "Project not found";
  } else {
    document.getElementById("projName").textContent = project.name;
    document.getElementById("projMeta").textContent = project.code;
    document.getElementById("tabsMount").innerHTML = App.projectTabsHtml(projectId, "stock");

    var materials = Data.getMaterials();
    var materialOptions = materials.map(function (m) { return '<option value="' + m.id + '">' + m.name + ' (' + m.unit + ')</option>'; }).join("");
    var otherProjects = Data.getProjects().filter(function (p) { return p.id !== projectId; });
    var otherProjectOptions = otherProjects.map(function (p) { return '<option value="' + p.id + '">' + p.name + ' (' + p.code + ')</option>'; }).join("");
    var canCreate = App.can("stock", "create");
    var canDelete = App.can("stock", "delete");
    var canUpdate = App.can("stock", "update");

    document.getElementById("pageBody").innerHTML =
      (canCreate ?
      '<div class="panel full-panel">' +
        '<div class="panel-header"><h3>Record Stock Movement</h3><span class="section-subheading" style="margin:0">Materials can be restocked (inward) as many times as needed.</span></div>' +
        '<form class="inline-add-form" id="stockForm">' +
          '<div class="field" style="flex:1.4;min-width:180px"><label>Material</label><select id="sMaterial">' + materialOptions + '</select></div>' +
          '<div class="field"><label>Type</label><select id="sType"><option value="inward">Inward (purchase)</option><option value="outward">Outward (used)</option><option value="adjustment">Adjustment</option></select></div>' +
          '<div class="field" id="sSourceWrap"><label>Source</label><select id="sSource">' +
            '<option value="purchase">Vendor purchase</option>' +
            '<option value="godown">Godown (central store)</option>' +
            '<option value="transfer">Transferred from another project</option>' +
          '</select></div>' +
          '<div class="field"><label>Quantity</label><input type="number" id="sQty" min="0" step="0.01" required></div>' +
          '<div class="field"><label>Rate / unit (₹)</label><input type="number" id="sRate" min="0"></div>' +
          '<div class="field"><label>Date</label><input type="date" id="sDate"></div>' +
          '<div class="field" style="flex:1.4;min-width:160px" id="sSupplierWrap"><label>Supplier</label><input type="text" id="sSupplier"></div>' +
          '<div class="field" id="sBillNoWrap"><label>Bill No.</label><input type="text" id="sBillNo" placeholder="e.g. INV-2451"></div>' +
          '<div class="field" id="sGstWrap"><label>GST (%)</label><input type="number" id="sGst" min="0" step="0.01" value="0"></div>' +
          '<div class="field" style="flex:1.4;min-width:200px;display:none" id="sSourceProjectWrap"><label>From Project</label><select id="sSourceProject">' + otherProjectOptions + '</select></div>' +
          '<button type="submit" class="btn btn-primary">+ Add Entry</button>' +
        '</form>' +
      '</div>' : '') +
      '<div class="stat-grid stat-grid-tight" id="statGrid"></div>' +
      '<div class="view-toggle" id="stockViewToggle">' +
        '<button class="view-toggle-btn" data-view="balance">' + App.svg("warehouse") + ' Stock Balance</button>' +
        '<button class="view-toggle-btn" data-view="transactions">' + App.svg("fileText") + ' Transactions</button>' +
        '<button class="view-toggle-btn" data-view="materials">' + App.svg("box") + ' Materials Used</button>' +
        '<button class="view-toggle-btn" data-view="byTask">' + App.svg("columns") + ' By Task</button>' +
      '</div>' +
      '<div id="balanceView">' +
        '<div class="panel full-panel">' +
          '<div class="panel-header"><h3>Current Stock Balance</h3><button class="btn btn-outline" id="downloadBalanceBtn" data-download="balance" style="padding:7px 14px;font-size:12.5px">' + App.svg("download") + ' Download</button></div>' +
          '<div class="table-scroll"><table class="data-table"><thead><tr id="balanceHeadRow"></tr></thead><tbody id="balanceBody"></tbody></table></div>' +
        '</div>' +
      '</div>' +
      '<div id="transactionsView" style="display:none">' +
        '<div class="panel full-panel">' +
          '<div class="panel-header"><h3>Transaction History</h3><div style="display:flex;align-items:center;gap:10px"><span class="panel-tag" id="txnCount"></span><button class="btn btn-outline" id="downloadTxnBtn" data-download="transactions" style="padding:7px 14px;font-size:12.5px">' + App.svg("download") + ' Download</button></div></div>' +
          '<div class="table-scroll"><table class="data-table"><thead><tr id="txnHeadRow"></tr></thead><tbody id="txnBody"></tbody><tfoot id="txnFoot"></tfoot></table></div>' +
          '<div class="panel-footer-row" style="justify-content:flex-end" id="txnPager"></div>' +
        '</div>' +
      '</div>' +
      '<div id="materialsView" style="display:none">' +
        '<div class="panel full-panel">' +
          '<div class="panel-header"><h3>Total Materials Used — All Tasks</h3><div style="display:flex;align-items:center;gap:10px"><span class="panel-tag" id="materialsUsedTotalCount"></span><button class="btn btn-outline" id="downloadMaterialsBtn" data-download="materials" style="padding:7px 14px;font-size:12.5px">' + App.svg("download") + ' Download</button></div></div>' +
          '<p class="section-subheading" style="margin:2px 0 14px">Every material used across this project\'s tasks, added up regardless of which task it was recorded against.</p>' +
          '<div class="table-scroll"><table class="data-table"><thead><tr><th>Material</th><th>Total Quantity Used</th><th>Used In</th><th>Remaining in Stock</th></tr></thead><tbody id="materialsUsedSummaryBody"></tbody></table></div>' +
        '</div>' +
      '</div>' +
      '<div id="byTaskView" style="display:none">' +
        '<div class="panel full-panel">' +
          '<div class="panel-header"><h3>Materials Used by Task</h3><div style="display:flex;align-items:center;gap:10px"><span class="panel-tag" id="materialsUsedCount"></span><button class="btn btn-outline" id="downloadByTaskBtn" data-download="byTask" style="padding:7px 14px;font-size:12.5px">' + App.svg("download") + ' Download</button></div></div>' +
          '<p class="section-subheading" style="margin:2px 0 14px">Every material recorded as used on a task, drawn straight from stock. Record usage from a task\'s detail view.</p>' +
          '<div class="table-scroll"><table class="data-table"><thead><tr><th>Task</th><th>Status</th><th>Material</th><th>Quantity Used</th></tr></thead><tbody id="materialsUsedTableBody"></tbody></table></div>' +
        '</div>' +
      '</div>';

    var balanceSortState = { field: null, dir: "asc" };
    var txnSortState = { field: null, dir: "asc" };
    var txnPage = 1;
    var TXN_PAGE_SIZE = 10;

    document.getElementById("balanceHeadRow").innerHTML =
      App.sortableTh("Material", "name", balanceSortState) +
      App.sortableTh("Category", "category", balanceSortState) +
      App.sortableTh("Balance", "balance", balanceSortState) +
      App.sortableTh("Reorder Threshold", "reorderThreshold", balanceSortState) +
      '<th>Status</th>';
    App.wireSort(document.getElementById("balanceHeadRow"), balanceSortState, function () { renderBalances(); });

    document.getElementById("txnHeadRow").innerHTML =
      App.sortableTh("Date", "date", txnSortState) +
      '<th>Bill No.</th>' +
      App.sortableTh("Material", "materialName", txnSortState) +
      App.sortableTh("Type", "type", txnSortState) +
      '<th>Source</th>' +
      App.sortableTh("Quantity", "quantity", txnSortState) +
      App.sortableTh("Amount", "totalAmount", txnSortState, "text-right") +
      '<th>Supplier / Notes</th>' +
      ((canDelete || canUpdate) ? '<th></th>' : '');
    App.wireSort(document.getElementById("txnHeadRow"), txnSortState, function () { txnPage = 1; renderTxns(); });

    if (document.getElementById("sDate")) document.getElementById("sDate").value = Data.isoDate(Data.today());

    function syncSourceFields() {
      var isInward = document.getElementById("sType").value === "inward";
      var isTransfer = isInward && document.getElementById("sSource").value === "transfer";
      document.getElementById("sSourceWrap").style.display = isInward ? "" : "none";
      document.getElementById("sSupplierWrap").style.display = isInward && !isTransfer ? "" : "none";
      document.getElementById("sBillNoWrap").style.display = isInward && !isTransfer ? "" : "none";
      document.getElementById("sGstWrap").style.display = isInward && !isTransfer ? "" : "none";
      document.getElementById("sSourceProjectWrap").style.display = isTransfer ? "" : "none";
    }
    var sTypeEl = document.getElementById("sType");
    if (sTypeEl) sTypeEl.addEventListener("change", syncSourceFields);
    var sSourceEl = document.getElementById("sSource");
    if (sSourceEl) sSourceEl.addEventListener("change", syncSourceFields);
    syncSourceFields();

    function renderStats() {
      var balances = Business.getAllStockBalances(projectId).filter(function (r) { return r.hasActivity; });
      var lowCount = balances.filter(function (r) { return r.isLowStock; }).length;
      var totalPurchased = Data.getStockTransactions().filter(function (t) { return t.projectId === projectId && t.type === "inward"; }).reduce(function (s, t) { return s + t.totalAmount; }, 0);
      document.getElementById("statGrid").innerHTML =
        '<div class="stat-card"><div class="stat-icon icon-amber">' + App.svg("box") + '</div><div class="stat-value">' + balances.length + '</div><div class="stat-label">Materials in use</div></div>' +
        '<div class="stat-card"><div class="stat-icon icon-pink">' + App.svg("alert") + '</div><div class="stat-value">' + lowCount + '</div><div class="stat-label">Low-stock materials</div></div>' +
        '<div class="stat-card"><div class="stat-icon icon-green">' + App.svg("truck") + '</div><div class="stat-value">₹' + Charts.fmtCompact(totalPurchased) + '</div><div class="stat-label">Total purchased</div></div>';
    }

    function balanceAccessor(r, field) {
      if (field === "name") return r.material.name;
      if (field === "category") return r.material.category;
      if (field === "balance") return r.balance;
      if (field === "reorderThreshold") return r.material.reorderThreshold;
      return r[field];
    }

    function renderBalances() {
      var rows = App.sortRows(Business.getAllStockBalances(projectId), balanceSortState, balanceAccessor);
      document.getElementById("balanceBody").innerHTML = rows.map(function (r) {
        var statusHtml = !r.hasActivity
          ? '<span class="status-pill pending">No activity</span>'
          : r.isLowStock ? '<span class="status-pill at-risk">Low stock</span>' : '<span class="status-pill on-track">Sufficient</span>';
        return '<tr>' +
          '<td><strong>' + r.material.name + '</strong></td>' +
          '<td><span class="chip chip-slate">' + (r.material.category || "—") + '</span></td>' +
          '<td>' + r.balance + ' ' + r.material.unit + '</td>' +
          '<td>' + r.material.reorderThreshold + ' ' + r.material.unit + '</td>' +
          '<td>' + statusHtml + '</td>' +
        '</tr>';
      }).join("");
    }

    function txnAccessor(t, field) {
      if (field === "materialName") { var m = materials.find(function (x) { return x.id === t.materialId; }); return m ? m.name : ""; }
      return t[field];
    }

    function renderTxns() {
      var allTxns = Data.getStockTransactions().filter(function (t) { return t.projectId === projectId; });
      var txns = App.sortRows(allTxns, txnSortState.field ? txnSortState : { field: "date", dir: "desc" }, txnAccessor);
      document.getElementById("txnCount").textContent = txns.length + " entries";
      var body = document.getElementById("txnBody");
      var foot = document.getElementById("txnFoot");
      var hasTxnActionsCol = canDelete || canUpdate;
      if (!txns.length) {
        body.innerHTML = '<tr><td colspan="' + (hasTxnActionsCol ? 9 : 8) + '"><div class="empty-state compact">' + App.svg("truck") + '<p>No stock movements recorded yet.</p></div></td></tr>';
        foot.innerHTML = "";
        document.getElementById("txnPager").innerHTML = "";
        return;
      }
      var billingTotal = allTxns.filter(function (t) { return t.type === "inward"; }).reduce(function (s, t) { return s + t.totalAmount; }, 0);
      foot.innerHTML = '<tr class="table-total-row"><td colspan="6">Total billing for ' + project.name + '</td><td class="total-amount text-right">₹' + billingTotal.toLocaleString("en-IN") + '</td><td colspan="' + (hasTxnActionsCol ? 2 : 1) + '"></td></tr>';
      var pg = App.paginate(txns, txnPage, TXN_PAGE_SIZE);
      txnPage = pg.page;
      body.innerHTML = pg.pageItems.map(function (t) {
        var mat = materials.find(function (m) { return m.id === t.materialId; });
        var typeChip = t.type === "inward" ? '<span class="chip chip-green">Inward</span>' : t.type === "outward" ? '<span class="chip chip-amber">Outward</span>' : '<span class="chip chip-slate">Adjustment</span>';
        var sourceHtml = "—";
        if (t.type === "inward") {
          if (t.source === "transfer") {
            var srcProj = Data.getProjects().find(function (p) { return p.id === t.sourceProjectId; });
            sourceHtml = '<span class="chip chip-blue">From ' + (srcProj ? srcProj.name : "another project") + '</span>';
          } else if (t.source === "godown") {
            sourceHtml = '<span class="chip chip-slate">Godown</span>';
          } else {
            sourceHtml = '<span class="chip chip-slate">Vendor</span>';
          }
        }
        var amountHtml = '₹' + t.totalAmount + (t.gstAmount ? '<br><span class="desc-cell">incl. GST ' + t.gstPercent + '% (₹' + t.gstAmount + ')</span>' : "");
        return '<tr>' +
          '<td>' + Data.displayDate(t.date) + '</td>' +
          '<td>' + (t.invoiceNumber || "—") + '</td>' +
          '<td>' + (mat ? mat.name : "—") + '</td>' +
          '<td>' + typeChip + '</td>' +
          '<td>' + sourceHtml + '</td>' +
          '<td>' + t.quantity + ' ' + (mat ? mat.unit : "") + '</td>' +
          '<td class="total-amount text-right">' + amountHtml + '</td>' +
          '<td><span class="desc-cell">' + (t.supplierName || t.notes || "—") + '</span></td>' +
          (hasTxnActionsCol ? '<td><div class="row-actions">' +
            '<button class="action-trigger" data-menu-toggle="' + t.id + '">' + App.svg("dots") + '</button>' +
            '<div class="action-menu" data-menu="' + t.id + '">' +
              (canUpdate ? '<button data-edit-txn="' + t.id + '">' + App.svg("edit") + ' Edit</button>' : '') +
              (canDelete ? '<button class="danger" data-del="' + t.id + '">' + App.svg("trash") + ' Delete</button>' : '') +
            '</div>' +
          '</div></td>' : '') +
        '</tr>';
      }).join("");

      App.renderPager(document.getElementById("txnPager"), txnPage, pg.totalPages, function (newPage) { txnPage = newPage; renderTxns(); });
    }

    function statusColumns() { return Business.getProjectStatusColumns(projectId); }
    function statusMeta(key) { return statusColumns().find(function (s) { return s.key === key; }) || { key: key, label: key }; }
    function statusPillClass(key) { return key === "done" ? "delivered" : key === "todo" ? "pending" : "confirmed"; }

    /* Rolls up every task's materialsUsed lines into a per-material total (quantity used +
       how many tasks it was used on) so usage across the whole project is visible at a glance,
       alongside the task-by-task breakdown below it. Moved here from the Tasks page so
       material consumption sits next to the stock ledger it's drawn from. */
    function renderMaterialsUsedSummary(rows) {
      var summaryBody = document.getElementById("materialsUsedSummaryBody");
      if (!summaryBody) return;
      if (!rows.length) {
        summaryBody.innerHTML = '<tr><td colspan="4"><div class="empty-state compact">' + App.svg("box") + "<p>No material usage recorded yet.</p></div></td></tr>";
        document.getElementById("materialsUsedTotalCount").textContent = "0 materials";
        return;
      }
      var totals = {};
      rows.forEach(function (r) {
        var t = totals[r.line.materialId] || (totals[r.line.materialId] = { qty: 0, taskIds: {} });
        t.qty += r.line.qty;
        t.taskIds[r.task.id] = true;
      });
      var materialIds = Object.keys(totals);
      document.getElementById("materialsUsedTotalCount").textContent = materialIds.length + " material" + (materialIds.length === 1 ? "" : "s");
      summaryBody.innerHTML = materialIds.map(function (materialId) {
        var m = materials.find(function (x) { return x.id === materialId; });
        var t = totals[materialId];
        var taskCount = Object.keys(t.taskIds).length;
        var balance = Business.getStockBalance(projectId, materialId).balance;
        return '<tr>' +
          '<td><strong>' + (m ? m.name : "—") + '</strong></td>' +
          '<td>' + t.qty + ' ' + (m ? m.unit : "") + '</td>' +
          '<td>' + taskCount + ' task' + (taskCount === 1 ? "" : "s") + '</td>' +
          '<td>' + balance + ' ' + (m ? m.unit : "") + '</td>' +
        '</tr>';
      }).join("");
    }

    function renderMaterialsUsedByTask(rows) {
      var body = document.getElementById("materialsUsedTableBody");
      if (!body) return;
      document.getElementById("materialsUsedCount").textContent = rows.length + " entr" + (rows.length === 1 ? "y" : "ies");
      if (!rows.length) {
        body.innerHTML = '<tr><td colspan="4"><div class="empty-state compact">' + App.svg("box") + "<p>No material usage recorded yet.</p></div></td></tr>";
        return;
      }
      body.innerHTML = rows.map(function (r) {
        var m = materials.find(function (x) { return x.id === r.line.materialId; });
        return '<tr>' +
          '<td><a href="#" data-open-task-detail="' + r.task.id + '"><strong>' + r.task.title + '</strong></a></td>' +
          '<td><span class="status-pill ' + statusPillClass(r.task.status) + '">' + statusMeta(r.task.status).label + '</span></td>' +
          '<td>' + (m ? m.name : "—") + '</td>' +
          '<td>' + r.line.qty + ' ' + (m ? m.unit : "") + '</td>' +
        '</tr>';
      }).join("");
    }

    function renderTaskMaterialsUsage() {
      var tasks = Data.getTasks().filter(function (t) { return t.projectId === projectId; });
      var rows = [];
      tasks.forEach(function (t) {
        (t.materialsUsed || []).forEach(function (l) { rows.push({ task: t, line: l }); });
      });
      renderMaterialsUsedSummary(rows);
      renderMaterialsUsedByTask(rows);
    }

    function renderAll() { renderStats(); renderBalances(); renderTxns(); renderTaskMaterialsUsage(); }

    var activeStockView = "balance";
    function setStockView(view) {
      activeStockView = view;
      document.getElementById("balanceView").style.display = view === "balance" ? "" : "none";
      document.getElementById("transactionsView").style.display = view === "transactions" ? "" : "none";
      document.getElementById("materialsView").style.display = view === "materials" ? "" : "none";
      document.getElementById("byTaskView").style.display = view === "byTask" ? "" : "none";
      document.querySelectorAll("#stockViewToggle .view-toggle-btn").forEach(function (b) {
        b.classList.toggle("active", b.getAttribute("data-view") === view);
      });
    }
    document.getElementById("stockViewToggle").addEventListener("click", function (e) {
      var btn = e.target.closest("[data-view]");
      if (btn) setStockView(btn.getAttribute("data-view"));
    });
    setStockView("balance");

    var stockFormEl = document.getElementById("stockForm");
    if (stockFormEl) stockFormEl.addEventListener("submit", function (e) {
      e.preventDefault();
      var qty = Number(document.getElementById("sQty").value);
      if (!qty) { App.showToast("Enter a quantity", true); return; }
      var rate = Number(document.getElementById("sRate").value) || 0;
      var type = document.getElementById("sType").value;
      var materialId = document.getElementById("sMaterial").value;
      var date = document.getElementById("sDate").value;
      var sourceVal = document.getElementById("sSource").value;
      var isTransfer = type === "inward" && sourceVal === "transfer";
      var isFromGodown = type === "inward" && sourceVal === "godown";

      if (isFromGodown) {
        var godownBalance = Business.getStockBalance(Data.GODOWN_ID, materialId).balance;
        if (qty > godownBalance) { App.showToast("Godown only has " + godownBalance + " in stock for this material", true); return; }
        var gTransferId = Data.uid("tr");
        var gTxns = Data.getStockTransactions();
        gTxns.push({
          id: Data.uid("st"), projectId: projectId, materialId: materialId, type: "inward",
          quantity: qty, ratePerUnit: rate, totalAmount: Math.round(qty * rate), date: date,
          supplierName: "", invoiceNumber: "", gstPercent: 0, gstAmount: 0, notes: "Received from Godown",
          source: "godown", sourceProjectId: Data.GODOWN_ID, transferId: gTransferId
        });
        gTxns.push({
          id: Data.uid("st"), projectId: Data.GODOWN_ID, materialId: materialId, type: "outward",
          quantity: qty, ratePerUnit: rate, totalAmount: Math.round(qty * rate), date: date,
          supplierName: "", invoiceNumber: "", gstPercent: 0, gstAmount: 0, notes: "Issued to " + project.name,
          source: "godown", sourceProjectId: projectId, transferId: gTransferId
        });
        Data.saveStockTransactions(gTxns);
        App.showToast("Stock received from godown");
      } else if (isTransfer) {
        var sourceProjectId = document.getElementById("sSourceProject").value;
        if (!sourceProjectId) { App.showToast("Choose the project to transfer from", true); return; }
        var sourceProjectName = otherProjects.find(function (p) { return p.id === sourceProjectId; }).name;
        var transferId = Data.uid("tr");
        var txns = Data.getStockTransactions();
        txns.push({
          id: Data.uid("st"), projectId: projectId, materialId: materialId, type: "inward",
          quantity: qty, ratePerUnit: rate, totalAmount: Math.round(qty * rate), date: date,
          supplierName: "", invoiceNumber: "", gstPercent: 0, gstAmount: 0, notes: "Transferred from " + sourceProjectName,
          source: "transfer", sourceProjectId: sourceProjectId, transferId: transferId
        });
        txns.push({
          id: Data.uid("st"), projectId: sourceProjectId, materialId: materialId, type: "outward",
          quantity: qty, ratePerUnit: rate, totalAmount: Math.round(qty * rate), date: date,
          supplierName: "", invoiceNumber: "", gstPercent: 0, gstAmount: 0, notes: "Transferred to " + project.name,
          source: "transfer", sourceProjectId: projectId, transferId: transferId
        });
        Data.saveStockTransactions(txns);
        App.showToast("Stock transfer recorded");
      } else {
        var subtotal = Math.round(qty * rate);
        var gstPercent = type === "inward" ? (Number(document.getElementById("sGst").value) || 0) : 0;
        var gstAmount = Math.round(subtotal * gstPercent / 100);
        var txns2 = Data.getStockTransactions();
        txns2.push({
          id: Data.uid("st"), projectId: projectId, materialId: materialId,
          type: type, quantity: qty, ratePerUnit: rate, totalAmount: subtotal + gstAmount,
          date: date,
          supplierName: type === "inward" ? document.getElementById("sSupplier").value.trim() : "",
          invoiceNumber: type === "inward" ? document.getElementById("sBillNo").value.trim() : "",
          gstPercent: gstPercent, gstAmount: gstAmount, notes: "",
          source: type === "inward" ? document.getElementById("sSource").value : ""
        });
        Data.saveStockTransactions(txns2);
        App.showToast("Stock entry added");
      }

      document.getElementById("stockForm").reset();
      document.getElementById("sDate").value = Data.isoDate(Data.today());
      syncSourceFields();
      renderAll();
    });

    var openMenuId = null;
    document.addEventListener("click", function (e) {
      var toggle = e.target.closest("[data-menu-toggle]");
      document.querySelectorAll(".action-menu.show").forEach(function (m) { m.classList.remove("show"); });
      if (toggle) {
        var menuId = toggle.getAttribute("data-menu-toggle");
        openMenuId = menuId;
        App.positionActionMenu(menuId);
        document.querySelector('[data-menu="' + menuId + '"]').classList.add("show");
        return;
      }
      var editBtn = e.target.closest("[data-edit-txn]");
      if (editBtn) {
        var txn = Data.getStockTransactions().find(function (t) { return t.id === editBtn.getAttribute("data-edit-txn"); });
        if (txn) openEditTxnModal(txn);
        return;
      }
      var delBtn = e.target.closest("[data-del]");
      if (delBtn) {
        Data.saveStockTransactions(Data.getStockTransactions().filter(function (t) { return t.id !== delBtn.getAttribute("data-del"); }));
        App.showToast("Entry removed");
        renderAll();
      }
    });
    window.addEventListener("scroll", function () { if (openMenuId) App.positionActionMenu(openMenuId); }, true);

    /* Edit is intentionally limited to quantity/rate/date (and supplier/bill/GST for a plain
       vendor purchase) — never material, type, or source, since re-pointing those could corrupt
       the stock balance math in ways a simple form can't safely reconcile. A transfer or
       godown-received entry is one half of a linked pair (same transferId, mirrored on the other
       project/godown); editing it updates both sides together so the ledger stays balanced. */
    var editTxnModal = document.getElementById("editTxnModal");
    var editTxnId = null;
    function recalcEtAmount() {
      var qty = Number(document.getElementById("etQty").value) || 0;
      var rate = Number(document.getElementById("etRate").value) || 0;
      var gst = document.getElementById("etGstWrap").style.display === "none" ? 0 : (Number(document.getElementById("etGst").value) || 0);
      var subtotal = qty * rate;
      var gstAmount = Math.round(subtotal * gst / 100);
      document.getElementById("etAmountPreview").textContent = "Amount: ₹" + Math.round(subtotal + gstAmount);
    }
    function openEditTxnModal(t) {
      editTxnId = t.id;
      var mat = materials.find(function (m) { return m.id === t.materialId; });
      var typeLabel = t.type === "inward" ? "Inward" : t.type === "outward" ? "Outward" : "Adjustment";
      document.getElementById("editTxnSubtitle").textContent = (mat ? mat.name : "Material") + " — " + typeLabel +
        (t.transferId ? " (linked movement — both sides will be kept in sync)" : "");
      document.getElementById("etQty").value = t.quantity;
      document.getElementById("etRate").value = t.ratePerUnit || 0;
      document.getElementById("etDate").value = t.date;
      var isVendorPurchase = t.type === "inward" && t.source !== "transfer" && t.source !== "godown";
      document.getElementById("etSupplierWrap").style.display = isVendorPurchase ? "" : "none";
      document.getElementById("etBillNoWrap").style.display = isVendorPurchase ? "" : "none";
      document.getElementById("etGstWrap").style.display = isVendorPurchase ? "" : "none";
      document.getElementById("etSupplier").value = t.supplierName || "";
      document.getElementById("etBillNo").value = t.invoiceNumber || "";
      document.getElementById("etGst").value = t.gstPercent || 0;
      recalcEtAmount();
      editTxnModal.classList.add("show");
    }
    document.getElementById("etQty").addEventListener("input", recalcEtAmount);
    document.getElementById("etRate").addEventListener("input", recalcEtAmount);
    document.getElementById("etGst").addEventListener("input", recalcEtAmount);
    document.getElementById("closeEditTxnModal").addEventListener("click", function () { editTxnModal.classList.remove("show"); editTxnId = null; });
    document.getElementById("cancelEditTxnModal").addEventListener("click", function () { editTxnModal.classList.remove("show"); editTxnId = null; });
    editTxnModal.addEventListener("click", function (e) { if (e.target === editTxnModal) { editTxnModal.classList.remove("show"); editTxnId = null; } });

    document.getElementById("saveEditTxnBtn").addEventListener("click", function () {
      if (!editTxnId) return;
      var qty = Number(document.getElementById("etQty").value);
      if (!qty) { App.showToast("Enter a quantity", true); return; }
      var rate = Number(document.getElementById("etRate").value) || 0;
      var date = document.getElementById("etDate").value;
      var txns = Data.getStockTransactions();
      var original = txns.find(function (t) { return t.id === editTxnId; });
      if (!original) return;
      var isVendorPurchase = original.type === "inward" && original.source !== "transfer" && original.source !== "godown";
      var gstPercent = isVendorPurchase ? (Number(document.getElementById("etGst").value) || 0) : 0;
      var subtotal = Math.round(qty * rate);
      var gstAmount = Math.round(subtotal * gstPercent / 100);
      var totalAmount = subtotal + gstAmount;
      var supplierName = isVendorPurchase ? document.getElementById("etSupplier").value.trim() : original.supplierName;
      var invoiceNumber = isVendorPurchase ? document.getElementById("etBillNo").value.trim() : original.invoiceNumber;

      txns = txns.map(function (t) {
        if (t.id !== editTxnId && !(original.transferId && t.transferId === original.transferId)) return t;
        var isThisOne = t.id === editTxnId;
        return Object.assign({}, t, {
          quantity: qty, ratePerUnit: rate, totalAmount: totalAmount, date: date,
          gstPercent: isThisOne ? gstPercent : t.gstPercent,
          gstAmount: isThisOne ? gstAmount : t.gstAmount,
          supplierName: isThisOne ? supplierName : t.supplierName,
          invoiceNumber: isThisOne ? invoiceNumber : t.invoiceNumber
        });
      });
      Data.saveStockTransactions(txns);
      App.showToast("Transaction updated" + (original.transferId ? " — both sides synced" : ""));
      editTxnModal.classList.remove("show");
      editTxnId = null;
      renderAll();
    });

    document.getElementById("materialsUsedTableBody").addEventListener("click", function (e) {
      var openDetail = e.target.closest("[data-open-task-detail]");
      if (!openDetail) return;
      e.preventDefault();
      window.location.href = "project-task-detail.html?id=" + projectId + "&task=" + openDetail.getAttribute("data-open-task-detail");
    });

    /* One shared download modal serves every table on this page (Stock Balance, Transaction
       History, Materials Used, Materials by Task) — the button that opened it (data-download)
       decides the modal title and which table's data the export/toast refers to. */
    var downloadModal = document.getElementById("downloadModal");
    var downloadLabels = { balance: "Stock Balance", transactions: "Transaction History", materials: "Total Materials Used", byTask: "Materials Used by Task" };
    var downloadContext = "transactions";
    document.getElementById("pageBody").addEventListener("click", function (e) {
      var btn = e.target.closest("[data-download]");
      if (!btn) return;
      downloadContext = btn.getAttribute("data-download");
      document.getElementById("downloadModalTitle").textContent = "Download " + downloadLabels[downloadContext];
      document.getElementById("dlFrom").value = "";
      document.getElementById("dlTo").value = Data.isoDate(Data.today());
      document.getElementById("dlFormat").value = "pdf";
      document.querySelectorAll("#dlFormatToggle .format-toggle-btn").forEach(function (b) { b.classList.toggle("active", b.getAttribute("data-format") === "pdf"); });
      downloadModal.classList.add("show");
    });
    document.getElementById("dlFormatToggle").addEventListener("click", function (e) {
      var btn = e.target.closest("[data-format]");
      if (!btn) return;
      document.querySelectorAll("#dlFormatToggle .format-toggle-btn").forEach(function (b) { b.classList.remove("active"); });
      btn.classList.add("active");
      document.getElementById("dlFormat").value = btn.getAttribute("data-format");
    });
    document.getElementById("closeDownloadModal").addEventListener("click", function () { downloadModal.classList.remove("show"); });
    document.getElementById("cancelDownloadModal").addEventListener("click", function () { downloadModal.classList.remove("show"); });
    downloadModal.addEventListener("click", function (e) { if (e.target === downloadModal) downloadModal.classList.remove("show"); });
    document.getElementById("confirmDownloadBtn").addEventListener("click", function () {
      var format = document.getElementById("dlFormat").value.toUpperCase();
      var from = document.getElementById("dlFrom").value;
      var to = document.getElementById("dlTo").value;
      var rangeText = (from || to) ? " for " + (from ? Data.displayDate(from) : "the start") + " – " + (to ? Data.displayDate(to) : "today") : "";
      downloadModal.classList.remove("show");
      App.showToast("Your " + format + " file (" + downloadLabels[downloadContext] + ")" + rangeText + " is downloading...");
    });

    renderAll();
  }
</script>
</body>
</html>
