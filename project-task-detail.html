<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task Detail</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div class="app-shell">
  <div class="sidebar-backdrop"></div>
  <aside class="sidebar" id="sidebar"></aside>

  <div class="main">
    <header class="topbar" id="topbar"></header>

    <main class="content">
      <div class="page-header-row">
        <div><h2 id="taskTitleHeading">Loading…</h2><p id="taskMeta"></p></div>
        <a class="btn btn-outline" id="backLink">&larr; Back to Board</a>
      </div>

      <div id="tabsMount"></div>
      <div id="timelineStrip" class="timeline-strip"></div>
      <div id="pageBody"></div>
    </main>
  </div>
</div>

<div class="modal-overlay" id="completeTaskModal">
  <div class="modal-box">
    <div class="modal-header">
      <div><h3 id="completeTaskModalTitle">Complete Task</h3><p id="completeTaskModalSubtitle">Capture a few closing details before marking this task done.</p></div>
      <button class="modal-close" id="closeCompleteTaskModal">&times;</button>
    </div>
    <div class="modal-body">
      <form id="completeTaskForm">
        <div class="field-grid">
          <div class="field"><label>Area (sqft)</label><input type="number" id="ctSqft" min="0"></div>
          <div class="field"><label>Rate per unit (₹/sqft)</label><input type="number" id="ctRate" min="0"></div>
          <div class="field"><label>Cost (₹) — auto</label><input type="number" id="ctCost" min="0" disabled></div>
          <div class="field"><label>No. of Persons</label><input type="number" id="ctPersons" min="0"></div>
          <div class="field"><label>Person in Charge</label><input type="text" id="ctInCharge"></div>
          <div class="field"><label>Duration (days)</label><input type="number" id="ctDuration" min="0"></div>
          <div class="field full"><span class="field-hint">Material used is tracked from the Materials Used section below, drawn straight from stock.</span></div>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" id="cancelCompleteTaskModal">Cancel</button>
      <button class="btn btn-primary" id="saveCompleteTaskBtn">Mark Complete</button>
    </div>
  </div>
</div>

<div class="modal-overlay modal-overlay-stacked" id="subtaskCompleteModal">
  <div class="modal-box">
    <div class="modal-header">
      <div><h3>Complete Subtask</h3><p id="subtaskCompleteName"></p></div>
      <button class="modal-close" id="closeSubtaskCompleteModal">&times;</button>
    </div>
    <div class="modal-body">
      <form id="subtaskCompleteForm">
        <div class="field-grid">
          <div class="field"><label>Area (sqft)</label><input type="number" id="scArea" min="0"></div>
          <div class="field"><label>Rate per unit (₹/sqft)</label><input type="number" id="scRate" min="0"></div>
          <div class="field full"><label>Cost (₹) — auto</label><input type="number" id="scCost" min="0" disabled></div>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" id="cancelSubtaskCompleteModal">Cancel</button>
      <button class="btn btn-primary" id="saveSubtaskCompleteBtn">Mark Complete</button>
    </div>
  </div>
</div>

<script src="assets/data.js"></script>
<script src="assets/business.js"></script>
<script src="assets/app.js"></script>
<script src="assets/charts.js"></script>
<script>
  App.requireAuth();
  var projectId = new URLSearchParams(window.location.search).get("id");
  var taskId = new URLSearchParams(window.location.search).get("task");
  var project = Data.getProjects().find(function (p) { return p.id === projectId; });
  App.renderShell({ active: "projects", title: project ? project.name : "Project", subtitle: "Task detail" });

  function statusPillClass(key) { return key === "done" ? "delivered" : key === "todo" ? "pending" : "confirmed"; }

  document.getElementById("backLink").href = "project-tasks.html?id=" + projectId;

  if (!project || !App.guardProjectAccess(projectId)) {
    document.getElementById("taskTitleHeading").textContent = project ? "Access restricted" : "Project not found";
  } else {
    document.getElementById("tabsMount").innerHTML = App.projectTabsHtml(projectId, "tasks");
    var canUpdate = App.can("progress", "update");
    var canDelete = App.can("progress", "delete");

    var task = Data.getTasks().find(function (t) { return t.id === taskId && t.projectId === projectId; });

    function statusColumns() { return Business.getProjectStatusColumns(projectId); }
    function statusMeta(key) { return statusColumns().find(function (s) { return s.key === key; }) || { key: key, label: key }; }

    function creatorName(userId) {
      var u = Data.getUsers().find(function (x) { return x.id === userId; });
      return u ? u.name : "—";
    }

    /* Keeps Estimated Completion date and planned Duration (days) in sync —
       editing either one recalculates the other from the task's created date. */
    function isoAddDays(iso, days) {
      var d = new Date(iso + "T00:00:00");
      d.setDate(d.getDate() + days);
      return Data.isoDate(d);
    }
    function isoDaysBetween(isoStart, isoEnd) {
      var a = new Date(isoStart + "T00:00:00");
      var b = new Date(isoEnd + "T00:00:00");
      return Math.round((b - a) / 86400000);
    }

    function renderTimeline() {
      var createdText = task.createdAt ? Data.displayDate(task.createdAt) + " by " + creatorName(task.createdBy) : "—";
      var startText = task.startDate ? Data.displayDate(task.startDate) : "Not set";
      var estimatedText = task.date ? Data.displayDate(task.date) + (task.durationDays ? " (" + task.durationDays + " day" + (task.durationDays === 1 ? "" : "s") + ")" : "") : "Not set";
      var completedText = task.completedAt ? Data.displayDate(task.completedAt) : "Not yet completed";
      document.getElementById("timelineStrip").innerHTML =
        '<div class="timeline-step"><span class="timeline-dot done"></span><div><strong>Created</strong><span>' + createdText + '</span></div></div>' +
        '<div class="timeline-connector"></div>' +
        '<div class="timeline-step"><span class="timeline-dot ' + (task.startDate ? "done" : "pending") + '"></span><div><strong>Start</strong><span>' + startText + '</span></div></div>' +
        '<div class="timeline-connector"></div>' +
        '<div class="timeline-step"><span class="timeline-dot ' + (task.date ? "done" : "pending") + '"></span><div><strong>Estimated Completion</strong><span>' + estimatedText + '</span></div></div>' +
        '<div class="timeline-connector"></div>' +
        '<div class="timeline-step"><span class="timeline-dot ' + (task.completedAt ? "done" : "pending") + '"></span><div><strong>Completed</strong><span>' + completedText + '</span></div></div>';
    }

    function render() {
      document.getElementById("taskTitleHeading").textContent = task.title;
      document.getElementById("taskMeta").textContent = project.name + " · " + project.code;
      renderTimeline();

      document.getElementById("pageBody").innerHTML =
        '<div class="detail-grid">' +
          '<div class="detail-card">' +
            '<div class="detail-card-header"><span class="card-header-icon">' + App.svg("columns") + '</span>Task Details<span class="status-pill ' + statusPillClass(task.status) + '" style="margin-left:auto">' + statusMeta(task.status).label + '</span></div>' +
            '<div style="padding:20px">' +
              '<div class="field-grid">' +
                '<div class="field full"><label>Title</label><input type="text" id="tdTitle"></div>' +
                '<div class="field"><label>Status</label><select id="tdStatus"></select></div>' +
                '<div class="field"><label>Start Date</label><input type="date" id="tdStartDate"></div>' +
                '<div class="field"><label>Estimated Completion</label><input type="date" id="tdDate"></div>' +
                '<div class="field"><label>Duration (days)</label><input type="number" id="tdDuration" min="0" placeholder="e.g. 5"></div>' +
                '<div class="field"><label>Completed On</label><input type="date" id="tdCompletedAt"></div>' +
                '<div class="field full">' +
                  '<label>Assignee</label>' +
                  '<div style="display:flex;gap:8px">' +
                    '<input type="text" id="tdAssignee" placeholder="Labourer / team" style="flex:1">' +
                    (canUpdate ? '<button type="button" class="btn btn-outline" id="assignToMeBtn">Assign to me</button>' : '') +
                  '</div>' +
                '</div>' +
                '<div class="field full"><label>Description / Notes</label><textarea id="tdNotes" rows="5" placeholder="Add details, blockers, or context about this task..."></textarea></div>' +
              '</div>' +
              (task.completedAt ? completionDetailsHtml() : "") +
              (canDelete ?
              '<div style="margin-top:20px;padding-top:20px;border-top:1px solid var(--border)">' +
                '<button type="button" class="btn btn-outline" id="tdDeleteTask" style="color:var(--danger);border-color:var(--danger);width:100%">' + App.svg("trash") + ' Delete Task</button>' +
              '</div>' : '') +
            '</div>' +
          '</div>' +
          '<div class="detail-card">' +
            '<div class="detail-card-header"><span class="card-header-icon">' + App.svg("clock") + '</span>Activity</div>' +
            '<div id="activityFeed" style="padding:18px 20px"></div>' +
            '<div class="panel-footer-row" style="justify-content:flex-end;padding:0 20px 18px" id="activityPager"></div>' +
          '</div>' +
          '<div class="detail-card" style="grid-column:1 / -1">' +
            '<div class="detail-card-header"><span class="card-header-icon">' + App.svg("check") + '</span>Subtasks &amp; Progress</div>' +
            '<div style="padding:20px">' +
              '<div id="taskProgressBar" style="margin-bottom:16px"></div>' +
              '<div class="checklist-box subtask-list" id="subtaskList"></div>' +
              (canUpdate ? '<div class="subtask-add-row"><input type="text" id="newSubtaskInput" placeholder="Add a subtask, then press Enter"><button type="button" class="btn btn-outline" id="addSubtaskBtn">+ Add</button></div>' : '') +
            '</div>' +
          '</div>' +
          '<div class="detail-card" style="grid-column:1 / -1">' +
            '<div class="detail-card-header"><span class="card-header-icon">' + App.svg("box") + '</span>Materials Used<span class="field-hint" style="margin-left:auto">Drawn straight from the project\'s stock</span></div>' +
            '<div style="padding:20px">' +
              '<div class="table-scroll"><table class="data-table"><thead><tr><th>Material</th><th>Quantity Used</th><th>Remaining in Stock</th>' + (canUpdate ? '<th></th>' : '') + '</tr></thead><tbody id="materialsUsedBody"></tbody></table></div>' +
              (canUpdate ?
              '<div class="inline-add-form" style="margin-top:14px">' +
                '<div class="field" style="flex:1.4;min-width:200px"><label>Material</label><select id="muMaterial"></select></div>' +
                '<div class="field"><label>Quantity Used</label><input type="number" id="muQty" min="0" step="0.01"></div>' +
                '<button type="button" class="btn btn-outline" id="addMaterialUsedBtn">+ Record Usage</button>' +
              '</div>' : '') +
            '</div>' +
          '</div>' +
        '</div>';

      var statusSelect = document.getElementById("tdStatus");
      statusSelect.innerHTML = statusColumns().map(function (s) { return '<option value="' + s.key + '">' + s.label + '</option>'; }).join("");
      statusSelect.value = task.status;

      document.getElementById("tdTitle").value = task.title;
      document.getElementById("tdAssignee").value = task.assignee || "";
      document.getElementById("tdStartDate").value = task.startDate || "";
      document.getElementById("tdDate").value = task.date || "";
      document.getElementById("tdDuration").value = task.durationDays || "";
      document.getElementById("tdCompletedAt").value = task.completedAt || "";
      document.getElementById("tdNotes").value = task.notes || "";

      var readOnly = !canUpdate;
      ["tdTitle", "tdStatus", "tdAssignee", "tdStartDate", "tdDate", "tdDuration", "tdCompletedAt", "tdNotes"].forEach(function (id) {
        document.getElementById(id).disabled = readOnly;
      });

      var muMaterialSelect = document.getElementById("muMaterial");
      if (muMaterialSelect) {
        muMaterialSelect.innerHTML = Data.getMaterials().map(function (m) { return '<option value="' + m.id + '">' + m.name + ' (' + m.unit + ')</option>'; }).join("");
      }

      renderActivity();
      renderSubtaskProgress();
      renderSubtaskList();
      renderMaterialsUsed();
      wireEvents();
    }

    function renderMaterialsUsed() {
      var body = document.getElementById("materialsUsedBody");
      if (!body) return;
      var lines = task.materialsUsed || [];
      if (!lines.length) {
        body.innerHTML = '<tr><td colspan="' + (canUpdate ? 4 : 3) + '"><div class="empty-state compact">' + App.svg("box") + '<p>No material usage recorded for this task yet.</p></div></td></tr>';
        return;
      }
      var materials = Data.getMaterials();
      body.innerHTML = lines.map(function (l) {
        var m = materials.find(function (x) { return x.id === l.materialId; });
        var balance = Business.getStockBalance(projectId, l.materialId).balance;
        return '<tr>' +
          '<td><strong>' + (m ? m.name : "—") + '</strong></td>' +
          '<td>' + l.qty + ' ' + (m ? m.unit : "") + '</td>' +
          '<td>' + balance + ' ' + (m ? m.unit : "") + '</td>' +
          (canUpdate ? '<td><button class="action-trigger" data-material-used-del="' + l.id + '">' + App.svg("trash") + '</button></td>' : '') +
        '</tr>';
      }).join("");
    }

    function renderSubtaskProgress() {
      var container = document.getElementById("taskProgressBar");
      if (!container) return;
      var prog = Business.getTaskProgress(task);
      Charts.renderProgressBar(container, prog.percent, {
        metaText: prog.totalCount > 0 ? (prog.doneCount + " of " + prog.totalCount + " subtasks done") : "No subtasks yet — based on task status"
      });
    }

    function renderSubtaskList() {
      var listEl = document.getElementById("subtaskList");
      if (!listEl) return;
      var subtasks = task.subtasks || [];
      if (!subtasks.length) {
        listEl.innerHTML = '<div class="empty-state compact" style="padding:14px 8px"><p>No subtasks yet. Break this task down into smaller steps below.</p></div>';
        return;
      }
      listEl.innerHTML = subtasks.map(function (s) {
        return '<div class="subtask-row">' +
          '<input type="checkbox" data-subtask-toggle="' + s.id + '"' + (s.done ? ' checked' : '') + (canUpdate ? '' : ' disabled') + '>' +
          '<span class="subtask-title' + (s.done ? ' done' : '') + '">' + s.title + '</span>' +
          (canUpdate ? '<button type="button" class="action-trigger" data-subtask-edit="' + s.id + '" title="Edit subtask">' + App.svg("edit") + '</button>' : '') +
          (canUpdate ? '<button type="button" class="action-trigger" data-subtask-del="' + s.id + '" title="Remove subtask">' + App.svg("trash") + '</button>' : '') +
        '</div>';
      }).join("");
    }

    function editSubtaskInline(btn) {
      var id = btn.getAttribute("data-subtask-edit");
      var row = btn.closest(".subtask-row");
      var titleSpan = row.querySelector(".subtask-title");
      var currentTitle = titleSpan.textContent;
      var input = document.createElement("input");
      input.type = "text";
      input.className = "subtask-edit-input";
      input.value = currentTitle;
      titleSpan.replaceWith(input);
      input.focus();
      input.select();

      var committed = false;
      function commit() {
        if (committed) return;
        committed = true;
        var newTitle = input.value.trim();
        if (newTitle && newTitle !== currentTitle) {
          var subtasks = (task.subtasks || []).map(function (s) { return s.id === id ? Object.assign({}, s, { title: newTitle }) : s; });
          saveTaskPatch({ subtasks: subtasks });
          Data.addTaskActivity(taskId, 'Subtask renamed: "' + currentTitle + '" → "' + newTitle + '"');
          renderActivity();
        }
        renderSubtaskList();
      }
      input.addEventListener("keydown", function (e) {
        if (e.key === "Enter") { e.preventDefault(); commit(); }
        else if (e.key === "Escape") { e.preventDefault(); committed = true; renderSubtaskList(); }
      });
      input.addEventListener("blur", commit);
    }

    function addSubtaskFromInput() {
      var input = document.getElementById("newSubtaskInput");
      if (!input) return;
      var title = input.value.trim();
      if (!title) return;
      var subtasks = (task.subtasks || []).concat([{ id: Data.uid("st"), title: title, done: false }]);
      saveTaskPatch({ subtasks: subtasks });
      Data.addTaskActivity(taskId, "Subtask added: " + title);
      input.value = "";
      input.focus();
      renderSubtaskProgress();
      renderSubtaskList();
      renderActivity();
    }

    function materialsUsedSummary(t) {
      var lines = t.materialsUsed || [];
      if (!lines.length) return "";
      var materials = Data.getMaterials();
      return lines.map(function (l) {
        var m = materials.find(function (x) { return x.id === l.materialId; });
        return (m ? m.name : "Material") + " (" + l.qty + (m ? " " + m.unit : "") + ")";
      }).join(", ");
    }

    function completionDetailsHtml() {
      return '<div class="field-group-divider" style="display:flex;justify-content:space-between;align-items:center">Completion Details' +
          (canUpdate ? '<button type="button" class="action-trigger" id="tdEditCompletionBtn" title="Edit completion details">' + App.svg("edit") + '</button>' : '') +
        '</div>' +
        '<div class="view-detail-grid">' +
          '<div class="view-detail-item"><span>Area</span><strong>' + (task.sqft || 0) + ' sqft</strong></div>' +
          '<div class="view-detail-item"><span>Cost</span><strong>₹' + (task.completionCost || 0) + '</strong></div>' +
          '<div class="view-detail-item"><span>No. of Persons</span><strong>' + (task.personsCount || 0) + '</strong></div>' +
          '<div class="view-detail-item"><span>Person in Charge</span><strong>' + (task.personInCharge || "—") + '</strong></div>' +
          '<div class="view-detail-item"><span>Duration</span><strong>' + (task.durationDays || 0) + ' day(s)</strong></div>' +
          '<div class="view-detail-item"><span>Material Used</span><strong>' + (materialsUsedSummary(task) || "—") + '</strong></div>' +
        '</div>';
    }

    var activityPage = 1;
    var ACTIVITY_PAGE_SIZE = 8;

    function renderActivity() {
      var entries = Data.getTaskActivity().filter(function (a) { return a.taskId === taskId; })
        .sort(function (a, b) { return a.date < b.date ? 1 : (a.date > b.date ? -1 : (a.id < b.id ? 1 : -1)); });
      var feedEl = document.getElementById("activityFeed");
      if (!entries.length) {
        feedEl.innerHTML = '<div class="empty-state compact">' + App.svg("clock") + '<p>No activity logged yet.</p></div>';
        document.getElementById("activityPager").innerHTML = "";
        return;
      }
      var pg = App.paginate(entries, activityPage, ACTIVITY_PAGE_SIZE);
      activityPage = pg.page;
      feedEl.innerHTML = '<div class="activity-list">' + pg.pageItems.map(function (a) {
        return '<div class="activity-item"><div class="activity-dot"></div><div><p>' + a.message + '</p><span>' + Data.displayDate(a.date) + '</span></div></div>';
      }).join("") + '</div>';
      App.renderPager(document.getElementById("activityPager"), activityPage, pg.totalPages, function (newPage) { activityPage = newPage; renderActivity(); });
    }

    function saveTaskPatch(patch) {
      var tasks = Data.getTasks();
      var t = tasks.find(function (x) { return x.id === taskId; });
      if (!t) return;
      var wasDone = t.status === "done";
      Object.assign(t, patch);
      Data.saveTasks(tasks);
      task = t;
      if (!wasDone && t.status === "done") { syncCompletionReport(t); syncCompletionExpense(t); }
    }

    /* Mirrors the same auto-report logic used on the board — completing a task
       from its detail page should log a work report exactly like completing it on the board. */
    function syncCompletionReport(t) {
      var reports = Data.getWorkReports();
      var existing = reports.find(function (r) { return r.taskId === t.id && r.source === "task_complete"; });
      var today = Data.isoDate(Data.today());
      if (existing) {
        existing.date = today;
        existing.title = t.title;
        existing.description = "Task completed: " + t.title + (t.assignee ? " (" + t.assignee + ")" : "") + ".";
      } else {
        reports.push({
          id: Data.uid("wr"), projectId: projectId, date: today, title: t.title,
          description: "Task completed: " + t.title + (t.assignee ? " (" + t.assignee + ")" : "") + ".",
          source: "task_complete", taskId: t.id
        });
      }
      Data.saveWorkReports(reports);
    }

    /* Auto-fills the Expenses tab with the material cost captured on task completion,
       so the cost of materials used doesn't need a separate manual expense entry. */
    function syncCompletionExpense(t) {
      var expenses = Data.getExpenses();
      var existing = expenses.find(function (e) { return e.taskId === t.id && e.category === "task_completion"; });
      var cost = t.completionCost || 0;
      if (cost <= 0) {
        if (existing) Data.saveExpenses(expenses.filter(function (e) { return e.id !== existing.id; }));
        return;
      }
      var materialsSummary = materialsUsedSummary(t);
      var desc = "Task completed: " + t.title + (materialsSummary ? " — Materials: " + materialsSummary : "");
      if (existing) {
        existing.amount = cost;
        existing.description = desc;
        existing.date = t.completedAt || Data.isoDate(Data.today());
      } else {
        expenses.push({
          id: Data.uid("ex"), projectId: projectId, category: "task_completion",
          amount: cost, date: t.completedAt || Data.isoDate(Data.today()),
          description: desc, taskId: t.id
        });
      }
      Data.saveExpenses(expenses);
    }

    function wireEvents() {
      if (!canUpdate) return;

      document.getElementById("tdTitle").addEventListener("change", function () {
        saveTaskPatch({ title: this.value.trim() || "Untitled task" });
        document.getElementById("taskTitleHeading").textContent = task.title;
      });
      document.getElementById("tdStatus").addEventListener("change", function () {
        var newStatus = this.value;
        var select = this;
        if (newStatus === "done" && task.status !== "done") {
          openCompleteTaskModal();
          return;
        }
        var oldStatus = task.status;
        saveTaskPatch({ status: newStatus });
        Data.addTaskActivity(taskId, "Status changed from " + statusMeta(oldStatus).label + " to " + statusMeta(newStatus).label);
        render();
        App.showToast("Status updated to " + statusMeta(task.status).label);
      });
      document.getElementById("tdAssignee").addEventListener("change", function () { saveTaskPatch({ assignee: this.value.trim() }); });
      document.getElementById("tdStartDate").addEventListener("change", function () {
        var newStart = this.value || null;
        var patch = { startDate: newStart };
        var anchor = newStart || task.createdAt;
        if (anchor && task.durationDays) patch.date = isoAddDays(anchor, task.durationDays);
        saveTaskPatch(patch);
        renderTimeline();
        document.getElementById("tdDate").value = task.date || "";
      });
      document.getElementById("tdDate").addEventListener("change", function () {
        var newDate = this.value || null;
        var patch = { date: newDate };
        var anchor = task.startDate || task.createdAt;
        if (newDate && anchor) patch.durationDays = Math.max(0, isoDaysBetween(anchor, newDate));
        saveTaskPatch(patch);
        renderTimeline();
        document.getElementById("tdDuration").value = task.durationDays || "";
      });
      document.getElementById("tdDuration").addEventListener("change", function () {
        var days = this.value === "" ? null : Number(this.value);
        var patch = { durationDays: (days !== null && !isNaN(days)) ? days : null };
        var anchor = task.startDate || task.createdAt;
        if (patch.durationDays !== null && anchor) patch.date = isoAddDays(anchor, patch.durationDays);
        saveTaskPatch(patch);
        renderTimeline();
        document.getElementById("tdDate").value = task.date || "";
      });
      document.getElementById("tdCompletedAt").addEventListener("change", function () {
        var newDate = this.value || null;
        if (newDate && task.status !== "done") { openCompleteTaskModal(newDate); return; }
        saveTaskPatch({ completedAt: newDate });
        renderTimeline();
      });
      document.getElementById("tdNotes").addEventListener("change", function () { saveTaskPatch({ notes: this.value }); });

      var assignBtn = document.getElementById("assignToMeBtn");
      if (assignBtn) assignBtn.addEventListener("click", function () {
        var me = App.getCurrentUser();
        if (!me) return;
        document.getElementById("tdAssignee").value = me.name;
        saveTaskPatch({ assignee: me.name });
        App.showToast("Assigned to you");
      });

      var deleteBtn = document.getElementById("tdDeleteTask");
      if (deleteBtn) deleteBtn.addEventListener("click", function () {
        if (!confirm("Delete this task?")) return;
        Data.saveTasks(Data.getTasks().filter(function (t) { return t.id !== taskId; }));
        App.showToast("Task removed");
        window.location.href = "project-tasks.html?id=" + projectId;
      });

      var editCompletionBtn = document.getElementById("tdEditCompletionBtn");
      if (editCompletionBtn) editCompletionBtn.addEventListener("click", function () { openCompleteTaskModal(task.completedAt); });

      var subtaskListEl = document.getElementById("subtaskList");
      if (subtaskListEl) {
        subtaskListEl.addEventListener("change", function (e) {
          var cb = e.target.closest("[data-subtask-toggle]");
          if (!cb) return;
          var id = cb.getAttribute("data-subtask-toggle");
          var st = (task.subtasks || []).find(function (s) { return s.id === id; });
          if (!st) return;
          if (cb.checked) {
            openSubtaskCompleteModal(st, cb);
            return;
          }
          var subtasks = (task.subtasks || []).map(function (s) { return s.id === id ? Object.assign({}, s, { done: false }) : s; });
          saveTaskPatch({ subtasks: subtasks });
          Data.addTaskActivity(taskId, "Subtask reopened: " + st.title);
          renderSubtaskProgress();
          renderSubtaskList();
          renderActivity();
        });
        subtaskListEl.addEventListener("click", function (e) {
          var editBtn = e.target.closest("[data-subtask-edit]");
          if (editBtn) { editSubtaskInline(editBtn); return; }
          var btn = e.target.closest("[data-subtask-del]");
          if (!btn) return;
          var id = btn.getAttribute("data-subtask-del");
          var removed = (task.subtasks || []).find(function (s) { return s.id === id; });
          var subtasks = (task.subtasks || []).filter(function (s) { return s.id !== id; });
          saveTaskPatch({ subtasks: subtasks });
          if (removed) Data.addTaskActivity(taskId, "Subtask removed: " + removed.title);
          renderSubtaskProgress();
          renderSubtaskList();
          renderActivity();
        });
      }
      var addSubtaskBtn = document.getElementById("addSubtaskBtn");
      if (addSubtaskBtn) addSubtaskBtn.addEventListener("click", addSubtaskFromInput);
      var newSubtaskInputEl = document.getElementById("newSubtaskInput");
      if (newSubtaskInputEl) newSubtaskInputEl.addEventListener("keydown", function (e) {
        if (e.key === "Enter") { e.preventDefault(); addSubtaskFromInput(); }
      });

      var addMuBtn = document.getElementById("addMaterialUsedBtn");
      if (addMuBtn) addMuBtn.addEventListener("click", function () {
        var materialId = document.getElementById("muMaterial").value;
        var qty = Number(document.getElementById("muQty").value);
        if (!materialId || !qty) { App.showToast("Choose a material and enter a quantity", true); return; }
        var mat = Data.getMaterials().find(function (m) { return m.id === materialId; });
        var balance = Business.getStockBalance(projectId, materialId).balance;
        if (qty > balance) { App.showToast("Only " + balance + " " + (mat ? mat.unit : "") + " available in stock", true); return; }
        var txnId = Data.uid("st");
        var txns = Data.getStockTransactions();
        txns.push({
          id: txnId, projectId: projectId, materialId: materialId, type: "outward",
          quantity: qty, ratePerUnit: 0, totalAmount: 0, date: Data.isoDate(Data.today()),
          supplierName: "", invoiceNumber: "", gstPercent: 0, gstAmount: 0,
          notes: "Used for task: " + task.title, source: "task_usage", taskId: taskId
        });
        Data.saveStockTransactions(txns);
        var materialsUsed = (task.materialsUsed || []).concat([{ id: txnId, materialId: materialId, qty: qty }]);
        saveTaskPatch({ materialsUsed: materialsUsed });
        Data.addTaskActivity(taskId, "Recorded material usage: " + qty + " " + (mat ? mat.unit : "") + " of " + (mat ? mat.name : "material"));
        document.getElementById("muQty").value = "";
        renderMaterialsUsed();
        renderActivity();
      });
      var materialsUsedBodyEl = document.getElementById("materialsUsedBody");
      if (materialsUsedBodyEl) materialsUsedBodyEl.addEventListener("click", function (e) {
        var btn = e.target.closest("[data-material-used-del]");
        if (!btn) return;
        var id = btn.getAttribute("data-material-used-del");
        Data.saveStockTransactions(Data.getStockTransactions().filter(function (t) { return t.id !== id; }));
        var materialsUsed = (task.materialsUsed || []).filter(function (l) { return l.id !== id; });
        saveTaskPatch({ materialsUsed: materialsUsed });
        App.showToast("Usage removed — stock restored");
        renderMaterialsUsed();
        renderActivity();
      });
    }

    function subtaskCostTotals(t) {
      var done = (t.subtasks || []).filter(function (s) { return s.done; });
      return {
        count: done.length,
        area: done.reduce(function (s, x) { return s + (x.area || 0); }, 0),
        cost: done.reduce(function (s, x) { return s + (x.cost || 0); }, 0)
      };
    }

    var subtaskCompleteModal = document.getElementById("subtaskCompleteModal");
    var pendingSubtaskCompleteId = null;
    var pendingSubtaskCheckbox = null;
    function recalcScCost() {
      var area = Number(document.getElementById("scArea").value) || 0;
      var rate = Number(document.getElementById("scRate").value) || 0;
      document.getElementById("scCost").value = area && rate ? Math.round(area * rate) : "";
    }
    function openSubtaskCompleteModal(subtask, checkboxEl) {
      pendingSubtaskCompleteId = subtask.id;
      pendingSubtaskCheckbox = checkboxEl;
      document.getElementById("subtaskCompleteName").textContent = subtask.title;
      document.getElementById("subtaskCompleteForm").reset();
      document.getElementById("scArea").value = subtask.area || "";
      document.getElementById("scRate").value = subtask.ratePerUnit || "";
      document.getElementById("scCost").value = subtask.cost || "";
      subtaskCompleteModal.classList.add("show");
    }
    function closeSubtaskCompleteModal(revertCheckbox) {
      if (revertCheckbox && pendingSubtaskCheckbox) pendingSubtaskCheckbox.checked = false;
      pendingSubtaskCompleteId = null;
      pendingSubtaskCheckbox = null;
      subtaskCompleteModal.classList.remove("show");
    }
    document.getElementById("scArea").addEventListener("input", recalcScCost);
    document.getElementById("scRate").addEventListener("input", recalcScCost);
    document.getElementById("closeSubtaskCompleteModal").addEventListener("click", function () { closeSubtaskCompleteModal(true); });
    document.getElementById("cancelSubtaskCompleteModal").addEventListener("click", function () { closeSubtaskCompleteModal(true); });
    subtaskCompleteModal.addEventListener("click", function (e) { if (e.target === subtaskCompleteModal) closeSubtaskCompleteModal(true); });
    document.getElementById("saveSubtaskCompleteBtn").addEventListener("click", function () {
      if (!pendingSubtaskCompleteId) return;
      var id = pendingSubtaskCompleteId;
      var area = Number(document.getElementById("scArea").value) || 0;
      var rate = Number(document.getElementById("scRate").value) || 0;
      var cost = area && rate ? Math.round(area * rate) : 0;
      var subtasks = (task.subtasks || []).map(function (s) {
        return s.id === id ? Object.assign({}, s, { done: true, area: area || null, ratePerUnit: rate || null, cost: cost || null }) : s;
      });
      saveTaskPatch({ subtasks: subtasks });
      var st = subtasks.find(function (s) { return s.id === id; });
      Data.addTaskActivity(taskId, "Subtask completed: " + st.title + (cost ? " (₹" + cost.toLocaleString("en-IN") + ")" : ""));
      subtaskCompleteModal.classList.remove("show");
      pendingSubtaskCompleteId = null;
      pendingSubtaskCheckbox = null;
      renderSubtaskProgress();
      renderSubtaskList();
      renderActivity();
      var allDone = subtasks.length > 0 && subtasks.every(function (s) { return s.done; });
      if (allDone && task.status !== "done") openCompleteTaskModal();
    });

    var completeTaskModal = document.getElementById("completeTaskModal");
    var pendingCompleteDate = null;
    function recalcCtCost() {
      var sqft = Number(document.getElementById("ctSqft").value) || 0;
      var rate = Number(document.getElementById("ctRate").value) || 0;
      document.getElementById("ctCost").value = sqft && rate ? Math.round(sqft * rate) : "";
    }
    function openCompleteTaskModal(presetDate) {
      pendingCompleteDate = presetDate || null;
      document.getElementById("completeTaskForm").reset();
      var editingDone = task.status === "done";
      document.getElementById("completeTaskModalTitle").textContent = editingDone ? "Edit Completion Details" : "Complete Task";
      document.getElementById("completeTaskModalSubtitle").textContent = editingDone
        ? "Update the closing details already recorded for this task."
        : "Capture a few closing details before marking this task done.";
      document.getElementById("saveCompleteTaskBtn").textContent = editingDone ? "Save Changes" : "Mark Complete";
      if (editingDone) {
        if (task.sqft) document.getElementById("ctSqft").value = task.sqft;
        if (task.completionCost) document.getElementById("ctCost").value = task.completionCost;
        if (task.sqft && task.completionCost) document.getElementById("ctRate").value = Math.round((task.completionCost / task.sqft) * 100) / 100;
        if (task.personsCount) document.getElementById("ctPersons").value = task.personsCount;
        if (task.personInCharge) document.getElementById("ctInCharge").value = task.personInCharge;
        if (task.durationDays) document.getElementById("ctDuration").value = task.durationDays;
      } else {
        if (task.durationDays) document.getElementById("ctDuration").value = task.durationDays;
        if (task.sqft) document.getElementById("ctSqft").value = task.sqft;
        var subtaskTotals = subtaskCostTotals(task);
        if (subtaskTotals.count > 0) {
          document.getElementById("ctSqft").value = subtaskTotals.area;
          document.getElementById("ctCost").value = subtaskTotals.cost;
        }
      }
      completeTaskModal.classList.add("show");
    }
    function closeCompleteTaskModal() { pendingCompleteDate = null; completeTaskModal.classList.remove("show"); render(); }
    document.getElementById("closeCompleteTaskModal").addEventListener("click", closeCompleteTaskModal);
    document.getElementById("ctSqft").addEventListener("input", recalcCtCost);
    document.getElementById("ctRate").addEventListener("input", recalcCtCost);
    document.getElementById("cancelCompleteTaskModal").addEventListener("click", closeCompleteTaskModal);
    completeTaskModal.addEventListener("click", function (e) { if (e.target === completeTaskModal) closeCompleteTaskModal(); });
    document.getElementById("saveCompleteTaskBtn").addEventListener("click", function () {
      var today = Data.isoDate(Data.today());
      var wasAlreadyDone = task.status === "done";
      saveTaskPatch({
        status: "done",
        completedAt: pendingCompleteDate || today,
        sqft: Number(document.getElementById("ctSqft").value) || 0,
        completionCost: Number(document.getElementById("ctCost").value) || 0,
        personsCount: Number(document.getElementById("ctPersons").value) || 0,
        personInCharge: document.getElementById("ctInCharge").value.trim(),
        durationDays: Number(document.getElementById("ctDuration").value) || 0
      });
      if (wasAlreadyDone) { syncCompletionReport(task); syncCompletionExpense(task); }
      Data.addTaskActivity(taskId, wasAlreadyDone ? "Completion details updated" : "Task marked complete");
      pendingCompleteDate = null;
      completeTaskModal.classList.remove("show");
      App.showToast(wasAlreadyDone ? "Completion details updated" : "Task marked complete");
      render();
    });

    if (!task) {
      document.getElementById("taskTitleHeading").textContent = "Task not found";
      document.getElementById("taskMeta").textContent = "This task may have been deleted.";
    } else {
      render();
    }
  }
</script>
</body>
</html>
