<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task Detail</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div class="app-shell">
  <div class="sidebar-backdrop"></div>
  <aside class="sidebar" id="sidebar"></aside>

  <div class="main">
    <header class="topbar" id="topbar"></header>

    <main class="content">
      <div class="page-header-row">
        <div><h2 id="taskTitleHeading">Loading…</h2><p id="taskMeta"></p></div>
        <a class="btn btn-outline" id="backLink">&larr; Back to Board</a>
      </div>

      <div id="tabsMount"></div>
      <div id="timelineStrip" class="timeline-strip"></div>
      <div id="pageBody"></div>
    </main>
  </div>
</div>

<div class="modal-overlay" id="editTaskModal">
  <div class="modal-box">
    <div class="modal-header">
      <div><h3>Edit Task</h3><p>Update the core task details.</p></div>
      <button class="modal-close" id="closeEditTaskModal">&times;</button>
    </div>
    <div class="modal-body">
      <form id="editTaskForm">
        <div class="field-grid">
          <div class="field full"><label>Title</label><input type="text" id="etTitle"></div>
          <div class="field full"><label>Assignee</label><input type="text" id="etAssignee"></div>
          <div class="field"><label>Date</label><input type="date" id="etDate"></div>
          <div class="field full"><label>Notes</label><textarea id="etNotes" rows="4"></textarea></div>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" id="cancelEditTaskModal">Cancel</button>
      <button class="btn btn-primary" id="saveEditTaskBtn">Save Changes</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="completeTaskModal">
  <div class="modal-box">
    <div class="modal-header">
      <div><h3>Complete Task</h3><p>Capture a few closing details before marking this task done.</p></div>
      <button class="modal-close" id="closeCompleteTaskModal">&times;</button>
    </div>
    <div class="modal-body">
      <form id="completeTaskForm">
        <div class="field-grid">
          <div class="field"><label>Area (sqft)</label><input type="number" id="ctSqft" min="0"></div>
          <div class="field"><label>Cost (₹)</label><input type="number" id="ctCost" min="0"></div>
          <div class="field"><label>No. of Persons</label><input type="number" id="ctPersons" min="0"></div>
          <div class="field"><label>Person in Charge</label><input type="text" id="ctInCharge"></div>
          <div class="field"><label>Duration (days)</label><input type="number" id="ctDuration" min="0"></div>
          <div class="field full"><label>Material Used</label><input type="text" id="ctMaterial" placeholder="e.g. Cement, Sand, Bricks"></div>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" id="cancelCompleteTaskModal">Cancel</button>
      <button class="btn btn-primary" id="saveCompleteTaskBtn">Mark Complete</button>
    </div>
  </div>
</div>

<script src="assets/data.js"></script>
<script src="assets/business.js"></script>
<script src="assets/app.js"></script>
<script src="assets/charts.js"></script>
<script>
  App.requireAuth();
  var projectId = new URLSearchParams(window.location.search).get("id");
  var taskId = new URLSearchParams(window.location.search).get("task");
  var project = Data.getProjects().find(function (p) { return p.id === projectId; });
  App.renderShell({ active: "projects", title: project ? project.name : "Project", subtitle: "Task detail" });

  function statusPillClass(key) { return key === "done" ? "delivered" : key === "todo" ? "pending" : "confirmed"; }

  document.getElementById("backLink").href = "project-tasks.html?id=" + projectId;

  if (!project || !App.guardProjectAccess(projectId)) {
    document.getElementById("taskTitleHeading").textContent = project ? "Access restricted" : "Project not found";
  } else {
    document.getElementById("tabsMount").innerHTML = App.projectTabsHtml(projectId, "tasks");
    var canUpdate = App.can("progress", "update");
    var canDelete = App.can("progress", "delete");

    var task = Data.getTasks().find(function (t) { return t.id === taskId && t.projectId === projectId; });

    function statusColumns() { return Business.getProjectStatusColumns(projectId); }
    function statusMeta(key) { return statusColumns().find(function (s) { return s.key === key; }) || { key: key, label: key }; }

    function creatorName(userId) {
      var u = Data.getUsers().find(function (x) { return x.id === userId; });
      return u ? u.name : "—";
    }

    function renderTimeline() {
      var createdText = task.createdAt ? Data.displayDate(task.createdAt) + " by " + creatorName(task.createdBy) : "—";
      var completedText = task.completedAt ? Data.displayDate(task.completedAt) : "Not yet completed";
      document.getElementById("timelineStrip").innerHTML =
        '<div class="timeline-step"><span class="timeline-dot done"></span><div><strong>Created</strong><span>' + createdText + '</span></div></div>' +
        '<div class="timeline-connector"></div>' +
        '<div class="timeline-step"><span class="timeline-dot ' + (task.completedAt ? "done" : "pending") + '"></span><div><strong>Completed</strong><span>' + completedText + '</span></div></div>';
    }

    function render() {
      document.getElementById("taskTitleHeading").textContent = task.title;
      document.getElementById("taskMeta").textContent = project.name + " · " + project.code;
      renderTimeline();

      document.getElementById("pageBody").innerHTML =
        '<div class="detail-grid">' +
          '<div class="detail-card">' +
            '<div class="detail-card-header"><span class="card-header-icon">' + App.svg("columns") + '</span>Task Details<span class="status-pill ' + statusPillClass(task.status) + '" style="margin-left:auto">' + statusMeta(task.status).label + '</span>' +
              (canUpdate ? '<button type="button" class="btn btn-outline" id="openEditTaskBtn" style="margin-left:10px;padding:6px 12px;font-size:12px">' + App.svg("edit") + ' Edit</button>' : '') +
            '</div>' +
            '<div style="padding:20px">' +
              '<div class="field-grid">' +
                '<div class="field full"><label>Title</label><input type="text" id="tdTitle"></div>' +
                '<div class="field"><label>Status</label><select id="tdStatus"></select></div>' +
                '<div class="field"><label>Date</label><input type="date" id="tdDate"></div>' +
                '<div class="field full">' +
                  '<label>Assignee</label>' +
                  '<div style="display:flex;gap:8px">' +
                    '<input type="text" id="tdAssignee" placeholder="Labourer / team" style="flex:1">' +
                    (canUpdate ? '<button type="button" class="btn btn-outline" id="assignToMeBtn">Assign to me</button>' : '') +
                  '</div>' +
                '</div>' +
                '<div class="field full"><label>Description / Notes</label><textarea id="tdNotes" rows="5" placeholder="Add details, blockers, or context about this task..."></textarea></div>' +
              '</div>' +
              (task.completedAt ? completionDetailsHtml() : "") +
              (canDelete ?
              '<div style="margin-top:20px;padding-top:20px;border-top:1px solid var(--border)">' +
                '<button type="button" class="btn btn-outline" id="tdDeleteTask" style="color:var(--danger);border-color:var(--danger);width:100%">' + App.svg("trash") + ' Delete Task</button>' +
              '</div>' : '') +
            '</div>' +
          '</div>' +
          '<div class="detail-card">' +
            '<div class="detail-card-header"><span class="card-header-icon">' + App.svg("clock") + '</span>Activity</div>' +
            '<div id="activityFeed" style="padding:18px 20px"></div>' +
          '</div>' +
        '</div>';

      var statusSelect = document.getElementById("tdStatus");
      statusSelect.innerHTML = statusColumns().map(function (s) { return '<option value="' + s.key + '">' + s.label + '</option>'; }).join("");
      statusSelect.value = task.status;

      document.getElementById("tdTitle").value = task.title;
      document.getElementById("tdAssignee").value = task.assignee || "";
      document.getElementById("tdDate").value = task.date || "";
      document.getElementById("tdNotes").value = task.notes || "";

      var readOnly = !canUpdate;
      ["tdTitle", "tdStatus", "tdAssignee", "tdDate", "tdNotes"].forEach(function (id) {
        document.getElementById(id).disabled = readOnly;
      });

      renderActivity();
      wireEvents();
    }

    function completionDetailsHtml() {
      return '<div class="field-group-divider">Completion Details</div>' +
        '<div class="view-detail-grid">' +
          '<div class="view-detail-item"><span>Area</span><strong>' + (task.sqft || 0) + ' sqft</strong></div>' +
          '<div class="view-detail-item"><span>Cost</span><strong>₹' + (task.completionCost || 0) + '</strong></div>' +
          '<div class="view-detail-item"><span>No. of Persons</span><strong>' + (task.personsCount || 0) + '</strong></div>' +
          '<div class="view-detail-item"><span>Person in Charge</span><strong>' + (task.personInCharge || "—") + '</strong></div>' +
          '<div class="view-detail-item"><span>Duration</span><strong>' + (task.durationDays || 0) + ' day(s)</strong></div>' +
          '<div class="view-detail-item"><span>Material Used</span><strong>' + (task.materialUsed || "—") + '</strong></div>' +
        '</div>';
    }

    function renderActivity() {
      var entries = Data.getTaskActivity().filter(function (a) { return a.taskId === taskId; })
        .sort(function (a, b) { return a.date < b.date ? 1 : (a.date > b.date ? -1 : (a.id < b.id ? 1 : -1)); });
      var feedEl = document.getElementById("activityFeed");
      feedEl.innerHTML = entries.length
        ? '<div class="activity-list">' + entries.map(function (a) {
            return '<div class="activity-item"><div class="activity-dot"></div><div><p>' + a.message + '</p><span>' + Data.displayDate(a.date) + '</span></div></div>';
          }).join("") + '</div>'
        : '<div class="empty-state compact">' + App.svg("clock") + '<p>No activity logged yet.</p></div>';
    }

    function saveTaskPatch(patch) {
      var tasks = Data.getTasks();
      var t = tasks.find(function (x) { return x.id === taskId; });
      if (!t) return;
      var wasDone = t.status === "done";
      Object.assign(t, patch);
      Data.saveTasks(tasks);
      task = t;
      if (!wasDone && t.status === "done") syncCompletionReport(t);
    }

    /* Mirrors the same auto-report logic used on the board — completing a task
       from its detail page should log a work report exactly like completing it on the board. */
    function syncCompletionReport(t) {
      var reports = Data.getWorkReports();
      var existing = reports.find(function (r) { return r.taskId === t.id && r.source === "task_complete"; });
      var today = Data.isoDate(Data.today());
      if (existing) {
        existing.date = today;
        existing.title = t.title;
        existing.description = "Task completed: " + t.title + (t.assignee ? " (" + t.assignee + ")" : "") + ".";
      } else {
        reports.push({
          id: Data.uid("wr"), projectId: projectId, date: today, title: t.title,
          description: "Task completed: " + t.title + (t.assignee ? " (" + t.assignee + ")" : "") + ".",
          source: "task_complete", taskId: t.id
        });
      }
      Data.saveWorkReports(reports);
    }

    function wireEvents() {
      if (!canUpdate) return;

      document.getElementById("tdTitle").addEventListener("change", function () {
        saveTaskPatch({ title: this.value.trim() || "Untitled task" });
        document.getElementById("taskTitleHeading").textContent = task.title;
      });
      document.getElementById("tdStatus").addEventListener("change", function () {
        var newStatus = this.value;
        var select = this;
        if (newStatus === "done" && task.status !== "done") {
          openCompleteTaskModal();
          return;
        }
        var oldStatus = task.status;
        saveTaskPatch({ status: newStatus });
        Data.addTaskActivity(taskId, "Status changed from " + statusMeta(oldStatus).label + " to " + statusMeta(newStatus).label);
        render();
        App.showToast("Status updated to " + statusMeta(task.status).label);
      });
      document.getElementById("tdAssignee").addEventListener("change", function () { saveTaskPatch({ assignee: this.value.trim() }); });
      document.getElementById("tdDate").addEventListener("change", function () { saveTaskPatch({ date: this.value }); });
      document.getElementById("tdNotes").addEventListener("change", function () { saveTaskPatch({ notes: this.value }); });

      var assignBtn = document.getElementById("assignToMeBtn");
      if (assignBtn) assignBtn.addEventListener("click", function () {
        var me = App.getCurrentUser();
        if (!me) return;
        document.getElementById("tdAssignee").value = me.name;
        saveTaskPatch({ assignee: me.name });
        App.showToast("Assigned to you");
      });

      var deleteBtn = document.getElementById("tdDeleteTask");
      if (deleteBtn) deleteBtn.addEventListener("click", function () {
        if (!confirm("Delete this task?")) return;
        Data.saveTasks(Data.getTasks().filter(function (t) { return t.id !== taskId; }));
        App.showToast("Task removed");
        window.location.href = "project-tasks.html?id=" + projectId;
      });

      var editBtn = document.getElementById("openEditTaskBtn");
      if (editBtn) editBtn.addEventListener("click", openEditTaskModal);
    }

    var editTaskModal = document.getElementById("editTaskModal");
    function openEditTaskModal() {
      document.getElementById("etTitle").value = task.title;
      document.getElementById("etAssignee").value = task.assignee || "";
      document.getElementById("etDate").value = task.date || "";
      document.getElementById("etNotes").value = task.notes || "";
      editTaskModal.classList.add("show");
    }
    function closeEditTaskModal() { editTaskModal.classList.remove("show"); }
    document.getElementById("closeEditTaskModal").addEventListener("click", closeEditTaskModal);
    document.getElementById("cancelEditTaskModal").addEventListener("click", closeEditTaskModal);
    editTaskModal.addEventListener("click", function (e) { if (e.target === editTaskModal) closeEditTaskModal(); });
    document.getElementById("saveEditTaskBtn").addEventListener("click", function () {
      saveTaskPatch({
        title: document.getElementById("etTitle").value.trim() || task.title,
        assignee: document.getElementById("etAssignee").value.trim(),
        date: document.getElementById("etDate").value,
        notes: document.getElementById("etNotes").value.trim()
      });
      Data.addTaskActivity(taskId, "Task details edited");
      closeEditTaskModal();
      App.showToast("Task updated");
      render();
    });

    var completeTaskModal = document.getElementById("completeTaskModal");
    function openCompleteTaskModal() {
      document.getElementById("completeTaskForm").reset();
      completeTaskModal.classList.add("show");
    }
    function closeCompleteTaskModal() { completeTaskModal.classList.remove("show"); render(); }
    document.getElementById("closeCompleteTaskModal").addEventListener("click", closeCompleteTaskModal);
    document.getElementById("cancelCompleteTaskModal").addEventListener("click", closeCompleteTaskModal);
    completeTaskModal.addEventListener("click", function (e) { if (e.target === completeTaskModal) closeCompleteTaskModal(); });
    document.getElementById("saveCompleteTaskBtn").addEventListener("click", function () {
      var today = Data.isoDate(Data.today());
      saveTaskPatch({
        status: "done",
        completedAt: today,
        sqft: Number(document.getElementById("ctSqft").value) || 0,
        completionCost: Number(document.getElementById("ctCost").value) || 0,
        personsCount: Number(document.getElementById("ctPersons").value) || 0,
        personInCharge: document.getElementById("ctInCharge").value.trim(),
        durationDays: Number(document.getElementById("ctDuration").value) || 0,
        materialUsed: document.getElementById("ctMaterial").value.trim()
      });
      Data.addTaskActivity(taskId, "Task marked complete");
      completeTaskModal.classList.remove("show");
      App.showToast("Task marked complete");
      render();
    });

    if (!task) {
      document.getElementById("taskTitleHeading").textContent = "Task not found";
      document.getElementById("taskMeta").textContent = "This task may have been deleted.";
    } else {
      render();
    }
  }
</script>
</body>
</html>
