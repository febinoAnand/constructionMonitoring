<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customer Ledger</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div class="app-shell">
  <div class="sidebar-backdrop"></div>
  <aside class="sidebar" id="sidebar"></aside>

  <div class="main">
    <header class="topbar" id="topbar"></header>

    <main class="content">
      <div class="page-header-row">
        <div><h2 id="custName">Loading…</h2><p id="custMeta"></p></div>
        <a class="btn btn-outline" href="customers.html">&larr; Back to Customers</a>
      </div>
      <div id="pageBody"></div>
    </main>
  </div>
</div>

<div class="modal-overlay" id="addLedgerModal">
  <div class="modal-box">
    <div class="modal-header">
      <div><h3>Add Ledger Entry</h3><p>Record a new invoice or receipt for this customer.</p></div>
      <button class="modal-close" id="closeAddLedgerModal">&times;</button>
    </div>
    <div class="modal-body">
      <form id="ledgerForm">
        <div class="field-grid">
          <div class="field"><label>Type</label><select id="fType"><option value="invoice">Invoice (billed)</option><option value="receipt">Receipt (payment received)</option></select></div>
          <div class="field"><label>Project</label><select id="fProject"><option value="">— No project —</option></select></div>
          <div class="field"><label>Amount (₹)</label><input type="number" id="fAmount" min="0" required></div>
          <div class="field"><label>Date</label><input type="date" id="fDate"></div>
          <div class="field full"><label>Description / Invoice #</label><input type="text" id="fDesc"></div>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" id="cancelAddLedgerModal">Cancel</button>
      <button class="btn btn-primary" id="saveAddLedgerBtn">+ Add Entry</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="ledgerEditModal">
  <div class="modal-box">
    <div class="modal-header">
      <div><h3>Edit Ledger Entry</h3><p>Adjust this billing entry.</p></div>
      <button class="modal-close" id="closeLedgerEditModal">&times;</button>
    </div>
    <div class="modal-body">
      <form id="ledgerEditForm">
        <input type="hidden" id="eId">
        <div class="field-grid">
          <div class="field"><label>Type</label><select id="eType"><option value="invoice">Invoice (billed)</option><option value="receipt">Receipt (payment received)</option></select></div>
          <div class="field"><label>Project</label><select id="eProject"><option value="">— No project —</option></select></div>
          <div class="field"><label>Amount (₹)</label><input type="number" id="eAmount" min="0" required></div>
          <div class="field"><label>Date</label><input type="date" id="eDate"></div>
          <div class="field full"><label>Description / Invoice #</label><input type="text" id="eDesc"></div>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" id="cancelLedgerEditModal">Cancel</button>
      <button class="btn btn-primary" id="saveLedgerEditBtn">Save Changes</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="downloadModal">
  <div class="modal-box">
    <div class="modal-header">
      <div><h3>Download Ledger History</h3><p>Choose a date range to export.</p></div>
      <button class="modal-close" id="closeDownloadModal">&times;</button>
    </div>
    <div class="modal-body">
      <form id="downloadForm">
        <div class="field-grid">
          <div class="field"><label>From Date</label><input type="date" id="dlFrom"></div>
          <div class="field"><label>To Date</label><input type="date" id="dlTo"></div>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" id="cancelDownloadModal">Cancel</button>
      <button class="btn btn-primary" id="confirmDownloadBtn">Download</button>
    </div>
  </div>
</div>

<script src="assets/data.js"></script>
<script src="assets/business.js"></script>
<script src="assets/app.js"></script>
<script src="assets/charts.js"></script>
<script>
  App.requireAuth();
  App.renderShell({ active: "customers", title: "Customer Ledger", subtitle: "Billing history" });

  if (!App.guardPermission("customers", "read")) {
    document.querySelector(".content").style.display = "none";
  } else {
    var custId = new URLSearchParams(window.location.search).get("id");
    var cust = Data.getCustomers().find(function (c) { return c.id === custId; });
    var canAddEntry = App.can("customers", "create");
    var canDeleteEntry = App.can("customers", "delete");

    if (!cust) {
      document.getElementById("custName").textContent = "Customer not found";
    } else {
      document.getElementById("custName").textContent = cust.name;
      document.getElementById("custMeta").textContent = (cust.contactPerson || "No contact set") + " · " + (cust.phone || "No phone");

      var linkedProjects = Business.getCustomerProjects(custId);

      document.getElementById("pageBody").innerHTML =
        '<div class="stat-grid stat-grid-tight" id="statGrid"></div>' +
        '<div class="detail-grid">' +
          '<div class="detail-card">' +
            '<div class="detail-card-header"><span class="card-header-icon">' + App.svg("briefcase") + '</span>Customer Info</div>' +
            '<div class="detail-rows" id="infoRows"></div>' +
          '</div>' +
          '<div class="detail-card">' +
            '<div class="detail-card-header"><span class="card-header-icon">' + App.svg("wallet") + '</span>Expenses Total</div>' +
            '<div style="padding:18px 20px" id="expensesTotalBox"></div>' +
          '</div>' +
        '</div>' +
        '<div class="panel full-panel">' +
          '<div class="panel-header"><h3>Billing by Project</h3><span class="panel-tag">' + linkedProjects.length + ' project(s)</span></div>' +
          '<div class="table-scroll"><table class="data-table data-table-balanced">' +
            '<colgroup><col style="width:40%"><col style="width:20%"><col style="width:20%"><col style="width:20%"></colgroup>' +
            '<thead><tr><th>Project</th><th class="text-right">Invoiced</th><th class="text-right">Received</th><th class="text-right">Balance Due</th></tr></thead>' +
            '<tbody id="byProjectBody"></tbody><tfoot id="byProjectFoot"></tfoot>' +
          '</table></div>' +
        '</div>' +
        '<div class="panel full-panel">' +
          '<div class="panel-header"><h3>Ledger History</h3>' +
            '<span style="display:flex;align-items:center;gap:12px">' +
              '<span class="panel-tag" id="entryCount"></span>' +
              (canAddEntry ? '<button class="btn btn-primary" id="openAddLedgerBtn" style="padding:8px 16px;font-size:12.5px">+ Add Entry</button>' : '') +
            '</span>' +
          '</div>' +
          '<div class="table-scroll"><table class="data-table"><thead><tr><th>Date</th><th>Type</th><th>Project</th><th>Description</th><th class="text-right">Amount</th><th></th></tr></thead><tbody id="ledgerBody"></tbody></table></div>' +
          '<div class="panel-footer-row"><button class="btn btn-outline" id="downloadBtn">' + App.svg("download") + ' Download</button></div>' +
        '</div>';

      var eProjectSelect = document.getElementById("eProject");
      eProjectSelect.innerHTML += linkedProjects.map(function (p) { return '<option value="' + p.id + '">' + p.name + '</option>'; }).join("");
      var fProjectSelect = document.getElementById("fProject");
      fProjectSelect.innerHTML += linkedProjects.map(function (p) { return '<option value="' + p.id + '">' + p.name + '</option>'; }).join("");

      function row(label, value) {
        return '<div class="detail-row"><span class="detail-label">' + label + '</span><span class="detail-value">' + value + '</span></div>';
      }

      document.getElementById("infoRows").innerHTML =
        row("Company Name", cust.name) +
        row("Contact Person", cust.contactPerson || "—") +
        row("Phone", cust.phone || "—") +
        row("Email", cust.email || "—") +
        row("GSTIN", cust.gstin || "—") +
        row("Address", cust.address || "—") +
        row("Notes", cust.notes || "—");

      var expensesTotalBox = document.getElementById("expensesTotalBox");
      var totalExpenses = Business.getCustomerTotalExpenses(custId);
      expensesTotalBox.innerHTML =
        '<div class="big-stat"><span class="big-stat-value">₹' + Charts.fmtCompact(totalExpenses) + '</span><span class="big-stat-label">Total cash spent across ' + linkedProjects.length + ' linked project(s)</span></div>';

      function renderLedger() {
        var l = Business.getCustomerLedger(custId);
        document.getElementById("statGrid").innerHTML =
          '<div class="stat-card"><div class="stat-icon icon-blue">' + App.svg("fileText") + '</div><div class="stat-value">₹' + Charts.fmtCompact(l.invoiced) + '</div><div class="stat-label">Total invoiced</div></div>' +
          '<div class="stat-card"><div class="stat-icon icon-green">' + App.svg("coins") + '</div><div class="stat-value">₹' + Charts.fmtCompact(l.received) + '</div><div class="stat-label">Total received</div></div>' +
          '<div class="stat-card"><div class="stat-icon icon-orange">' + App.svg("wallet") + '</div><div class="stat-value">₹' + Charts.fmtCompact(l.balanceDue) + '</div><div class="stat-label">Balance due</div></div>';

        var byProjectBody = document.getElementById("byProjectBody");
        var byProjectFoot = document.getElementById("byProjectFoot");
        if (!linkedProjects.length) {
          byProjectBody.innerHTML = '<tr><td colspan="4"><div class="empty-state compact">' + App.svg("building") + '<p>No projects linked yet.</p></div></td></tr>';
          byProjectFoot.innerHTML = "";
        } else {
          var totalInvoiced = 0, totalReceived = 0;
          byProjectBody.innerHTML = linkedProjects.map(function (p) {
            var pEntries = l.entries.filter(function (e) { return e.projectId === p.id; });
            var pInvoiced = pEntries.filter(function (e) { return e.type === "invoice"; }).reduce(function (s, e) { return s + e.amount; }, 0);
            var pReceived = pEntries.filter(function (e) { return e.type === "receipt"; }).reduce(function (s, e) { return s + e.amount; }, 0);
            totalInvoiced += pInvoiced;
            totalReceived += pReceived;
            return '<tr>' +
              '<td><a href="project-overview.html?id=' + p.id + '"><strong>' + p.name + '</strong></a> <span class="cell-mono">' + p.code + '</span></td>' +
              '<td class="total-amount text-right">₹' + Charts.fmtCompact(pInvoiced) + '</td>' +
              '<td class="total-amount text-right">₹' + Charts.fmtCompact(pReceived) + '</td>' +
              '<td class="total-amount text-right">₹' + Charts.fmtCompact(pInvoiced - pReceived) + '</td>' +
            '</tr>';
          }).join("");
          byProjectFoot.innerHTML = '<tr class="table-total-row"><td>Total</td><td class="total-amount text-right">₹' + Charts.fmtCompact(totalInvoiced) + '</td><td class="total-amount text-right">₹' + Charts.fmtCompact(totalReceived) + '</td><td class="total-amount text-right">₹' + Charts.fmtCompact(totalInvoiced - totalReceived) + '</td></tr>';
        }

        var entries = l.entries.slice().sort(function (a, b) { return a.date < b.date ? 1 : -1; });
        document.getElementById("entryCount").textContent = entries.length + " entries";
        var body = document.getElementById("ledgerBody");
        if (!entries.length) {
          body.innerHTML = '<tr><td colspan="6"><div class="empty-state compact">' + App.svg("wallet") + '<p>No billing history yet.</p></div></td></tr>';
          return;
        }
        body.innerHTML = entries.map(function (e) {
          var proj = Data.getProjects().find(function (p) { return p.id === e.projectId; });
          return '<tr>' +
            '<td>' + Data.displayDate(e.date) + '</td>' +
            '<td><span class="chip ' + (e.type === "invoice" ? "chip-amber" : "chip-green") + '">' + (e.type === "invoice" ? "Invoice" : "Receipt") + '</span></td>' +
            '<td>' + (proj ? proj.name : "—") + '</td>' +
            '<td><span class="desc-cell">' + (e.description || "—") + (e.invoiceNumber ? ' (' + e.invoiceNumber + ')' : "") + '</span></td>' +
            '<td class="total-amount text-right">₹' + e.amount + '</td>' +
            '<td><div class="action-buttons-row">' +
              (canAddEntry ? '<button class="action-trigger" data-edit="' + e.id + '">' + App.svg("edit") + '</button>' : "") +
              (canDeleteEntry ? '<button class="action-trigger" data-del="' + e.id + '">' + App.svg("trash") + '</button>' : "") +
            '</div></td>' +
          '</tr>';
        }).join("");
      }

      document.getElementById("pageBody").addEventListener("click", function (e) {
        var del = e.target.closest("[data-del]");
        if (del) {
          Data.saveCustomerLedger(Data.getCustomerLedger().filter(function (x) { return x.id !== del.getAttribute("data-del"); }));
          App.showToast("Entry removed");
          renderLedger();
          return;
        }
        var edit = e.target.closest("[data-edit]");
        if (edit) { openLedgerEditModal(edit.getAttribute("data-edit")); return; }
      });

      var ledgerEditModal = document.getElementById("ledgerEditModal");
      function openLedgerEditModal(id) {
        var entry = Data.getCustomerLedger().find(function (x) { return x.id === id; });
        if (!entry) return;
        document.getElementById("eId").value = entry.id;
        document.getElementById("eType").value = entry.type;
        document.getElementById("eProject").value = entry.projectId || "";
        document.getElementById("eAmount").value = entry.amount;
        document.getElementById("eDate").value = entry.date;
        document.getElementById("eDesc").value = entry.description || "";
        ledgerEditModal.classList.add("show");
      }
      function closeLedgerEditModal() { ledgerEditModal.classList.remove("show"); }
      document.getElementById("closeLedgerEditModal").addEventListener("click", closeLedgerEditModal);
      document.getElementById("cancelLedgerEditModal").addEventListener("click", closeLedgerEditModal);
      ledgerEditModal.addEventListener("click", function (e) { if (e.target === ledgerEditModal) closeLedgerEditModal(); });
      document.getElementById("saveLedgerEditBtn").addEventListener("click", function () {
        var id = document.getElementById("eId").value;
        var amount = Number(document.getElementById("eAmount").value);
        if (!amount) { App.showToast("Enter an amount", true); return; }
        var entries = Data.getCustomerLedger().map(function (x) {
          if (x.id !== id) return x;
          return Object.assign({}, x, {
            type: document.getElementById("eType").value,
            projectId: document.getElementById("eProject").value || null,
            amount: amount,
            date: document.getElementById("eDate").value,
            description: document.getElementById("eDesc").value.trim()
          });
        });
        Data.saveCustomerLedger(entries);
        App.showToast("Ledger entry updated");
        closeLedgerEditModal();
        renderLedger();
      });

      var downloadModal = document.getElementById("downloadModal");
      var downloadBtnEl = document.getElementById("downloadBtn");
      if (downloadBtnEl) downloadBtnEl.addEventListener("click", function () {
        document.getElementById("dlFrom").value = "";
        document.getElementById("dlTo").value = Data.isoDate(Data.today());
        downloadModal.classList.add("show");
      });
      document.getElementById("closeDownloadModal").addEventListener("click", function () { downloadModal.classList.remove("show"); });
      document.getElementById("cancelDownloadModal").addEventListener("click", function () { downloadModal.classList.remove("show"); });
      downloadModal.addEventListener("click", function (e) { if (e.target === downloadModal) downloadModal.classList.remove("show"); });
      document.getElementById("confirmDownloadBtn").addEventListener("click", function () {
        downloadModal.classList.remove("show");
        App.showToast("Your file is downloading...");
      });

      var addLedgerModal = document.getElementById("addLedgerModal");
      var openAddLedgerBtnEl = document.getElementById("openAddLedgerBtn");
      if (openAddLedgerBtnEl) openAddLedgerBtnEl.addEventListener("click", function () {
        document.getElementById("ledgerForm").reset();
        document.getElementById("fDate").value = Data.isoDate(Data.today());
        addLedgerModal.classList.add("show");
      });
      function closeAddLedgerModal() { addLedgerModal.classList.remove("show"); }
      document.getElementById("closeAddLedgerModal").addEventListener("click", closeAddLedgerModal);
      document.getElementById("cancelAddLedgerModal").addEventListener("click", closeAddLedgerModal);
      addLedgerModal.addEventListener("click", function (e) { if (e.target === addLedgerModal) closeAddLedgerModal(); });
      document.getElementById("saveAddLedgerBtn").addEventListener("click", function () {
        var amount = Number(document.getElementById("fAmount").value);
        if (!amount) { App.showToast("Enter an amount", true); return; }
        var entries = Data.getCustomerLedger();
        entries.push({
          id: Data.uid("cl"), customerId: custId, projectId: document.getElementById("fProject").value || null,
          type: document.getElementById("fType").value, amount: amount,
          date: document.getElementById("fDate").value,
          description: document.getElementById("fDesc").value.trim(), invoiceNumber: ""
        });
        Data.saveCustomerLedger(entries);
        App.showToast("Ledger entry added");
        closeAddLedgerModal();
        renderLedger();
      });

      renderLedger();
    }
  }
</script>
</body>
</html>
